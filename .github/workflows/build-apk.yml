name: Build APK from HTML

on:
  workflow_dispatch:  # Ручной запуск
  push:
    branches: [ main ]
    paths:
      - 'www/**'  # Запускать только при изменениях в папке www

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'
        
    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli
      
    - name: Create project directory
      run: mkdir -p twa-project
      
    - name: Initialize TWA project
      run: |
        cd twa-project
        bubblewrap init --manifest-url="https://your-domain.com/manifest.json"
      continue-on-error: true
      
    - name: Create TWA configuration
      run: |
        cd twa-project
        cat > twa-manifest.json << 'EOF'
        {
          "packageId": "com.example.helloapk",
          "host": "localhost",
          "name": "Hello APK",
          "launcherName": "Hello APK",
          "display": "standalone",
          "themeColor": "#4CAF50",
          "backgroundColor": "#FFFFFF",
          "startUrl": "/",
          "iconUrl": "https://via.placeholder.com/512/4CAF50/FFFFFF?text=HA",
          "maskableIconUrl": "https://via.placeholder.com/512/4CAF50/FFFFFF?text=HA",
          "splashScreenFadeOutDuration": 300,
          "signingKey": {
            "path": "./android.keystore",
            "alias": "android"
          }
        }
        EOF
        
    - name: Generate signing key
      run: |
        cd twa-project
        keytool -genkey -v \
          -keystore android.keystore \
          -alias android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Android, OU=Dev, O=Company, L=City, S=State, C=US"
          
    - name: Update TWA project with local files
      run: |
        cd twa-project
        # Создаем структуру для локального веб-приложения
        mkdir -p app/src/main/assets
        # Копируем все файлы из www в assets
        cp -r ../www/* app/src/main/assets/
        
        # Обновляем конфигурацию для работы с локальными файлами
        cat > app/build.gradle << 'GRADLE'
        plugins {
            id 'com.android.application'
        }
        
        android {
            namespace 'com.example.helloapk'
            compileSdk 34
            
            defaultConfig {
                applicationId "com.example.helloapk"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            
            signingConfigs {
                release {
                    storeFile file('../android.keystore')
                    storePassword 'android'
                    keyAlias 'android'
                    keyPassword 'android'
                }
            }
            
            buildTypes {
                release {
                    minifyEnabled true
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                    signingConfig signingConfigs.release
                }
            }
        }
        
        dependencies {
            implementation 'androidx.webkit:webkit:1.8.0'
        }
        GRADLE
        
        # Создаем MainActivity
        mkdir -p app/src/main/java/com/example/helloapk
        cat > app/src/main/java/com/example/helloapk/MainActivity.java << 'JAVA'
        package com.example.helloapk;
        
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.webkit.WebSettings;
        
        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                WebView webView = new WebView(this);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setAllowFileAccess(true);
                webSettings.setAllowContentAccess(true);
                webSettings.setDomStorageEnabled(true);
                
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
                
                setContentView(webView);
            }
        }
        JAVA
        
        # Создаем AndroidManifest.xml
        cat > app/src/main/AndroidManifest.xml << 'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            
            <uses-permission android:name="android.permission.INTERNET" />
            
            <application
                android:allowBackup="true"
                android:label="Hello APK"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                
                <activity
                    android:name=".MainActivity"
                    android:configChanges="orientation|screenSize"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        XML
        
    - name: Build APK
      run: |
        cd twa-project
        # Создаем local.properties для Android SDK
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        
        # Создаем settings.gradle
        echo "include ':app'" > settings.gradle
        
        # Создаем корневой build.gradle
        cat > build.gradle << 'GRADLE'
        plugins {
            id 'com.android.application' version '8.2.0' apply false
        }
        GRADLE
        
        # Собираем APK
        ./gradlew assembleRelease --no-daemon
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hello-APK
        path: twa-project/app/build/outputs/apk/release/*.apk
        retention-days: 90

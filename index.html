<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChugurAI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", system-ui, sans-serif; background: radial-gradient(circle at 50% 0%, #1b2a4a, #0a0f1c 70%); color: #e8eefc; padding: 20px; }
  .card { width: 100%; max-width: 460px; background: rgba(255,255,255,0.05); border: 1px solid rgba(120,180,255,0.25); border-radius: 24px; padding: 28px 24px 32px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.6); backdrop-filter: blur(6px); }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; color: #9cc4ff; letter-spacing: 1px; }
  .subtitle { font-size: 13px; color: #7f93b5; margin-bottom: 22px; }
  
  /* Робот */
  .robot { width: 110px; height: 110px; margin: 0 auto 22px; position: relative; filter: drop-shadow(0 0 18px rgba(90,170,255,.55)); }
  .antenna { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); width: 4px; height: 18px; background: #5aa8ff; border-radius: 2px; }
  .antenna::after { content: ""; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; border-radius: 50%; background: #ff5c8a; box-shadow: 0 0 12px #ff5c8a; animation: blink 1.6s infinite; }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .head { width: 110px; height: 96px; margin-top: 14px; background: linear-gradient(160deg, #2d4a7a, #16233c); border: 2px solid #5aa8ff; border-radius: 26px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; padding-top: 26px; gap: 16px; position: relative; }
  .eye { width: 18px; height: 18px; border-radius: 50%; background: #7ef0ff; box-shadow: 0 0 14px #7ef0ff; transition: .15s; }
  .mouth { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); width: 34px; height: 6px; border-radius: 4px; background: #7ef0ff; box-shadow: 0 0 12px #7ef0ff; transition: .15s; }
  .robot.talking .mouth { animation: talk .28s infinite alternate; }
  @keyframes talk { from { height: 6px; width: 34px; } to { height: 20px; width: 26px; } }
  .robot.listening .head { border-color: #4dffa6; box-shadow: 0 0 25px rgba(77,255,166,.6); }
  .robot.listening .eye { background: #4dffa6; box-shadow: 0 0 14px #4dffa6; }
  
  /* Кнопка */
  .mic-btn { width: 92px; height: 92px; border-radius: 50%; border: none; cursor: pointer; background: linear-gradient(145deg, #3d8bff, #1f4fb8); box-shadow: 0 10px 30px rgba(61,139,255,.45); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; transition: transform .15s; }
  .mic-btn:hover { transform: scale(1.06); }
  .mic-btn:active { transform: scale(.96); }
  .mic-btn svg { width: 40px; height: 40px; fill: #fff; }
  .mic-btn.active { background: linear-gradient(145deg, #ff4d6d, #b81f3f); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,77,109,.7); } 70% { box-shadow: 0 0 0 26px rgba(255,77,109,0); } 100% { box-shadow: 0 0 0 0 rgba(255,77,109,0); } }
  
  /* Тексты */
  .status { font-size: 13px; color: #7f93b5; min-height: 18px; margin-bottom: 14px; }
  .bubble { background: rgba(120,180,255,.08); border: 1px solid rgba(120,180,255,.2); border-radius: 14px; padding: 12px 14px; font-size: 15px; line-height: 1.45; text-align: left; margin-bottom: 10px; min-height: 44px; color: #cfe1ff; word-break: break-word; }
  .bubble .label { display: block; font-size: 11px; text-transform: uppercase; color: #5aa8ff; margin-bottom: 4px; }
  .bubble.reply .label { color: #4dffa6; }
  .text-input { width: 100%; margin-top: 14px; padding: 11px 14px; border-radius: 12px; border: 1px solid rgba(120,180,255,.25); background: rgba(255,255,255,.04); color: #e8eefc; font-size: 14px; outline: none; }
  .text-input:focus { border-color: #5aa8ff; }
</style>
</head>
<body>

<div class="card">
  <h1>🤖 ChugurAI</h1>
  <p class="subtitle">Твой умный собеседник</p>

  <div class="robot" id="robot">
    <div class="antenna"></div>
    <div class="head">
      <div class="eye"></div>
      <div class="eye"></div>
      <div class="mouth"></div>
    </div>
  </div>

  <button class="mic-btn" id="micBtn" title="Говорить">
    <svg viewBox="0 0 24 24">
      <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
      <path d="M19 12a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-2.06A9 9 0 0 0 21 12h-2z"/>
    </svg>
  </button>

  <div class="status" id="status">Нажми на кнопку или напиши сообщение</div>

  <div class="bubble"><span class="label">Ты сказал</span><span id="heardText">—</span></div>
  <div class="bubble reply"><span class="label">ChugurAI</span><span id="replyText">—</span></div>

  <input class="text-input" id="textInput" type="text" placeholder="Напиши сообщение и нажми Enter…" autocomplete="off">
</div>

<script>
const micBtn = document.getElementById('micBtn');
const robot = document.getElementById('robot');
const statusEl = document.getElementById('status');
const heardText = document.getElementById('heardText');
const replyText = document.getElementById('replyText');
const textInput = document.getElementById('textInput');

/* ==========================================
   1. РАСПОЗНАВАНИЕ РЕЧИ (Микрофон)
   ========================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;

if (SR) {
  recognition = new SR();
  recognition.lang = 'ru-RU';
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add('active');
    robot.classList.add('listening');
    statusEl.textContent = '🎤 Слушаю…';
  };
  recognition.onresult = (event) => handleUserText(event.results[0][0].transcript);
  recognition.onerror = (event) => {
    statusEl.textContent = event.error === 'not-allowed' ? '❌ Нет доступа к микрофону.' : '🔇 Ошибка: ' + event.error;
    stopListeningUI();
  };
  recognition.onend = () => stopListeningUI();
} else {
  statusEl.textContent = '⚠️ Браузер не поддерживает микрофон (используй текст).';
}

function stopListeningUI() {
  isListening = false;
  micBtn.classList.remove('active');
  robot.classList.remove('listening');
  if (statusEl.textContent.startsWith('🎤')) statusEl.textContent = 'Нажми на кнопку или напиши сообщение';
}

micBtn.addEventListener('click', () => {
  if (!recognition) return;
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (isListening) { recognition.stop(); return; }
  try { recognition.start(); } catch (e) {}
});

/* ==========================================
   2. СИНТЕЗ РЕЧИ (Голос робота)
   ========================================== */
let ruVoice = null;
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  ruVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ru')) || null;
}
loadVoices();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = loadVoices;

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ru-RU'; utter.rate = 1; utter.pitch = 1.15;
  if (ruVoice) utter.voice = ruVoice;
  utter.onstart = () => { robot.classList.add('talking'); statusEl.textContent = '🔊 ChugurAI говорит…'; };
  utter.onend = () => { robot.classList.remove('talking'); statusEl.textContent = 'Нажми на кнопку или напиши сообщение'; };
  utter.onerror = () => robot.classList.remove('talking');
  speechSynthesis.speak(utter);
}

/* ==========================================
   3. НЕЙРОСЕТЬ (KeylessAI - Возвращена лучшая)
   ========================================== */
async function getAnswer(input) {
  const systemPrompt = "Ты дружелюбный, умный и немного забавный робот по имени ChugurAI. Отвечай на русском языке кратко (до 3-х предложений), по делу и с легким юмором.";
  
  try {
    // Возвращаем KeylessAI (лучшее качество ответов)
    const response = await fetch('https://keylessai.thryx.workers.dev/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'gpt-4o', // Можно заменить на 'deepseek-chat' при желании
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: input }
        ]
      })
    });

    // Если сработал лимит (45 сек), обрабатываем это
    if (response.status === 429) {
       return "Подожди 45 секунд, я восстанавливаю энергию после прошлого ответа! ⚡";
    }

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();
    return data.choices[0].message.content.trim();

  } catch (error) {
    console.error('Ошибка KeylessAI:', error);
    
    // Если KeylessAI совсем упал, пробуем резервный вариант
    try {
      const fallback = await fetch(`https://text.pollinations.ai/${encodeURIComponent(input)}?model=openai&system=${encodeURIComponent(systemPrompt)}`);
      return (await fallback.text()).trim();
    } catch (fallbackError) {
      return 'Прости, мой искусственный интеллект временно недоступен. Попробуй позже.';
    }
  }
}

/* ==========================================
   4. ЛОГИКА ДИАЛОГА
   ========================================== */
function handleUserText(rawText) {
  const text = rawText.trim();
  if (!text) return;
  
  heardText.textContent = text;
  replyText.textContent = '…';
  statusEl.textContent = '💭 Думаю…';

  getAnswer(text).then(answer => {
    replyText.textContent = answer;
    setTimeout(() => speak(answer), 150);
  });
}

// Обработка ввода с клавиатуры
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = textInput.value.trim();
    if (!val) return;
    if (window.speechSynthesis) speechSynthesis.cancel();
    handleUserText(val);
    textInput.value = '';
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>APK Builder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a2e; color: white; max-width: 500px; margin: 0 auto; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #16213e; color: white; border: 1px solid #333; border-radius: 10px; }
        textarea { height: 300px; }
        button { width: 100%; padding: 15px; background: #e94560; color: white; border: none; border-radius: 50px; font-size: 18px; cursor: pointer; }
        #icon { display: none; }
        .icon-label { display: block; padding: 20px; border: 2px dashed #333; text-align: center; border-radius: 10px; cursor: pointer; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>📱 Создай свой APK</h1>
    
    <label>Название приложения:</label>
    <input id="name" value="Моё приложение" placeholder="Название">
    
    <label>Иконка (png, 512x512):</label>
    <label class="icon-label" for="icon">📸 Выбрать иконку</label>
    <input type="file" id="icon" accept="image/png">
    <img id="preview" style="width: 64px; height: 64px; display: none; margin: 10px auto;">
    
    <label>HTML код:</label>
    <textarea id="html"><!DOCTYPE html>
<html>
<head><style>body{display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(45deg,#667eea,#764ba2);color:white;font-family:Arial;font-size:2em;}</style></head>
<body><h1>🚀 Привет!</h1></body>
</html></textarea>
    
    <button onclick="build()">🔨 СОБРАТЬ APK</button>

    <script>
        document.getElementById('icon').onchange = function(e) {
            var reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('preview').src = event.target.result;
                document.getElementById('preview').style.display = 'block';
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        async function build() {
            var name = document.getElementById('name').value || 'App';
            var html = document.getElementById('html').value;
            var icon = document.getElementById('icon').files[0];
            
            var zip = new JSZip();
            
            zip.file('AndroidManifest.xml', '<?xml version="1.0"?><manifest package="com.myapp" xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="' + name + '"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>');
            
            zip.file('assets/index.html', html);
            zip.file('classes.dex', '');
            
            if (icon) {
                var iconData = await new Promise(resolve => {
                    var reader = new FileReader();
                    reader.onload = e => resolve(e.target.result.split(',')[1]);
                    reader.readAsDataURL(icon);
                });
                zip.file('res/mipmap/ic_launcher.png', iconData, {base64: true});
            }
            
            var blob = await zip.generateAsync({type: 'blob'});
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name.replace(/\s/g, '_') + '.apk';
            a.click();
        }
    </script>
</body>
</html>

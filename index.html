<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Астероиды | Игра для очков</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            /* Фон глубокого космоса */
            background: radial-gradient(ellipse at center, #1b2735 0%, #090a0f 100%);
            touch-action: none; /* Отключаем зум и скролл */
            user-select: none;
        }
        canvas {
            display: block;
        }
        /* Стиль для очков: черная разделительная полоса по центру (помогает глазам) */
        .vr-divider {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: black;
            z-index: 10;
            pointer-events: none;
            opacity: 0.8;
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
            text-shadow: 0 0 20px cyan;
            z-index: 5;
            pointer-events: none;
        }
        #message {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 24px;
            z-index: 5;
            pointer-events: none;
            letter-spacing: 2px;
        }
        /* Кнопка Fullscreen */
        #fs-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(0,0,0,0.5);
            color: white;
            border: 1px solid white;
            padding: 10px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui">СЧЕТ: <span id="score">0</span></div>
    <div id="message">ЦЕЛЬСЯ ВЗГЛЯДОМ • НАЖМИ ИГРАТЬ</div>
    <div class="vr-divider"></div>
    
    <!-- Скрытый канвас -->
    <canvas id="game"></canvas>
    
    <button id="fs-btn">📱 В ЭКРАН</button>

    <script>
        (function() {
            const canvas = document.getElementById('game');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('score');
            const messageDiv = document.getElementById('message');

            let W, H;
            // Прицел в центре (куда смотрит игрок)
            const crosshair = { x: 0, y: 0, radius: 15 };

            // Объекты игры
            let asteroids = [];
            let particles = [];
            let score = 0;
            let gameActive = false;
            let gameOver = false;

            // Параметры спавна
            let spawnTimer = 0;
            const SPAWN_DELAY = 40; // Кадры между появлением
            const ASTEROID_SPEED = 2.5;

            // Астероид
            class Asteroid {
                constructor() {
                    this.reset();
                }
                reset() {
                    // Появляются с краев и летят к центру? Нет, летят в случайном направлении.
                    // Чтобы было интереснее в VR, пусть они летят "на игрока" (из центра наружу) 
                    // или просто хаотично. Сделаем хаос.
                    let edge = Math.floor(Math.random() * 4);
                    if (edge === 0) { // верх
                        this.x = Math.random() * W;
                        this.y = -30;
                    } else if (edge === 1) { // низ
                        this.x = Math.random() * W;
                        this.y = H + 30;
                    } else if (edge === 2) { // лево
                        this.x = -30;
                        this.y = Math.random() * H;
                    } else { // право
                        this.x = W + 30;
                        this.y = Math.random() * H;
                    }
                    
                    // Направление примерно к центру, но с разбросом
                    let angleToCenter = Math.atan2(H/2 - this.y, W/2 - this.x);
                    this.vx = Math.cos(angleToCenter) * ASTEROID_SPEED + (Math.random() - 0.5) * 2;
                    this.vy = Math.sin(angleToCenter) * ASTEROID_SPEED + (Math.random() - 0.5) * 2;
                    
                    this.radius = Math.random() * 25 + 15;
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotSpeed = (Math.random() - 0.5) * 0.1;
                    
                    // Внешний вид
                    this.color = `hsl(${Math.random() * 60 + 10}, 80%, 60%)`; // Огненные оттенки
                    this.vertices = [];
                    let numVerts = Math.floor(Math.random() * 5) + 6;
                    for (let i = 0; i < numVerts; i++) {
                        let angle = (i / numVerts) * Math.PI * 2;
                        let dist = this.radius * (0.7 + Math.random() * 0.5);
                        this.vertices.push({ angle, dist });
                    }
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.rotation += this.rotSpeed;

                    // Удаление, если улетел далеко за экран (а не только коснулся края)
                    if (this.x < -100 || this.x > W + 100 || this.y < -100 || this.y > H + 100) {
                        return false; // Пометить на удаление
                    }
                    return true;
                }

                draw(ctx) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = 'orange';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    // Рисуем неровный круг
                    for (let i = 0; i <= this.vertices.length; i++) {
                        let v = this.vertices[i % this.vertices.length];
                        let x = Math.cos(v.angle) * v.dist;
                        let y = Math.sin(v.angle) * v.dist;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.fill();
                    // Кратер
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.arc(-this.radius*0.2, -this.radius*0.2, this.radius*0.3, 0, Math.PI*2);
                    ctx.fill();
                    ctx.restore();
                }

                contains(px, py) {
                    let dx = px - this.x;
                    let dy = py - this.y;
                    return Math.sqrt(dx*dx + dy*dy) < this.radius;
                }
            }

            // Частицы взрыва
            class Particle {
                constructor(x, y, color) {
                    this.x = x;
                    this.y = y;
                    this.vx = (Math.random() - 0.5) * 8;
                    this.vy = (Math.random() - 0.5) * 8;
                    this.life = 1.0;
                    this.decay = 0.02 + Math.random() * 0.04;
                    this.color = color;
                    this.size = Math.random() * 4 + 2;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life -= this.decay;
                    return this.life > 0;
                }
                draw(ctx) {
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = this.life;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'white';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                }
            }

            function resize() {
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W;
                canvas.height = H;
                crosshair.x = W / 2;
                crosshair.y = H / 2;
            }

            function addExplosion(x, y, color) {
                for (let i = 0; i < 20; i++) {
                    particles.push(new Particle(x, y, color));
                }
                // Виброотклик, если поддерживается
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(30);
                }
            }

            function resetGame() {
                asteroids = [];
                particles = [];
                score = 0;
                scoreSpan.textContent = "0";
                gameActive = true;
                gameOver = false;
                spawnTimer = 0;
                messageDiv.textContent = "ЛОВИ АСТЕРОИДЫ!";
                // Сразу спавним пару штук для интереса
                for (let i = 0; i < 3; i++) {
                    asteroids.push(new Asteroid());
                }
            }

            function shoot() {
                if (!gameActive) {
                    if (gameOver) {
                        resetGame();
                    } else {
                        // Первый старт
                        resetGame();
                    }
                    return;
                }

                let hit = false;
                // Проверяем астероиды от последнего к первому, чтобы корректно удалять
                for (let i = asteroids.length - 1; i >= 0; i--) {
                    if (asteroids[i].contains(crosshair.x, crosshair.y)) {
                        addExplosion(asteroids[i].x, asteroids[i].y, asteroids[i].color);
                        asteroids.splice(i, 1);
                        score++;
                        scoreSpan.textContent = score;
                        hit = true;
                        break; // Один выстрел - одно попадание
                    }
                }

                if (!hit) {
                    // Промах: вибрация и визуальный эффект
                    if (window.navigator && window.navigator.vibrate) {
                        window.navigator.vibrate([50, 30, 50]);
                    }
                    // Встряска экрана (быстрое смещение)
                    canvas.style.transform = 'translate(10px, 5px)';
                    setTimeout(() => { canvas.style.transform = 'translate(-8px, -3px)'; }, 50);
                    setTimeout(() => { canvas.style.transform = 'translate(0, 0)'; }, 100);
                    
                    messageDiv.textContent = "ПРОМАХ!";
                    setTimeout(() => {
                        if (gameActive) messageDiv.textContent = "ЦЕЛЬСЯ ВЗГЛЯДОМ";
                    }, 500);
                } else {
                    messageDiv.textContent = "ОТЛИЧНО!";
                    setTimeout(() => {
                        if (gameActive) messageDiv.textContent = "ЦЕЛЬСЯ ВЗГЛЯДОМ";
                    }, 300);
                }
            }

            // Игровой цикл
            function gameLoop() {
                if (!gameActive && !gameOver) {
                    // Рисуем стартовый экран
                    ctx.clearRect(0, 0, W, H);
                    drawStars();
                    drawCrosshair();
                    requestAnimationFrame(gameLoop);
                    return;
                }

                if (gameActive) {
                    // Спавн
                    spawnTimer++;
                    if (spawnTimer > SPAWN_DELAY) {
                        spawnTimer = 0;
                        asteroids.push(new Asteroid());
                        // Усложнение
                        if (score > 10) spawnTimer = -5;
                        if (score > 20) spawnTimer = -10;
                    }

                    // Обновление
                    asteroids = asteroids.filter(a => a.update());
                    particles = particles.filter(p => p.update());

                    // Проверка на окончание игры: если астероид достиг центра?
                    // Или просто бесконечно. Сделаем, что если астероид коснулся центра экрана - проигрыш.
                    for (let a of asteroids) {
                        let dx = a.x - W/2;
                        let dy = a.y - H/2;
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < a.radius + 20) {
                            gameActive = false;
                            gameOver = true;
                            messageDiv.textContent = "ИГРА ОКОНЧЕНА! НАЖМИ ДЛЯ НОВОЙ ИГРЫ";
                            addExplosion(W/2, H/2, 'red');
                            if (window.navigator && window.navigator.vibrate) {
                                window.navigator.vibrate([100, 50, 100, 50, 200]);
                            }
                            break;
                        }
                    }
                }

                // Отрисовка
                ctx.clearRect(0, 0, W, H);
                drawStars();
                
                // Астероиды
                for (let a of asteroids) {
                    a.draw(ctx);
                }
                
                // Частицы
                for (let p of particles) {
                    p.draw(ctx);
                }

                // Прицел
                drawCrosshair();

                requestAnimationFrame(gameLoop);
            }

            function drawStars() {
                // Статичные звезды (для простоты)
                ctx.fillStyle = 'white';
                for (let i = 0; i < 100; i++) {
                    let sx = (i * 37 + 13) % W;
                    let sy = (i * 83 + 7) % H;
                    ctx.globalAlpha = 0.5 + Math.sin(i + Date.now()*0.001)*0.3;
                    ctx.fillRect(sx, sy, 2, 2);
                }
                ctx.globalAlpha = 1;
            }

            function drawCrosshair() {
                let cx = crosshair.x;
                let cy = crosshair.y;
                let r = crosshair.radius;

                ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'cyan';

                // Круг
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI*2);
                ctx.stroke();

                // Линии
                ctx.beginPath();
                ctx.moveTo(cx - r - 5, cy);
                ctx.lineTo(cx - 5, cy);
                ctx.moveTo(cx + 5, cy);
                ctx.lineTo(cx + r + 5, cy);
                ctx.moveTo(cx, cy - r - 5);
                ctx.lineTo(cx, cy - 5);
                ctx.moveTo(cx, cy + 5);
                ctx.lineTo(cx, cy + r + 5);
                ctx.stroke();

                // Точка в центре
                ctx.fillStyle = 'red';
                ctx.shadowColor = 'red';
                ctx.beginPath();
                ctx.arc(cx, cy, 3, 0, Math.PI*2);
                ctx.fill();

                ctx.shadowBlur = 0;
            }

            // Обработчики событий
            window.addEventListener('resize', resize);
            
            // Сенсорный экран (основной ввод)
            canvas.addEventListener('click', (e) => {
                e.preventDefault();
                shoot();
            });
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                shoot();
            });

            // Кнопка полноэкранного режима
            document.getElementById('fs-btn').addEventListener('click', () => {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    document.body.requestFullscreen();
                }
            });

            // Запуск
            resize();
            resetGame(); // Сразу активируем для красоты, или ждем клика?
            // Лучше ждать клика:
            gameActive = false;
            gameOver = false;
            asteroids = [];
            messageDiv.textContent = "НАЖМИ ЧТОБЫ НАЧАТЬ";
            
            gameLoop();
        })();
    </script>
</body>
  </html>

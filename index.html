<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Камера</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        #container { width: 100%; height: 100vh; position: relative; }
        video { display: none; }
        #vr-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; font-size: 18px; background: #4CAF50; color: white;
            border: none; border-radius: 25px; cursor: pointer; z-index: 999;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <button id="vr-btn">🥽 Войти в VR</button>
    
    <video id="video" autoplay playsinline muted></video>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script>
        const video = document.getElementById('video');
        const container = document.getElementById('container');
        
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: 'environment', 
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            } 
        }).then(stream => {
            video.srcObject = stream;
            video.play();
            createScene();
        }).catch(err => {
            alert('Ошибка камеры: ' + err.message);
        });

        function createScene() {
            const scene = document.createElement('a-scene');
            scene.setAttribute('embedded', '');
            scene.setAttribute('vr-mode-ui', 'enabled: true');
            scene.style.width = '100%';
            scene.style.height = '100%';
            scene.style.position = 'absolute';
            scene.style.top = '0';
            scene.style.left = '0';
            container.appendChild(scene);
            
            // Сфера с видео - радиус 10 метров, как вблизи экран
            const sphere = document.createElement('a-sphere');
            sphere.setAttribute('radius', '10');
            sphere.setAttribute('segments-width', '64');
            sphere.setAttribute('segments-height', '64');
            sphere.setAttribute('material', 'shader: flat; src: #video; side: back');
            sphere.setAttribute('scale', '-1 1 1');
            scene.appendChild(sphere);
            
            // Камера с широким углом обзора
            const camera = document.createElement('a-entity');
            camera.setAttribute('camera', 'fov: 100');
            camera.setAttribute('position', '0 0 0');
            camera.setAttribute('look-controls', '');
            scene.appendChild(camera);
            
            // Черный фон
            const sky = document.createElement('a-sky');
            sky.setAttribute('color', '#000');
            scene.appendChild(sky);
        }

        document.getElementById('vr-btn').onclick = function() {
            const scene = document.querySelector('a-scene');
            if (scene) scene.enterVR();
        };
    </script>
</body>
</html>

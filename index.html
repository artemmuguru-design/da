<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Камера</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }
        
        /* Видео с камеры */
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: fixed;
            top: 0;
            left: 0;
            transform: rotateY(0deg);
            transition: transform 0.1s;
        }
        
        /* VR-эффект (двойной экран) */
        #vr-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        
        #vr-overlay.active {
            display: flex;
        }
        
        .vr-eye {
            flex: 1;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        
        .vr-eye video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Разделительная линия для VR */
        .vr-divider {
            position: fixed;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 20;
            display: none;
        }
        
        .vr-divider.active {
            display: block;
        }
        
        /* Кнопка */
        #enter-vr-button {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 18px 40px;
            font-size: 18px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,123,255,0.4);
            transition: all 0.3s;
            touch-action: manipulation;
            user-select: none;
        }
        
        #enter-vr-button:active {
            transform: translateX(-50%) scale(0.95);
        }
        
        #enter-vr-button.vr-active {
            background: #ff4444;
            box-shadow: 0 4px 15px rgba(255,68,68,0.4);
        }
        
        /* Информация */
        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 100;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Статус -->
    <div id="status">📷 Загрузка камеры...</div>

    <!-- Видео с камеры (обычный режим) -->
    <video id="video" autoplay playsinline></video>

    <!-- VR-оверлей (два экрана) -->
    <div id="vr-overlay">
        <div class="vr-eye">
            <video id="video-left" autoplay playsinline></video>
        </div>
        <div class="vr-eye">
            <video id="video-right" autoplay playsinline></video>
        </div>
    </div>
    
    <div class="vr-divider" id="vr-divider"></div>

    <!-- Кнопка -->
    <button id="enter-vr-button">🎮 Войти в VR</button>

    <script>
        // ============================================
        // 1. ВКЛЮЧАЕМ КАМЕРУ
        // ============================================
        const video = document.getElementById('video');
        const videoLeft = document.getElementById('video-left');
        const videoRight = document.getElementById('video-right');
        const statusEl = document.getElementById('status');
        const button = document.getElementById('enter-vr-button');
        const vrOverlay = document.getElementById('vr-overlay');
        const vrDivider = document.getElementById('vr-divider');

        let isVRMode = false;
        let stream = null;

        async function startCamera() {
            try {
                // Запрашиваем камеру
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment', // Задняя камера
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                // Подключаем к видео
                video.srcObject = stream;
                videoLeft.srcObject = stream;
                videoRight.srcObject = stream;

                await video.play();
                await videoLeft.play();
                await videoRight.play();

                statusEl.textContent = '✅ Камера включена! Нажмите VR';
                statusEl.style.color = '#4CAF50';
                
                return true;
            } catch (error) {
                console.error('Ошибка камеры:', error);
                statusEl.textContent = '❌ Ошибка: ' + error.message;
                statusEl.style.color = '#ff4444';
                return false;
            }
        }

        // ============================================
        // 2. УПРАВЛЕНИЕ ДВИЖЕНИЕМ (ГИРОСКОП)
        // ============================================
        let orientation = { alpha: 0, beta: 0, gamma: 0 };

        function handleOrientation(event) {
            orientation.alpha = event.alpha || 0;
            orientation.beta = event.beta || 0;
            orientation.gamma = event.gamma || 0;

            if (isVRMode) {
                // Поворачиваем видео в VR режиме (как экран телефона)
                const rotateX = Math.min(Math.max(orientation.beta, -45), 45);
                const rotateY = orientation.gamma;
                
                const vids = [videoLeft, videoRight];
                vids.forEach(v => {
                    v.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg) scale(1.1)`;
                    v.style.transition = 'transform 0.1s';
                });
            } else {
                // Обычный режим - тоже поворачиваем для реализма
                video.style.transform = `rotateY(${orientation.gamma}deg) rotateX(${orientation.beta}deg) scale(1.05)`;
                video.style.transition = 'transform 0.1s';
            }
        }

        // ============================================
        // 3. ВКЛЮЧЕНИЕ VR РЕЖИМА
        // ============================================
        function toggleVR() {
            isVRMode = !isVRMode;

            if (isVRMode) {
                // Включаем VR
                vrOverlay.classList.add('active');
                vrDivider.classList.add('active');
                video.style.display = 'none';
                button.textContent = '❌ Выйти из VR';
                button.classList.add('vr-active');
                statusEl.textContent = '🔮 VR режим активен! Смотри по сторонам';
                statusEl.style.color = '#ff9800';
            } else {
                // Выключаем VR
                vrOverlay.classList.remove('active');
                vrDivider.classList.remove('active');
                video.style.display = 'block';
                button.textContent = '🎮 Войти в VR';
                button.classList.remove('vr-active');
                statusEl.textContent = '📷 Камера включена';
                statusEl.style.color = '#4CAF50';
                
                // Сбрасываем трансформацию
                [videoLeft, videoRight].forEach(v => {
                    v.style.transform = 'rotateY(0deg) rotateX(0deg) scale(1)';
                });
            }
        }

        // ============================================
        // 4. МОБИЛЬНАЯ АДАПТАЦИЯ КНОПКИ
        // ============================================
        function createMobileVRButton() {
            const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isMobile) {
                button.style.padding = '20px 50px';
                button.style.fontSize = '22px';
                button.style.bottom = '60px';
                button.style.width = '80%';
                button.style.maxWidth = '320px';
                
                // Запрашиваем разрешение на гироскоп (для iOS 13+)
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(state => {
                            if (state === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation);
                            }
                        })
                        .catch(console.error);
                } else {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
            }
        }

        // ============================================
        // 5. ОБРАБОТЧИКИ СОБЫТИЙ
        // ============================================
        
        // Кнопка входа в VR
        button.addEventListener('click', toggleVR);
        button.addEventListener('touchstart', function(e) {
            e.preventDefault();
            toggleVR();
        });

        // Запуск камеры при загрузке
        startCamera().then(success => {
            if (success) {
                createMobileVRButton();
            }
        });

        // Обработка ошибок камеры при сворачивании
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && stream) {
                // Освобождаем камеру при сворачивании
                stream.getTracks().forEach(track => track.stop());
            }
        });

        console.log('✅ VR Камера готова!');
        console.log('📱 Нажмите кнопку для входа в VR');
    </script>

</body>
</html>

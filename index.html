<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Park</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #counter {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #00FF00; font-size: 72px; font-weight: bold;
            text-shadow: 0 0 20px rgba(0,255,0,0.8); pointer-events: none; z-index: 20; display: none;
        }
        #status {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            color: white; background: rgba(0,0,0,0.7); padding: 10px 20px;
            border-radius: 20px; font-size: 16px; z-index: 10; pointer-events: none;
        }
        #vr-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; font-size: 18px; background: #4CAF50; color: white;
            border: none; border-radius: 25px; cursor: pointer; z-index: 999;
        }
    </style>
</head>
<body>
    <div id="counter">3</div>
    <div id="status">⏱️ Готов к телепортации</div>
    <button id="vr-btn">🥽 Войти в VR</button>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <a-scene renderer="antialias: true" vr-mode-ui="enabled: true">
        
        <a-entity light="type: ambient; color: #BBB; intensity: 0.5"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="1 3 2"></a-entity>

        <!-- Пол -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#7B7B7B" class="floor"></a-plane>
        <a-grid position="0 0.01 0" rotation="-90 0 0" width="20" height="20" gridsize="2" color="#555"></a-grid>

        <!-- Стены и потолок -->
        <a-plane position="0 2.5 -10" width="20" height="5" color="#E8E8E8" material="side: double"></a-plane>
        <a-plane position="0 2.5 10" rotation="0 180 0" width="20" height="5" color="#E8E8E8" material="side: double"></a-plane>
        <a-plane position="-10 2.5 0" rotation="0 90 0" width="20" height="5" color="#D8D8D8" material="side: double"></a-plane>
        <a-plane position="10 2.5 0" rotation="0 -90 0" width="20" height="5" color="#D8D8D8" material="side: double"></a-plane>
        <a-plane position="0 5 0" rotation="90 0 0" width="20" height="20" color="#F0F0F0" material="side: double"></a-plane>

        <!-- Декор -->
        <a-box position="-3 0.5 -3" width="1" height="1" depth="1" color="#FF6B6B"></a-box>
        <a-box position="3 0.75 -3" width="1" height="1.5" depth="1" color="#4ECDC4"></a-box>
        <a-box position="-3 0.5 3" width="1.5" height="1" depth="1" color="#45B7D1"></a-box>
        <a-box position="3 0.5 3" width="1" height="1" depth="1.5" color="#96CEB4"></a-box>
        <a-sphere position="5 0.8 -5" radius="0.8" color="#FF8C00"></a-sphere>
        <a-cylinder position="-5 0.75 5" radius="0.5" height="1.5" color="#8B4513"></a-cylinder>

        <!-- Камера -->
        <a-entity id="player" position="0 1.6 0" camera look-controls>
            <!-- Красный прицел -->
            <a-ring position="0 0 -1" radius-inner="0.005" radius-outer="0.008" color="#FF0000" material="shader: flat; emissive: #FF0000"></a-ring>
            <a-ring position="0 0 -1" radius-inner="0.001" radius-outer="0.003" color="#FF3333" material="shader: flat; emissive: #FF0000"></a-ring>
            
            <!-- Курсор пола -->
            <a-entity id="floor-cursor" cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .floor; far: 30"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        const player = document.getElementById('player');
        const floorCursor = document.getElementById('floor-cursor');
        const counterEl = document.getElementById('counter');
        const statusEl = document.getElementById('status');
        
        let looking = false, timer = null, count = 3, teleports = 0;

        document.getElementById('vr-btn').onclick = function() {
            document.querySelector('a-scene').enterVR();
        };

        function teleport() {
            const p = player.getAttribute('position');
            const r = player.getAttribute('rotation');
            const pitch = THREE.MathUtils.degToRad(r.x);
            const yaw = THREE.MathUtils.degToRad(r.y);
            const dir = new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch), -Math.sin(pitch), -Math.cos(yaw)*Math.cos(pitch));
            
            if (dir.y >= 0) return;
            const t = -p.y / dir.y;
            if (t > 0 && t < 20) {
                const x = Math.max(-9, Math.min(9, p.x + dir.x * t));
                const z = Math.max(-9, Math.min(9, p.z + dir.z * t));
                player.setAttribute('position', `${x} 1.6 ${z}`);
                teleports++;
                statusEl.textContent = `✨ Телепорт #${teleports}`;
                counterEl.style.display = 'none';
                setTimeout(() => { statusEl.textContent = '⏱️ Готов к телепортации'; }, 1500);
            }
        }

        function start() {
            if (timer) return;
            count = 3;
            counterEl.style.display = 'block';
            counterEl.textContent = count;
            timer = setInterval(() => {
                count--;
                if (count > 0) { counterEl.textContent = count; }
                else { clearInterval(timer); timer = null; teleport(); looking = false; }
            }, 1000);
        }

        function stop() {
            if (timer) { clearInterval(timer); timer = null; }
            counterEl.style.display = 'none';
            looking = false;
        }

        floorCursor.addEventListener('raycaster-intersection', function(e) {
            if (!looking && e.detail.intersections.length > 0) {
                if (e.detail.intersections[0].face.normal.y > 0.5) { looking = true; start(); }
            }
        });

        floorCursor.addEventListener('raycaster-intersection-cleared', function() {
            if (looking) stop();
        });
    </script>
</body>
    </html>

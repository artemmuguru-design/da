<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Park - Телепортация взглядом</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            pointer-events: none;
            z-index: 10;
        }
        #counter {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00FF00;
            font-size: 72px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0,255,0,0.8);
            pointer-events: none;
            z-index: 20;
            display: none;
        }
        #status {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>🎮 VR Park</h2>
        <p>Смотрите на пол 3 секунды для телепортации</p>
        <p>Красная точка - центр взгляда</p>
    </div>
    <div id="counter">3</div>
    <div id="status">⏱️ Готов к телепортации</div>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <a-scene id="vr-scene" 
             renderer="antialias: true"
             vr-mode-ui="enabled: true">
        
        <!-- Освещение -->
        <a-entity light="type: ambient; color: #BBB; intensity: 0.5"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="1 3 2"></a-entity>

        <!-- Пол -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" 
                 color="#7B7B7B" material="roughness: 0.8" class="floor"></a-plane>
        
        <!-- Разметка -->
        <a-grid position="0 0.01 0" rotation="-90 0 0" width="20" height="20" 
                gridsize="2" thickness="0.02" color="#555"></a-grid>

        <!-- Стены -->
        <a-plane position="0 2.5 -10" rotation="0 0 0" width="20" height="5" color="#E8E8E8" material="side: double"></a-plane>
        <a-plane position="0 2.5 10" rotation="0 180 0" width="20" height="5" color="#E8E8E8" material="side: double"></a-plane>
        <a-plane position="-10 2.5 0" rotation="0 90 0" width="20" height="5" color="#D8D8D8" material="side: double"></a-plane>
        <a-plane position="10 2.5 0" rotation="0 -90 0" width="20" height="5" color="#D8D8D8" material="side: double"></a-plane>

        <!-- Потолок -->
        <a-plane position="0 5 0" rotation="90 0 0" width="20" height="20" color="#F0F0F0" material="side: double"></a-plane>

        <!-- Декоративные объекты -->
        <a-box position="-3 0.5 -3" width="1" height="1" depth="1" color="#FF6B6B" material="roughness: 0.5"></a-box>
        <a-box position="3 0.75 -3" width="1" height="1.5" depth="1" color="#4ECDC4" material="roughness: 0.5"></a-box>
        <a-box position="-3 0.5 3" width="1.5" height="1" depth="1" color="#45B7D1" material="roughness: 0.5"></a-box>
        <a-box position="3 0.5 3" width="1" height="1" depth="1.5" color="#96CEB4" material="roughness: 0.5"></a-box>
        <a-box position="0 0.25 -5" width="2" height="0.5" depth="2" color="#FFEAA7" material="roughness: 0.5"></a-box>
        <a-box position="-5 0.75 0" width="0.8" height="1.5" depth="0.8" color="#DDA0DD" material="roughness: 0.5"></a-box>
        
        <a-sphere position="5 0.8 -5" radius="0.8" color="#FF8C00" material="roughness: 0.3"></a-sphere>
        <a-cylinder position="-5 0.75 5" radius="0.5" height="1.5" color="#8B4513" material="roughness: 0.5"></a-cylinder>
        <a-cone position="5 0.5 5" radius-bottom="0.6" radius-top="0" height="1.2" color="#9370DB" material="roughness: 0.4"></a-cone>

        <!-- Камера игрока -->
        <a-entity id="player" position="0 1.6 0" camera look-controls>
            
            <!-- Красный прицел -->
            <a-entity position="0 0 -1">
                <!-- Внешнее кольцо -->
                <a-ring radius-inner="0.006" radius-outer="0.01" 
                        color="#FF0000" material="shader: flat; emissive: #FF0000; emissiveIntensity: 1.5">
                </a-ring>
                <!-- Точка в центре -->
                <a-ring radius-inner="0.001" radius-outer="0.003" 
                        color="#FF3333" material="shader: flat; emissive: #FF0000; emissiveIntensity: 2">
                </a-ring>
            </a-entity>

            <!-- Курсор для отслеживания пола -->
            <a-entity id="floor-cursor" 
                      cursor="rayOrigin: mouse; fuse: false"
                      raycaster="objects: .floor; far: 30">
            </a-entity>
        </a-entity>

        <!-- Контейнер для эффектов -->
        <a-entity id="effects-container"></a-entity>
    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const player = document.getElementById('player');
            const floorCursor = document.getElementById('floor-cursor');
            const counterElement = document.getElementById('counter');
            const statusElement = document.getElementById('status');
            const effectsContainer = document.getElementById('effects-container');
            
            let isLookingAtFloor = false;
            let countdownTimer = null;
            let countdownValue = 3;
            let teleportCount = 0;

            // Функция телепортации
            function teleport() {
                // Получаем позицию и поворот камеры
                const position = player.getAttribute('position');
                const rotation = player.getAttribute('rotation');
                
                // Конвертируем углы в радианы
                const pitch = THREE.MathUtils.degToRad(rotation.x);
                const yaw = THREE.MathUtils.degToRad(rotation.y);
                
                // Вычисляем направление взгляда
                const direction = new THREE.Vector3(
                    -Math.sin(yaw) * Math.cos(pitch),
                    -Math.sin(pitch),
                    -Math.cos(yaw) * Math.cos(pitch)
                );
                direction.normalize();
                
                // Проверяем, смотрим ли вниз
                if (direction.y >= 0) return;
                
                // Находим пересечение с плоскостью y = 0
                const t = -position.y / direction.y;
                
                if (t > 0 && t < 20) {
                    // Вычисляем точку пересечения
                    const targetX = position.x + direction.x * t;
                    const targetZ = position.z + direction.z * t;
                    
                    // Ограничиваем координаты
                    const clampedX = Math.max(-9, Math.min(9, targetX));
                    const clampedZ = Math.max(-9, Math.min(9, targetZ));
                    
                    // Выполняем телепортацию
                    player.setAttribute('position', {
                        x: clampedX,
                        y: 1.6,
                        z: clampedZ
                    });
                    
                    teleportCount++;
                    
                    // Создаем эффект
                    createTeleportEffect(clampedX, 0.1, clampedZ);
                    
                    // Обновляем интерфейс
                    statusElement.textContent = `✨ Телепортация #${teleportCount} выполнена!`;
                    counterElement.style.display = 'none';
                    
                    // Через 1.5 секунды возвращаем статус
                    setTimeout(() => {
                        statusElement.textContent = '⏱️ Готов к телепортации';
                    }, 1500);
                }
            }

            // Создание эффекта телепортации
            function createTeleportEffect(x, y, z) {
                const effect = document.createElement('a-entity');
                effect.setAttribute('position', `${x} ${y} ${z}`);
                
                // Светящийся круг
                const circle = document.createElement('a-ring');
                circle.setAttribute('rotation', '-90 0 0');
                circle.setAttribute('radius-inner', '0.1');
                circle.setAttribute('radius-outer', '1');
                circle.setAttribute('color', '#00FF00');
                circle.setAttribute('material', 'opacity: 0.8; emissive: #00FF00; emissiveIntensity: 1; transparent: true');
                circle.setAttribute('animation', 'property: scale; from: 0.1 0.1 0.1; to: 2 2 2; dur: 500; easing: easeOutQuad');
                circle.setAttribute('animation__fade', 'property: material.opacity; from: 0.8; to: 0; dur: 500; easing: easeOutQuad');
                
                effect.appendChild(circle);
                effectsContainer.appendChild(effect);
                
                // Удаляем эффект через 1 секунду
                setTimeout(() => {
                    if (effect.parentNode) {
                        effect.parentNode.removeChild(effect);
                    }
                }, 1000);
            }

            // Запуск обратного отсчета
            function startCountdown() {
                if (countdownTimer) return;
                
                countdownValue = 3;
                counterElement.style.display = 'block';
                counterElement.textContent = countdownValue;
                statusElement.textContent = `⏱️ Телепортация через ${countdownValue}...`;
                
                countdownTimer = setInterval(() => {
                    countdownValue--;
                    
                    if (countdownValue > 0) {
                        counterElement.textContent = countdownValue;
                        statusElement.textContent = `⏱️ Телепортация через ${countdownValue}...`;
                    } else {
                        // Выполняем телепортацию
                        clearInterval(countdownTimer);
                        countdownTimer = null;
                        counterElement.textContent = '0';
                        teleport();
                        isLookingAtFloor = false;
                    }
                }, 1000);
            }

            // Остановка обратного отсчета
            function stopCountdown() {
                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }
                counterElement.style.display = 'none';
                if (isLookingAtFloor) {
                    statusElement.textContent = '⏱️ Готов к телепортации';
                }
                isLookingAtFloor = false;
            }

            // Обработчик: курсор попал на пол
            floorCursor.addEventListener('raycaster-intersection', function(event) {
                if (!isLookingAtFloor && event.detail.intersections.length > 0) {
                    const intersection = event.detail.intersections[0];
                    // Проверяем, что это пол (нормаль направлена вверх)
                    if (intersection.face && intersection.face.normal && intersection.face.normal.y > 0.5) {
                        isLookingAtFloor = true;
                        startCountdown();
                    }
                }
            });

            // Обработчик: курсор ушел с пола
            floorCursor.addEventListener('raycaster-intersection-cleared', function() {
                if (isLookingAtFloor) {
                    stopCountdown();
                }
            });

            // Дополнительная проверка каждые 100мс (страховка)
            setInterval(() => {
                if (isLookingAtFloor) {
                    const rotation = player.getAttribute('rotation');
                    const pitch = THREE.MathUtils.degToRad(rotation.x);
                    const yaw = THREE.MathUtils.degToRad(rotation.y);
                    
                    const direction = new THREE.Vector3(
                        -Math.sin(yaw) * Math.cos(pitch),
                        -Math.sin(pitch),
                        -Math.cos(yaw) * Math.cos(pitch)
                    );
                    
                    // Если смотрим выше горизонта - отменяем
                    if (direction.y > -0.2) {
                        stopCountdown();
                    }
                }
            }, 100);

            // Обработчики VR режима
            const scene = document.getElementById('vr-scene');
            scene.addEventListener('enter-vr', function() {
                statusElement.textContent = '🥽 VR режим активен';
            });
            
            scene.addEventListener('exit-vr', function() {
                statusElement.textContent = '⏱️ Готов к телепортации';
            });

            console.log('🎮 VR Park готов!');
            console.log('📋 Управление:');
            console.log('  1. Наденьте VR очки');
            console.log('  2. Красная точка = центр взгляда');
            console.log('  3. Смотрите на пол 3 секунды');
            console.log('  4. Телепортация! Можно повторять бесконечно');
        });
    </script>
</body>
</html>

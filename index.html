<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VR Комната - Собери предметы</title>
  <!-- Подключаем библиотеку A-Frame для VR -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- Подключаем компонент для управления взглядом -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
</head>
<body>

<a-scene>
  <!-- ===== КОМНАТА ===== -->
  <!-- Пол -->
  <a-plane position="0 0 -4" rotation="-90 0 0" width="8" height="8" color="#3a3a3a"></a-plane>
  
  <!-- Стены -->
  <a-box position="0 2 -4" width="8" height="4" depth="0.2" color="#5a5a5a"></a-box>  <!-- Задняя -->
  <a-box position="-4 2 0" width="0.2" height="4" depth="8" color="#4a4a4a"></a-box>  <!-- Левая -->
  <a-box position="4 2 0" width="0.2" height="4" depth="8" color="#4a4a4a"></a-box>   <!-- Правая -->
  <a-box position="0 4 -4" width="8" height="0.2" depth="8" color="#6a6a6a"></a-box>   <!-- Потолок -->

  <!-- ===== ПРЕДМЕТЫ ДЛЯ СБОРА ===== -->
  <!-- 1. Красный куб -->
  <a-box position="-1.5 0.5 -3" width="0.5" height="0.5" depth="0.5" color="#ff4444"
         data-collect="true">
    <a-entity class="gaze-cursor"></a-entity>
  </a-box>

  <!-- 2. Синяя сфера -->
  <a-sphere position="1.5 0.5 -3.5" radius="0.3" color="#4488ff"
            data-collect="true">
    <a-entity class="gaze-cursor"></a-entity>
  </a-sphere>

  <!-- 3. Зелёный цилиндр -->
  <a-cylinder position="-2 0.3 -4.5" radius="0.3" height="0.6" color="#44ff44"
              data-collect="true">
    <a-entity class="gaze-cursor"></a-entity>
  </a-cylinder>

  <!-- 4. Жёлтый тор -->
  <a-torus position="2 0.5 -4" radius="0.3" arc="0.3" color="#ffcc00"
           data-collect="true">
    <a-entity class="gaze-cursor"></a-entity>
  </a-torus>

  <!-- 5. Фиолетовая звезда (через Octahedron) -->
  <a-octahedron position="0 0.5 -5" radius="0.3" color="#cc44ff"
                data-collect="true">
    <a-entity class="gaze-cursor"></a-entity>
  </a-octahedron>

  <!-- ===== СЧЁТЧИК ===== -->
  <a-text id="counter" value="Предметов: 0/5" position="-1 2.5 -2.5" 
          color="white" scale="1 1 1" align="center" width="3">
  </a-text>

  <!-- ===== ПРИЦЕЛ (крестик в центре) ===== -->
  <a-entity position="0 0 -3">
    <a-ring radius-inner="0.01" radius-outer="0.03" color="#00ff00"></a-ring>
  </a-entity>

  <!-- ===== ОСВЕЩЕНИЕ ===== -->
  <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
  <a-light type="directional" position="2 3 1" intensity="0.8"></a-light>

</a-scene>

<!-- ===== ЛОГИКА ИГРЫ ===== -->
<script>
  // Ждём загрузки сцены
  document.addEventListener('DOMContentLoaded', function() {
    let collected = 0;
    const totalItems = 5;
    const counter = document.querySelector('#counter');

    // Находим все предметы с атрибутом data-collect="true"
    const items = document.querySelectorAll('[data-collect="true"]');

    items.forEach(item => {
      // Добавляем курсор-прицел для каждого предмета (он появится при взгляде)
      const cursor = document.createElement('a-entity');
      cursor.setAttribute('geometry', 'primitive: ring; radius-inner: 0.1; radius-outer: 0.15');
      cursor.setAttribute('material', 'color: #00ff00; opacity: 0');
      cursor.setAttribute('scale', '1 1 1');
      
      // Прицел показывается, когда смотришь на предмет
      item.addEventListener('mouseenter', function() {
        cursor.setAttribute('material', 'opacity: 1');
        // Запускаем таймер сбора (1.5 секунды)
        if (!item.dataset.collecting) {
          item.dataset.collecting = 'true';
          setTimeout(() => {
            if (item.parentNode) { // Проверяем, не собран ли уже
              collectItem(item);
            }
          }, 1500);
        }
      });

      item.addEventListener('mouseleave', function() {
        cursor.setAttribute('material', 'opacity: 0');
        item.dataset.collecting = 'false';
      });

      // Добавляем прицел к предмету
      item.appendChild(cursor);
    });

    function collectItem(item) {
      // Проверяем, что предмет ещё существует и не собран
      if (!item.parentNode || item.dataset.collected === 'true') return;
      
      item.dataset.collected = 'true';
      collected++;
      
      // Анимация исчезновения
      item.setAttribute('animation', 'property: scale; to: 0 0 0; dur: 300');
      
      // Обновляем счётчик
      counter.setAttribute('value', `Предметов: ${collected}/${totalItems}`);
      
      // Проверка победы
      if (collected === totalItems) {
        setTimeout(() => {
          counter.setAttribute('value', '🎉 ПОБЕДА! Все предметы собраны!');
          counter.setAttribute('color', '#ffdd00');
        }, 500);
      }
    }
  });
</script>

</body>
      </html>

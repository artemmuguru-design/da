<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Бесплатный APK Builder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #161b22;
            border-radius: 20px;
            padding: 25px;
            border: 1px solid #30363d;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #58a6ff;
        }
        .subtitle {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 15px 0 5px;
            color: #8b949e;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-size: 14px;
        }
        textarea {
            min-height: 250px;
            font-family: monospace;
            resize: vertical;
        }
        .icon-area {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 5px;
        }
        #iconPreview {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: #21262d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 2px dashed #30363d;
        }
        #iconInput { display: none; }
        .btn-icon {
            background: #21262d;
            color: #c9d1d9;
            padding: 12px 20px;
            border: 1px solid #30363d;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-build {
            width: 100%;
            padding: 16px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-build:active { transform: scale(0.98); }
        .status {
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        .templates {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .tpl {
            background: #21262d;
            color: #58a6ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #30363d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 APK Builder</h1>
        <div class="subtitle">Бесплатно • Навсегда • Без интернета</div>
        
        <label>🔤 Название приложения</label>
        <input type="text" id="appName" value="Моё приложение">
        
        <label>🆔 Имя пакета</label>
        <input type="text" id="packageName" value="com.mycompany.myapp">
        
        <label>🖼️ Иконка (png, 512x512)</label>
        <div class="icon-area">
            <div id="iconPreview">📱</div>
            <div>
                <button class="btn-icon" onclick="document.getElementById('iconInput').click()">📁 Выбрать PNG</button>
                <input type="file" id="iconInput" accept="image/png" onchange="loadIcon(event)">
                <button class="btn-icon" onclick="resetIcon()">🔄 Сброс</button>
            </div>
        </div>
        
        <label>📄 HTML код</label>
        <textarea id="htmlCode"><!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            font-size: 2em;
        }
        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div>
        <h1>🚀 Привет мир!</h1>
        <p>Моё первое приложение</p>
        <button onclick="alert('Работает!')">Нажми меня</button>
    </div>
</body>
</html></textarea>
        
        <div class="templates">
            <span class="tpl" onclick="loadTemplate('hello')">👋 Привет</span>
            <span class="tpl" onclick="loadTemplate('game')">🎮 Игра</span>
            <span class="tpl" onclick="loadTemplate('calc')">🔢 Калькулятор</span>
            <span class="tpl" onclick="loadTemplate('todo')">✅ Список дел</span>
        </div>
        
        <button class="btn-build" onclick="buildAPK()">🔨 СОБРАТЬ APK</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        let iconBase64 = null;
        
        function loadIcon(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                iconBase64 = e.target.result.split(',')[1];
                document.getElementById('iconPreview').innerHTML = 
                    `<img src="${e.target.result}" style="width:80px;height:80px;border-radius:20px;">`;
            };
            reader.readAsDataURL(file);
        }
        
        function resetIcon() {
            iconBase64 = null;
            document.getElementById('iconPreview').innerHTML = '📱';
        }

        async function buildAPK() {
            const status = document.getElementById('status');
            const name = document.getElementById('appName').value || 'MyApp';
            const pkg = document.getElementById('packageName').value || 'com.myapp';
            const html = document.getElementById('htmlCode').value;
            
            status.textContent = '⏳ Сборка...';
            status.style.background = '#21262d';
            
            try {
                const zip = new JSZip();
                
                // AndroidManifest
                zip.file('AndroidManifest.xml', 
`<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="${pkg}"
    android:versionCode="1"
    android:versionName="1.0">
    <uses-permission android:name="android.permission.INTERNET"/>
    <application android:label="${name}" android:icon="@mipmap/ic_launcher">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
    </application>
</manifest>`);
                
                // HTML
                zip.file('assets/index.html', html);
                
                // Иконка
                if (iconBase64) {
                    zip.file('res/mipmap-hdpi/ic_launcher.png', iconBase64, {base64: true});
                }
                
                // DEX placeholder
                zip.file('classes.dex', '');
                
                // Генерация
                const blob = await zip.generateAsync({
                    type: 'blob',
                    compression: 'DEFLATE',
                    compressionOptions: { level: 9 }
                });
                
                // Скачивание
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = name.replace(/[^a-zA-Zа-яА-Я0-9]/g, '_') + '.apk';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                status.textContent = `✅ Готово! ${(blob.size/1024).toFixed(1)} KB`;
                status.style.background = '#238636';
                
            } catch(e) {
                status.textContent = '❌ Ошибка: ' + e.message;
                status.style.background = '#da3633';
            }
        }
        
        function loadTemplate(type) {
            const tpl = {
                hello: `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>body{background:linear-gradient(135deg,#667eea,#764ba2);color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-size:2em;text-align:center}</style></head><body><div><h1>👋 Привет!</h1><p>Твоё приложение работает!</p></div></body></html>`,
                
                game: `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>body{background:#1a1a2e;color:white;font-family:Arial;text-align:center;padding:20px}#target{width:80px;height:80px;background:#e94560;border-radius:50%;position:relative;display:inline-block;cursor:pointer;margin-top:30px}#target:active{transform:scale(.8)}#score{font-size:2em;margin:20px 0}</style></head><body><h2>🎯 Попади в цель!</h2><div id="score">Очки: 0</div><div id="target" onclick="score+=10;document.getElementById('score').textContent='Очки: '+score;moveTarget()"></div><script>let score=0;function moveTarget(){document.getElementById('target').style.marginLeft=Math.random()*200+'px';document.getElementById('target').style.marginTop=Math.random()*200+'px'}setInterval(moveTarget,1500)</script></body></html>`,
                
                calc: `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>body{background:#2c3e50;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:Arial}.calc{background:white;border-radius:20px;padding:20px;width:300px}#display{width:100%;height:50px;font-size:1.5em;text-align:right;margin-bottom:15px;padding:10px;border:2px solid #ddd;border-radius:10px}.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{padding:15px;font-size:1.1em;border:none;border-radius:10px;cursor:pointer;background:#ecf0f1}button:active{transform:scale(.95)}.op{background:#3498db;color:white}.eq{background:#2ecc71;color:white}.cl{background:#e74c3c;color:white}</style></head><body><div class="calc"><input id="display" readonly><div class="btns"><button class="cl" onclick="d.value=''">C</button><button class="op" onclick="d.value+='/'">/</button><button class="op" onclick="d.value+='*'">×</button><button class="op" onclick="d.value+='-'">-</button><button onclick="d.value+='7'">7</button><button onclick="d.value+='8'">8</button><button onclick="d.value+='9'">9</button><button class="op" onclick="d.value+='+'">+</button><button onclick="d.value+='4'">4</button><button onclick="d.value+='5'">5</button><button onclick="d.value+='6'">6</button><button class="eq" onclick="d.value=eval(d.value)">=</button><button onclick="d.value+='1'">1</button><button onclick="d.value+='2'">2</button><button onclick="d.value+='3'">3</button><button onclick="d.value+='0'">0</button><button onclick="d.value+='.'">.</button></div></div><script>let d=document.getElementById('display')</script></body></html>`,
                
                todo: `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>body{background:#f5f5f5;font-family:Arial;padding:20px;max-width:500px;margin:0 auto}h1{color:#333}.input{display:flex;gap:10px;margin-bottom:20px}#task{flex:1;padding:10px;border:2px solid #ddd;border-radius:8px;font-size:16px}#add{background:#4caf50;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer}.task{display:flex;align-items:center;padding:10px;background:white;margin-bottom:5px;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1)}.task.done{opacity:.5}.task.done span{text-decoration:line-through}.task span{flex:1;margin-left:10px}.del{background:#f44336;color:white;border:none;padding:5px 10px;border-radius:5px;cursor:pointer}</style></head><body><h1>✅ Список дел</h1><div class="input"><input id="task" placeholder="Новая задача..."><button id="add" onclick="add()">+</button></div><div id="list"></div><script>function add(){let t=document.getElementById('task').value.trim();if(t){let d=document.createElement('div');d.className='task';d.innerHTML='<input type="checkbox" onchange="this.parentElement.classList.toggle(\'done\')"><span>'+t+'</span><button class="del" onclick="this.parentElement.remove()">×</button>';document.getElementById('list').appendChild(d);document.getElementById('task').value=''}}</script></body></html>`
            };
            if(tpl[type]) document.getElementById('htmlCode').value = tpl[type];
        }
    </script>
</body>
                                          </html>

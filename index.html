<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Park - Телепортация взглядом</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            pointer-events: none;
            z-index: 10;
        }
        #counter {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform: translate(-50%, 50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,0,0,0.8);
            pointer-events: none;
            z-index: 20;
            display: none;
        }
        #enter-vr {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            z-index: 30;
            transition: all 0.3s;
        }
        #enter-vr:hover {
            background: #45a049;
            transform: translateX(-50%) scale(1.05);
        }
        #status {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>🎮 VR Park</h2>
        <p>Смотрите на пол для телепортации</p>
    </div>
    <div id="counter"></div>
    <div id="status">⏱️ Готов к телепортации</div>
    <button id="enter-vr">🥽 Войти в VR</button>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
        // Создаем сцену A-Frame
        const scene = document.createElement('a-scene');
        scene.setAttribute('renderer', 'antialias: true');
        scene.setAttribute('vr-mode-ui', 'enabled: true');
        document.body.appendChild(scene);

        // Освещение
        const ambientLight = document.createElement('a-entity');
        ambientLight.setAttribute('light', 'type: ambient; color: #BBB; intensity: 0.5');
        scene.appendChild(ambientLight);

        const directionalLight = document.createElement('a-entity');
        directionalLight.setAttribute('light', 'type: directional; color: #FFF; intensity: 1');
        directionalLight.setAttribute('position', '1 3 2');
        scene.appendChild(directionalLight);

        // Пол
        const floor = document.createElement('a-plane');
        floor.setAttribute('position', '0 0 0');
        floor.setAttribute('rotation', '-90 0 0');
        floor.setAttribute('width', '20');
        floor.setAttribute('height', '20');
        floor.setAttribute('color', '#7B7B7B');
        floor.setAttribute('material', 'roughness: 0.8; metalness: 0.2');
        floor.setAttribute('class', 'floor');
        scene.appendChild(floor);

        // Разметка на полу
        const gridLines = document.createElement('a-grid');
        gridLines.setAttribute('position', '0 0.01 0');
        gridLines.setAttribute('rotation', '-90 0 0');
        gridLines.setAttribute('width', '20');
        gridLines.setAttribute('height', '20');
        gridLines.setAttribute('gridsize', '2');
        gridLines.setAttribute('thickness', '0.02');
        gridLines.setAttribute('color', '#555');
        scene.appendChild(gridLines);

        // Стены
        const wallColor = '#E8E8E8';
        
        function createWall(position, rotation, width, height) {
            const wall = document.createElement('a-plane');
            wall.setAttribute('position', position);
            wall.setAttribute('rotation', rotation);
            wall.setAttribute('width', width);
            wall.setAttribute('height', height);
            wall.setAttribute('color', wallColor);
            wall.setAttribute('material', 'roughness: 0.9; metalness: 0.1; side: double');
            scene.appendChild(wall);
        }

        createWall('0 2 -10', '0 0 0', '20', '4');     // Задняя стена
        createWall('0 2 10', '0 180 0', '20', '4');     // Передняя стена
        createWall('-10 2 0', '0 90 0', '20', '4');     // Левая стена
        createWall('10 2 0', '0 -90 0', '20', '4');     // Правая стена

        // Потолок
        const ceiling = document.createElement('a-plane');
        ceiling.setAttribute('position', '0 4 0');
        ceiling.setAttribute('rotation', '90 0 0');
        ceiling.setAttribute('width', '20');
        ceiling.setAttribute('height', '20');
        ceiling.setAttribute('color', '#F0F0F0');
        ceiling.setAttribute('material', 'roughness: 0.9; metalness: 0.1; side: double');
        scene.appendChild(ceiling);

        // Декоративные элементы
        function createBox(x, y, z, color, w, h, d) {
            const box = document.createElement('a-box');
            box.setAttribute('position', `${x} ${y} ${z}`);
            box.setAttribute('width', w || 1);
            box.setAttribute('height', h || 1);
            box.setAttribute('depth', d || 1);
            box.setAttribute('color', color);
            box.setAttribute('material', 'roughness: 0.5; metalness: 0.3');
            scene.appendChild(box);
        }

        // Разноцветные кубы по комнате
        createBox(-3, 0.5, -3, '#FF6B6B', 1, 1, 1);
        createBox(3, 0.5, -3, '#4ECDC4', 1, 1.5, 1);
        createBox(-3, 0.5, 3, '#45B7D1', 1.5, 1, 1);
        createBox(3, 0.5, 3, '#96CEB4', 1, 1, 1.5);
        createBox(0, 0.25, -5, '#FFEAA7', 2, 0.5, 2);
        createBox(-5, 0.75, 0, '#DDA0DD', 0.8, 1.5, 0.8);

        // Сфера в углу
        const sphere = document.createElement('a-sphere');
        sphere.setAttribute('position', '5 0.8 -5');
        sphere.setAttribute('radius', '0.8');
        sphere.setAttribute('color', '#FF8C00');
        sphere.setAttribute('material', 'roughness: 0.3; metalness: 0.5');
        scene.appendChild(sphere);

        // Цилиндр
        const cylinder = document.createElement('a-cylinder');
        cylinder.setAttribute('position', '-5 0.75 5');
        cylinder.setAttribute('radius', '0.5');
        cylinder.setAttribute('height', '1.5');
        cylinder.setAttribute('color', '#8B4513');
        cylinder.setAttribute('material', 'roughness: 0.6; metalness: 0.2');
        scene.appendChild(cylinder);

        // Камера игрока
        const camera = document.createElement('a-entity');
        camera.setAttribute('camera', '');
        camera.setAttribute('position', '0 1.6 0');
        camera.setAttribute('look-controls', '');
        camera.setAttribute('wasd-controls', 'acceleration: 100');
        scene.appendChild(camera);

        // Красная точка в центре (прицел)
        const reticle = document.createElement('a-ring');
        reticle.setAttribute('position', '0 0 -1.5');
        reticle.setAttribute('radius-inner', '0.005');
        reticle.setAttribute('radius-outer', '0.01');
        reticle.setAttribute('color', '#FF0000');
        reticle.setAttribute('material', 'shader: flat; emissive: #FF0000; emissiveIntensity: 1');
        reticle.setAttribute('id', 'reticle');
        camera.appendChild(reticle);

        // Внутренняя точка
        const innerDot = document.createElement('a-ring');
        innerDot.setAttribute('position', '0 0 -1.5');
        innerDot.setAttribute('radius-inner', '0.001');
        innerDot.setAttribute('radius-outer', '0.004');
        innerDot.setAttribute('color', '#FF3333');
        innerDot.setAttribute('material', 'shader: flat; emissive: #FF0000; emissiveIntensity: 1.5');
        camera.appendChild(innerDot);

        // Элемент для отслеживания пересечения с полом
        const cursor = document.createElement('a-entity');
        cursor.setAttribute('cursor', 'rayOrigin: mouse; fuse: false');
        cursor.setAttribute('raycaster', 'objects: .floor; far: 20');
        cursor.setAttribute('id', 'cursor');
        camera.appendChild(cursor);

        // Переменные для отсчета
        let lookTimer = null;
        let countdownValue = 5;
        let isLookingAtFloor = false;
        const counterElement = document.getElementById('counter');
        const statusElement = document.getElementById('status');

        // Функция обновления отсчета
        function updateCounter() {
            if (countdownValue > 0) {
                counterElement.textContent = countdownValue;
                statusElement.textContent = `⏱️ Телепортация через ${countdownValue}...`;
                countdownValue--;
            } else {
                // Телепортация!
                performTeleport();
                resetTimer();
            }
        }

        // Сброс таймера
        function resetTimer() {
            if (lookTimer) {
                clearInterval(lookTimer);
                lookTimer = null;
            }
            countdownValue = 5;
            counterElement.style.display = 'none';
            isLookingAtFloor = false;
            statusElement.textContent = '⏱️ Готов к телепортации';
        }

        // Выполнение телепортации
        function performTeleport() {
            // Получаем текущее направление взгляда
            const cameraEl = camera;
            const cameraWorldPos = new THREE.Vector3();
            const cameraWorldQuat = new THREE.Quaternion();
            
            cameraEl.object3D.getWorldPosition(cameraWorldPos);
            cameraEl.object3D.getWorldQuaternion(cameraWorldQuat);

            // Направление взгляда
            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyQuaternion(cameraWorldQuat);
            direction.normalize();

            // Находим точку пересечения с плоскостью пола (y = 0)
            if (direction.y < 0) {
                const t = -cameraWorldPos.y / direction.y;
                if (t > 0 && t < 20) {
                    const targetX = cameraWorldPos.x + direction.x * t;
                    const targetZ = cameraWorldPos.z + direction.z * t;
                    
                    // Ограничиваем координаты пределами комнаты
                    const clampedX = Math.max(-9, Math.min(9, targetX));
                    const clampedZ = Math.max(-9, Math.min(9, targetZ));
                    
                    // Телепортация
                    cameraEl.setAttribute('position', `${clampedX} 1.6 ${clampedZ}`);
                    
                    // Визуальный эффект
                    statusElement.textContent = '✨ Телепортация!';
                    counterElement.style.display = 'none';
                    
                    // Эффект вспышки
                    const flash = document.createElement('a-sphere');
                    flash.setAttribute('position', `${clampedX} 0.1 ${clampedZ}`);
                    flash.setAttribute('radius', '0.3');
                    flash.setAttribute('color', '#00FF00');
                    flash.setAttribute('material', 'opacity: 0.8; emissive: #00FF00; emissiveIntensity: 1');
                    flash.setAttribute('animation', 'property: scale; from: 0.1 0.1 0.1; to: 2 2 2; dur: 500; easing: easeOutQuad');
                    flash.setAttribute('animation__fade', 'property: material.opacity; from: 0.8; to: 0; dur: 500; easing: easeOutQuad');
                    scene.appendChild(flash);
                    
                    setTimeout(() => {
                        scene.removeChild(flash);
                        statusElement.textContent = '⏱️ Готов к телепортации';
                    }, 500);
                }
            }
        }

        // Обработчик событий рейкастера
        cursor.addEventListener('raycaster-intersection', function(evt) {
            if (evt.detail.els && evt.detail.els.length > 0) {
                // Луч пересекает пол
                if (!isLookingAtFloor) {
                    isLookingAtFloor = true;
                    countdownValue = 5;
                    counterElement.style.display = 'block';
                    counterElement.textContent = countdownValue;
                    statusElement.textContent = `⏱️ Телепортация через ${countdownValue}...`;
                    
                    lookTimer = setInterval(updateCounter, 1000);
                }
            }
        });

        cursor.addEventListener('raycaster-intersection-cleared', function() {
            // Луч больше не пересекает пол
            if (isLookingAtFloor) {
                resetTimer();
            }
        });

        // Кнопка входа в VR
        document.getElementById('enter-vr').addEventListener('click', function() {
            if (scene.hasAttribute('vr-mode')) {
                scene.exitVR();
            } else {
                scene.enterVR();
            }
        });

        // Обновление текста кнопки при изменении режима VR
        scene.addEventListener('enter-vr', function() {
            document.getElementById('enter-vr').textContent = '🚪 Выйти из VR';
            document.getElementById('info').style.display = 'none';
        });

        scene.addEventListener('exit-vr', function() {
            document.getElementById('enter-vr').textContent = '🥽 Войти в VR';
            document.getElementById('info').style.display = 'block';
        });

        console.log('🎮 VR Park загружен!');
        console.log('📋 Управление:');
        console.log('  - Смотрите на пол для начала отсчета');
        console.log('  - Удерживайте взгляд 5 секунд для телепортации');
        console.log('  - Нажмите кнопку "Войти в VR" для VR-режима');
    </script>
</body>
  </html>

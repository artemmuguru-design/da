<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Заставка стрима</title>
  <style>
    /* Глобальный сброс и настройка */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0b0f1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Контейнер — занимает почти весь экран, но с изящными отступами */
    .stream-splash {
      position: relative;
      width: 96vw;
      max-width: 1400px;
      height: 90vh;
      max-height: 900px;
      background: radial-gradient(circle at 20% 30%, #1a2335, #0a0e16);
      border-radius: 48px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 255, 255, 0.04) inset;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      transition: all 0.3s ease;
      overflow: hidden;
      backdrop-filter: blur(2px);
    }

    /* Декоративный глитч-фон (анимированные линии) */
    .stream-splash::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        repeating-linear-gradient(45deg, 
          rgba(255, 70, 150, 0.02) 0px, 
          rgba(255, 70, 150, 0.02) 2px,
          transparent 2px,
          transparent 8px),
        repeating-linear-gradient(-45deg,
          rgba(0, 200, 255, 0.02) 0px,
          rgba(0, 200, 255, 0.02) 2px,
          transparent 2px,
          transparent 10px);
      pointer-events: none;
      z-index: 0;
    }

    /* Анимированный ореол */
    .stream-splash::after {
      content: '';
      position: absolute;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle at 70% 20%, rgba(255, 100, 200, 0.12), transparent 70%);
      top: -10%;
      right: -10%;
      filter: blur(60px);
      z-index: 0;
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.5; transform: scale(1) translate(0, 0); }
      100% { opacity: 1; transform: scale(1.2) translate(-20px, 20px); }
    }

    /* Основной контент поверх фона */
    .splash-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1.8rem;
      width: 100%;
      max-width: 800px;
    }

    /* Стильный логотип / заголовок */
    .stream-title {
      font-size: clamp(3.2rem, 15vw, 6.5rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #f0e9ff 0%, #b7aaff 50%, #7f9eff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(150, 130, 255, 0.3);
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
      line-height: 1.1;
      margin-bottom: 0.2rem;
      animation: titleFloat 3s ease-in-out infinite;
    }

    @keyframes titleFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .stream-sub {
      font-size: clamp(1rem, 3vw, 1.8rem);
      font-weight: 300;
      color: rgba(220, 220, 255, 0.8);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.4rem 1.8rem;
      border-radius: 60px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      margin-top: -0.5rem;
    }

    /* Кнопка — главный элемент */
    .fullscreen-btn {
      position: relative;
      z-index: 20;
      margin-top: 0.8rem;
      padding: 1.2rem 4rem;
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      font-weight: 600;
      color: #fff;
      background: linear-gradient(145deg, #6c5ce7, #a855f7);
      border: none;
      border-radius: 120px;
      cursor: pointer;
      box-shadow: 0 12px 40px rgba(108, 92, 231, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.1) inset;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      letter-spacing: 0.05em;
      backdrop-filter: blur(4px);
      background-size: 200% 200%;
      animation: btnGradient 4s ease infinite alternate;
      min-width: 240px;
    }

    @keyframes btnGradient {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .fullscreen-btn:hover {
      transform: scale(1.05) translateY(-3px);
      box-shadow: 0 20px 50px rgba(108, 92, 231, 0.7), 0 0 0 3px rgba(255, 255, 255, 0.3) inset;
      filter: brightness(1.1);
    }

    .fullscreen-btn:active {
      transform: scale(0.96) translateY(0px);
      box-shadow: 0 8px 20px rgba(108, 92, 231, 0.6);
    }

    /* Иконка внутри кнопки (маленький квадратик) */
    .fullscreen-btn svg {
      width: 1.6rem;
      height: 1.6rem;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .fullscreen-btn:hover svg {
      transform: rotate(90deg) scale(1.1);
    }

    /* Нижний декоративный текст */
    .stream-meta {
      margin-top: 2.2rem;
      font-size: clamp(0.8rem, 1.2vw, 1rem);
      color: rgba(180, 180, 220, 0.4);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 1.2rem;
      width: 60%;
      max-width: 300px;
      backdrop-filter: blur(2px);
    }

    /* Небольшие "пиксельные" акценты */
    .glitch-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #a855f7;
      border-radius: 50%;
      margin: 0 6px;
      box-shadow: 0 0 12px #a855f7;
      animation: dotBlink 1.8s infinite alternate;
    }

    @keyframes dotBlink {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* Адаптивность для маленьких экранов */
    @media (max-width: 600px) {
      .stream-splash {
        width: 100vw;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        padding: 1.2rem;
      }
      .fullscreen-btn {
        min-width: 180px;
        padding: 1rem 2.4rem;
      }
      .stream-meta {
        width: 80%;
      }
    }

    /* Полноэкранный режим — оформление без изменений, но растягиваем */
    .stream-splash.fullscreen {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      padding: 1.5rem !important;
      box-shadow: none !important;
    }

    /* Кнопка при полноэкранном режиме (можно добавить небольшую анимацию) */
    .stream-splash.fullscreen .fullscreen-btn {
      box-shadow: 0 16px 60px rgba(108, 92, 231, 0.7);
    }
  </style>
</head>
<body>
  <div class="stream-splash" id="streamSplash">
    <div class="splash-content">
      <!-- Заголовок с "игровым" оттенком -->
      <h1 class="stream-title">✦ СТРИМ ✦</h1>
      <div class="stream-sub">LIVE · СЕГОДНЯ</div>

      <!-- Кнопка "На весь экран" с иконкой -->
      <button class="fullscreen-btn" id="fullscreenBtn">
        <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
        <span>На весь экран</span>
      </button>

      <!-- Мета-информация с анимированной точкой -->
      <div class="stream-meta">
        <span class="glitch-dot"></span> 
        готов к стриму 
        <span class="glitch-dot"></span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const splash = document.getElementById('streamSplash');
      const fullscreenBtn = document.getElementById('fullscreenBtn');

      // Функция для переключения полноэкранного режима
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          // Запрос полноэкранного режима для элемента splash
          if (splash.requestFullscreen) {
            splash.requestFullscreen().catch(err => {
              // Обрабатываем возможные ошибки (например, если пользователь не разрешил)
              console.warn('Не удалось войти в полноэкранный режим:', err);
              // В качестве fallback — добавляем класс, который имитирует полноэкранный вид
              splash.classList.toggle('fullscreen');
            });
          } else if (splash.webkitRequestFullscreen) { /* Safari */
            splash.webkitRequestFullscreen();
          } else if (splash.msRequestFullscreen) { /* IE/Edge */
            splash.msRequestFullscreen();
          } else {
            // Если API не поддерживается, просто применяем CSS-класс
            splash.classList.toggle('fullscreen');
          }
        } else {
          // Выход из полноэкранного режима
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(err => {
              console.warn('Ошибка при выходе из полноэкранного режима:', err);
              splash.classList.remove('fullscreen');
            });
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
          } else {
            splash.classList.remove('fullscreen');
          }
        }
      }

      // Обработчик клика по кнопке
      fullscreenBtn.addEventListener('click', toggleFullscreen);

      // Отслеживаем изменения полноэкранного режима, чтобы синхронизировать класс
      document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
          splash.classList.add('fullscreen');
        } else {
          splash.classList.remove('fullscreen');
        }
      });

      // Для браузеров с префиксами (Webkit, MS)
      document.addEventListener('webkitfullscreenchange', () => {
        if (document.webkitFullscreenElement) {
          splash.classList.add('fullscreen');
        } else {
          splash.classList.remove('fullscreen');
        }
      });
      document.addEventListener('msfullscreenchange', () => {
        if (document.msFullscreenElement) {
          splash.classList.add('fullscreen');
        } else {
          splash.classList.remove('fullscreen');
        }
      });

      // Дополнительно: если пользователь нажимает Esc — класс синхронизируется
      // (но fullscreenchange уже сработает, это для подстраховки)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !document.fullscreenElement) {
          // Если полноэкранный режим был отключен через Esc, но класс остался — убираем
          if (splash.classList.contains('fullscreen')) {
            splash.classList.remove('fullscreen');
          }
        }
      });

      // Также можно кликнуть дважды по splash — но для удобства оставим только кнопку
      // Однако можно добавить "двойной клик" для переключения (по желанию)
      // splash.addEventListener('dblclick', toggleFullscreen);
    })();
  </script>
</body>
</html>

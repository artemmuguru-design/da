<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Камера</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        #container { width: 100%; height: 100vh; position: relative; }
        video { display: none; }
        #vr-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; font-size: 18px; background: #4CAF50; color: white;
            border: none; border-radius: 25px; cursor: pointer; z-index: 999;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <button id="vr-btn">🥽 Войти в VR</button>
    
    <video id="video" autoplay playsinline></video>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script>
        const video = document.getElementById('video');
        const container = document.getElementById('container');
        
        // Включаем камеру с широким углом
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: 'environment', 
                width: { ideal: 1920 }, 
                height: { ideal: 1080 } 
            } 
        }).then(stream => {
            video.srcObject = stream;
            video.play();
            createVRScene();
        });

        function createVRScene() {
            const scene = document.createElement('a-scene');
            scene.setAttribute('embedded', '');
            scene.setAttribute('vr-mode-ui', 'enabled: true');
            scene.setAttribute('fov', '90');
            scene.style.width = '100%';
            scene.style.height = '100%';
            scene.style.position = 'absolute';
            scene.style.top = '0';
            scene.style.left = '0';
            container.appendChild(scene);
            
            // Левая половина экрана
            const leftPlane = document.createElement('a-plane');
            leftPlane.setAttribute('position', '-0.5 0 0');
            leftPlane.setAttribute('width', '1');
            leftPlane.setAttribute('height', '1');
            leftPlane.setAttribute('material', 'shader: flat; src: #video; side: double');
            scene.appendChild(leftPlane);
            
            // Правая половина экрана
            const rightPlane = document.createElement('a-plane');
            rightPlane.setAttribute('position', '0.5 0 0');
            rightPlane.setAttribute('width', '1');
            rightPlane.setAttribute('height', '1');
            rightPlane.setAttribute('material', 'shader: flat; src: #video; side: double');
            scene.appendChild(rightPlane);
            
            // Камера дальше для широкого обзора
            const camera = document.createElement('a-entity');
            camera.setAttribute('camera', 'fov: 90');
            camera.setAttribute('position', '0 0 -0.5');
            camera.setAttribute('look-controls', '');
            scene.appendChild(camera);
            
            // Свет
            const light = document.createElement('a-entity');
            light.setAttribute('light', 'type: ambient; color: #FFF; intensity: 1');
            scene.appendChild(light);
        }

        // Кнопка VR
        document.getElementById('vr-btn').onclick = function() {
            const scene = document.querySelector('a-scene');
            if (scene) {
                scene.enterVR();
            }
        };
    </script>
</body>
</html>

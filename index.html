<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VR Строитель + Телепорт</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@1.4.0/dist/aframe-physics-system.min.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #drop-btn {
      position: fixed;
      bottom: 40px;
      right: 40px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #ff2222;
      color: white;
      font-size: 20px;
      font-weight: bold;
      border: 4px solid white;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.7);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.3;
      padding: 10px;
      user-select: none;
      touch-action: manipulation;
    }
    #drop-btn:active { transform: scale(0.85); background: #cc0000; }
    #info {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 18px;
      background: rgba(0,0,0,0.7);
      padding: 8px 20px;
      border-radius: 30px;
      z-index: 999;
      border: 2px solid rgba(255,255,255,0.2);
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <button id="drop-btn">БРОСИТЬ<br>БЛОК</button>
  <div id="info">🎯 Наведись на блок на 5 сек, чтобы взять его</div>

  <a-scene physics="driver: local; gravity: -9.8">
    
    <!-- ===== СТЕНЫ С СЕТКОЙ (как на фото) ===== -->
    <!-- Задняя стена -->
    <a-box position="0 2 -6" width="12" height="4" depth="0.3" color="#c0c0c0">
      <a-image src="#grid-texture" repeat="6 2" position="0 0 0.01"></a-image>
    </a-box>
    
    <!-- Левая стена -->
    <a-box position="-6 2 0" width="0.3" height="4" depth="12" color="#c0c0c0">
      <a-image src="#grid-texture" repeat="6 2" position="0 0 0.01" rotation="0 90 0"></a-image>
    </a-box>
    
    <!-- Правая стена -->
    <a-box position="6 2 0" width="0.3" height="4" depth="12" color="#c0c0c0">
      <a-image src="#grid-texture" repeat="6 2" position="0 0 0.01" rotation="0 -90 0"></a-image>
    </a-box>
    
    <!-- Передняя стена (полупрозрачная, чтобы видно было) -->
    <a-box position="0 2 6" width="12" height="4" depth="0.3" color="#c0c0c0" opacity="0.2">
      <a-image src="#grid-texture" repeat="6 2" position="0 0 0.01" rotation="0 180 0"></a-image>
    </a-box>

    <!-- ===== ПОЛ И ПОТОЛОК (жёлто-оранжевая сетка) ===== -->
    <!-- Пол -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#ffaa33">
      <a-image src="#yellow-grid" repeat="6 6" position="0 0 0.01"></a-image>
    </a-plane>
    
    <!-- Потолок -->
    <a-plane position="0 4 0" rotation="90 0 0" width="12" height="12" color="#ffaa33">
      <a-image src="#yellow-grid" repeat="6 6" position="0 0 0.01"></a-image>
    </a-plane>

    <!-- ===== ТЕКСТУРЫ ===== -->
    <a-assets>
      <!-- Текстура для стен (сетка) -->
      <canvas id="grid-canvas" width="128" height="128"></canvas>
      <!-- Текстура для пола/потолка (жёлто-оранжевая сетка) -->
      <canvas id="yellow-grid-canvas" width="128" height="128"></canvas>
    </a-assets>

    <!-- ===== ОСВЕЩЕНИЕ ===== -->
    <a-light type="ambient" intensity="0.6"></a-light>
    <a-light type="directional" position="5 10 5" intensity="0.8"></a-light>

    <!-- ===== КАМЕРА ===== -->
    <a-camera id="camera" position="0 0.5 0" look-controls>
      <!-- КРАСНАЯ ТОЧКА (всегда по центру) -->
      <a-circle position="0 0 -2.5" radius="0.035" color="#ff0000" material="side: double; shader: flat"></a-circle>
      
      <!-- КРУЖОК ДЛЯ ОТСЧЁТА -->
      <a-entity id="fuse-container" position="0 0 -2.5" visible="false">
        <a-circle radius="0.09" color="#00ff44" opacity="0.8" material="side: double; shader: flat"></a-circle>
        <a-circle id="fuse-fill" radius="0.07" color="#ffdd00" opacity="0.9" material="side: double; shader: flat"></a-circle>
        <a-text id="fuse-number" value="5" position="0 0 -0.01" color="white" align="center" width="0.3" scale="0.6 0.6 0.6" material="shader: flat"></a-text>
      </a-entity>
      
      <!-- ЛУЧ ДЛЯ НАВЕДЕНИЯ -->
      <a-entity id="raycaster" raycaster="objects: .block, .floor; far: 6; interval: 50"></a-entity>
    </a-camera>

    <!-- ===== БЛОКИ ===== -->
    <a-box class="block" position="-1 0.25 -2" width="0.5" height="0.5" depth="0.5" color="#ff4444" dynamic-body="mass: 1; shape: box"></a-box>
    <a-box class="block" position="1.5 0.25 -3" width="0.5" height="0.5" depth="0.5" color="#44aaff" dynamic-body="mass: 1; shape: box"></a-box>
    <a-box class="block" position="0 0.25 -4.5" width="0.5" height="0.5" depth="0.5" color="#44ff88" dynamic-body="mass: 1; shape: box"></a-box>
    <a-box class="block" position="-2 0.25 -4" width="0.5" height="0.5" depth="0.5" color="#ffaa44" dynamic-body="mass: 1; shape: box"></a-box>
    <a-box class="block" position="2 0.25 -5" width="0.5" height="0.5" depth="0.5" color="#cc66ff" dynamic-body="mass: 1; shape: box"></a-box>

  </a-scene>

  <script>
    // ===== СОЗДАЁМ ТЕКСТУРЫ =====
    function createGridTexture(canvasId, lineColor, bgColor, cellSize = 16) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      
      // Заливка фона
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Рисуем сетку
      ctx.strokeStyle = lineColor;
      ctx.lineWidth = 4;
      
      for (let x = 0; x <= canvas.width; x += cellSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      
      for (let y = 0; y <= canvas.height; y += cellSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
      
      // Превращаем canvas в текстуру для A-Frame
      const texture = document.createElement('img');
      texture.id = canvasId + '-texture';
      texture.src = canvas.toDataURL('image/png');
      document.querySelector('a-assets').appendChild(texture);
    }
    
    // Создаём текстуры после загрузки страницы
    window.addEventListener('load', function() {
      // Для стен: серый фон, чёрные линии
      createGridTexture('grid-canvas', '#444444', '#e0e0e0', 16);
      // Для пола/потолка: жёлто-оранжевый фон, оранжевые линии
      createGridTexture('yellow-grid-canvas', '#cc7700', '#ffbb33', 16);
    });

    // ===== ЛОГИКА ИГРЫ =====
    const dropBtn = document.getElementById('drop-btn');
    const info = document.getElementById('info');
    const scene = document.querySelector('a-scene');
    const camera = document.querySelector('#camera');
    const raycaster = document.querySelector('#raycaster');
    const fuseContainer = document.querySelector('#fuse-container');
    const fuseFill = document.querySelector('#fuse-fill');
    const fuseNumber = document.querySelector('#fuse-number');
    
    let carriedBlock = null;
    let isFusing = false;
    let fuseTime = 0;
    let selectedTarget = null;
    let isTeleporting = false;
    
    const FUSE_DURATION_BLOCK = 5;
    const FUSE_DURATION_TELEPORT = 4;
    
    // ===== ВЗЯТЬ БЛОК =====
    function pickUpBlock(block) {
      if (carriedBlock) return;
      carriedBlock = block;
      block.removeAttribute('dynamic-body');
      camera.appendChild(block);
      block.setAttribute('position', '0 0 -1.5');
      fuseContainer.setAttribute('visible', 'false');
      isFusing = false;
      info.textContent = '✋ Блок взят! Нажми "БРОСИТЬ"';
    }
    
    // ===== ТЕЛЕПОРТ =====
    function teleportTo(position) {
      const newPos = {
        x: position.x,
        y: 0.5,
        z: position.z
      };
      camera.setAttribute('position', newPos);
      info.textContent = '🌀 Телепорт!';
      setTimeout(() => {
        info.textContent = '🎯 Наведись на блок на 5 сек';
      }, 1000);
    }
    
    // ===== БРОСИТЬ БЛОК =====
    function dropBlock() {
      if (!carriedBlock) {
        info.textContent = '⚠️ Сначала возьми блок';
        return;
      }
      const block = carriedBlock;
      camera.removeChild(block);
      scene.appendChild(block);
      
      const camPos = camera.getAttribute('position');
      const direction = new THREE.Vector3(0, 0, -1);
      const quat = camera.object3D.quaternion;
      direction.applyQuaternion(quat);
      
      block.setAttribute('position', {
        x: camPos.x + direction.x * 2,
        y: camPos.y + direction.y * 1.5 + 0.3,
        z: camPos.z + direction.z * 2
      });
      block.setAttribute('dynamic-body', 'mass: 1; shape: box');
      
      carriedBlock = null;
      info.textContent = '💥 Блок брошен!';
    }
    
    // ===== ОБРАБОТЧИК НАВЕДЕНИЯ =====
    raycaster.addEventListener('mouseenter', function(evt) {
      const target = evt.detail.intersectedEl;
      
      if (!target) return;
      
      // Если это блок и мы не несём блок
      if (target.classList && target.classList.contains('block') && !carriedBlock) {
        selectedTarget = target;
        isFusing = true;
        fuseTime = FUSE_DURATION_BLOCK;
        fuseContainer.setAttribute('visible', 'true');
        fuseNumber.setAttribute('value', Math.ceil(fuseTime));
        fuseFill.setAttribute('radius', '0.07');
        info.textContent = `⏳ Берём блок... ${Math.ceil(fuseTime)}`;
        return;
      }
      
      // Если это пол (для телепортации)
      if (target.classList && target.classList.contains('floor') && !carriedBlock) {
        selectedTarget = target;
        isFusing = true;
        fuseTime = FUSE_DURATION_TELEPORT;
        fuseContainer.setAttribute('visible', 'true');
        fuseNumber.setAttribute('value', Math.ceil(fuseTime));
        fuseFill.setAttribute('radius', '0.07');
        info.textContent = `🌀 Телепорт... ${Math.ceil(fuseTime)}`;
      }
    });
    
    raycaster.addEventListener('mouseleave', function(evt) {
      if (isFusing) {
        isFusing = false;
        fuseContainer.setAttribute('visible', 'false');
        selectedTarget = null;
        info.textContent = '🎯 Наведись на блок на 5 сек';
      }
    });
    
    // ===== ОБНОВЛЕНИЕ КАЖДЫЙ КАДР =====
    let lastTime = Date.now();
    function updateLoop() {
      const now = Date.now();
      const delta = (now - lastTime) / 1000;
      lastTime = now;
      
      if (isFusing && selectedTarget) {
        fuseTime -= delta;
        
        if (fuseTime <= 0) {
          // Время вышло
          if (selectedTarget.classList && selectedTarget.classList.contains('block')) {
            pickUpBlock(selectedTarget);
          } else if (selectedTarget.classList && selectedTarget.classList.contains('floor')) {
            const point = selectedTarget.getAttribute('position');
            teleportTo(point);
          }
          isFusing = false;
          fuseContainer.setAttribute('visible', 'false');
          selectedTarget = null;
        } else {
          // Обновляем кружок
          const progress = fuseTime / (selectedTarget.classList.contains('block') ? FUSE_DURATION_BLOCK : FUSE_DURATION_TELEPORT);
          fuseFill.setAttribute('radius', 0.07 * progress);
          fuseNumber.setAttribute('value', Math.ceil(fuseTime));
          info.textContent = `⏳ ${Math.ceil(fuseTime)}...`;
        }
      }
      
      requestAnimationFrame(updateLoop);
    }
    updateLoop();
    
    // ===== КНОПКА БРОСИТЬ =====
    dropBtn.addEventListener('click', function(e) {
      e.preventDefault();
      dropBlock();
    });
    
    console.log('VR Строитель + Телепорт запущен!');
  </script>
</body>
      </html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundPad 42 + Трансляция</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            user-select: none;
        }

        h1 { margin-bottom: 5px; font-weight: 400; }
        
        .hint {
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .controls { margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

        button.save-btn {
            padding: 8px 16px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
        }
        button.save-btn:hover { background: #444; }
        button.stream-btn { background: #1565c0; border-color: #1976d2; }
        button.stream-btn:hover { background: #1976d2; }
        button.stream-btn.active { background: #c62828; border-color: #e53935; }

        .status-msg { height: 20px; font-size: 0.9rem; color: #4caf50; margin-bottom: 10px; text-align: center; }

        .stream-panel {
            display: none;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            max-width: 700px;
            width: 90%;
            border: 1px solid #333;
        }
        .stream-panel.visible { display: block; }
        .stream-panel h3 { margin: 0 0 10px 0; font-weight: 400; font-size: 1rem; color: #4caf50; }
        .stream-panel input {
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            font-size: 1rem;
            width: 60%;
            margin-right: 8px;
        }
        .stream-panel button {
            padding: 8px 14px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
        }
        .stream-panel button:hover { background: #444; }
        .room-code {
            font-family: monospace;
            font-size: 1.4rem;
            color: #4caf50;
            letter-spacing: 3px;
            user-select: all;
            margin: 8px 0;
        }
        .conn-status {
            font-size: 0.85rem;
            color: #888;
            margin-top: 8px;
        }

        /* Сетка */
        .pad-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            max-width: 800px;
            width: 95%;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .pad-btn {
            aspect-ratio: 1;
            position: relative;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, background 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            background: #2a2a2a;
            color: #555;
            box-shadow: inset 0 0 5px #000;
        }

        .pad-btn.has-sound {
            background: linear-gradient(145deg, #2e7d32, #1b5e20);
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .pad-btn.playing {
            background: linear-gradient(145deg, #4caf50, #2e7d32) !important;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.6);
            transform: scale(0.98);
        }

        .pad-number {
            position: absolute;
            top: 4px; left: 6px;
            font-size: 0.7rem;
            opacity: 0.6;
        }

        .pad-label {
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
            word-wrap: break-word;
            max-width: 100%;
            z-index: 2;
            pointer-events: none;
            line-height: 1.1;
        }

        .empty-label { font-size: 0.65rem; opacity: 0.4; }

        .delete-btn {
            position: absolute;
            top: 3px; right: 3px;
            width: 18px; height: 18px;
            background: rgba(0,0,0,0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #fff;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }

        .pad-btn:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: #d32f2f; }

        #fileInput { display: none; }

        @media (max-width: 600px) {
            .pad-grid { grid-template-columns: repeat(4, 1fr); }
            .stream-panel input { width: 100%; margin-bottom: 8px; }
        }
    </style>
</head>
<body>

    <h1>SoundPad 42</h1>
    <div class="hint">Нажми на пустую кнопку, чтобы загрузить звук.<br>Нажми на играющую, чтобы остановить.</div>
    
    <div class="controls">
        <button class="save-btn" onclick="saveProgress()">💾 Сохранить</button>
        <button class="save-btn" onclick="clearAll()">🗑️ Сброс</button>
        <button class="save-btn stream-btn" id="streamBtn" onclick="toggleStream()">🔊 Создать комнату</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>

    <div class="stream-panel" id="streamPanel">
        <div id="hostView" style="display:none;">
            <h3>🎙️ Трансляция активна — отправь код другу:</h3>
            <div class="room-code" id="roomCode">------</div>
            <button onclick="copyRoomCode()">📋 Копировать код</button>
            <button onclick="copyRoomLink()">🔗 Копировать ссылку</button>
            <div class="conn-status" id="hostStatus">Ожидание подключения...</div>
        </div>
        <div id="guestView" style="display:none;">
            <h3>🎧 Присоединиться к комнате:</h3>
            <input type="text" id="joinCodeInput" placeholder="Введи код (6 символов)" maxlength="6">
            <button onclick="joinRoom()">Подключиться</button>
            <div class="conn-status" id="guestStatus">Не подключено</div>
        </div>
        <div id="modeSelector">
            <h3>Выбери режим:</h3>
            <button onclick="startHost()">🎙️ Я транслирую музыку</button>
            <button onclick="showGuest()">🎧 Я слушаю друга</button>
        </div>
    </div>

    <div class="pad-grid" id="grid"></div>
    <input type="file" id="fileInput" accept="audio/*">

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        const grid = document.getElementById('grid');
        const fileInput = document.getElementById('fileInput');
        const statusMsg = document.getElementById('statusMsg');
        const MAX_DURATION = 7200;
        const TOTAL_BUTTONS = 42;

        let soundData = {}; 
        let activeButtonIndex = null;
        let currentAudio = null; 
        let currentPlayingIndex = null; 

        /* ---------- IndexedDB ---------- */
        const DB_NAME = 'SoundPadDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'sounds';
        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME);
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = (e) => reject(e.target.error);
            });
        }
        function dbPut(key, value) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(value, key);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e.target.error);
            });
        }
        function dbDelete(key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(key);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e.target.error);
            });
        }
        function dbGetAll() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const keysReq = store.getAllKeys();
                const valsReq = store.getAll();
                tx.oncomplete = () => {
                    const result = {};
                    keysReq.result.forEach((k, i) => { result[k] = valsReq.result[i]; });
                    resolve(result);
                };
                tx.onerror = (e) => reject(e.target.error);
            });
        }
        function dbClear() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).clear();
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e.target.error);
            });
        }

        /* ---------- Инициализация ---------- */
        async function init() {
            createButtons();
            try {
                await openDB();
                await loadFromStorage();
            } catch (e) {
                console.error(e);
                showStatus("Ошибка инициализации БД");
            }
        }

        function createButtons() {
            grid.innerHTML = '';
            for (let i = 1; i <= TOTAL_BUTTONS; i++) {
                const btn = document.createElement('div'); 
                btn.className = 'pad-btn';
                btn.id = `btn-${i}`;
                
                const num = document.createElement('span');
                num.className = 'pad-number';
                num.textContent = i;

                const label = document.createElement('div');
                label.className = 'pad-label';
                label.id = `label-${i}`;
                label.innerHTML = '<span class="empty-label">Пусто</span>';

                const del = document.createElement('div');
                del.className = 'delete-btn';
                del.innerHTML = '&times;';
                del.title = "Удалить трек";
                del.onclick = (e) => {
                    e.stopPropagation();
                    if(confirm("Удалить этот трек?")) deleteSound(i);
                };

                btn.onclick = () => handleMainClick(i);

                btn.appendChild(num);
                btn.appendChild(label);
                btn.appendChild(del);
                grid.appendChild(btn);
            }
        }

        function handleMainClick(index) {
            if (!soundData[index]) {
                activeButtonIndex = index;
                fileInput.click();
            } else {
                if (currentPlayingIndex === index && currentAudio && !currentAudio.paused) {
                    stopPlayback();
                    showStatus("Остановлено");
                } else {
                    playSound(index);
                }
            }
        }

        function playSound(index) {
            stopPlayback();
            const data = soundData[index];
            const btn = document.getElementById(`btn-${index}`);

            currentAudio = new Audio(data.data);
            currentAudio.crossOrigin = "anonymous";
            currentPlayingIndex = index;

            btn.classList.add('playing');
            currentAudio.play().catch(e => console.error("Ошибка воспроизведения", e));

            currentAudio.onended = () => stopPlayback();

            // Перенаправление звука в WebRTC если трансляция активна
            if (streamActive && streamDest) {
                try {
                    const src = audioCtx.createMediaElementSource(currentAudio);
                    src.connect(streamDest);
                    src.connect(audioCtx.destination); // чтобы самому слышать
                } catch (e) {
                    console.warn("Не удалось подключить к потоку:", e);
                }
            }
        }

        function stopPlayback() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0; 
                currentAudio = null;
            }
            if (currentPlayingIndex) {
                const btn = document.getElementById(`btn-${currentPlayingIndex}`);
                if (btn) btn.classList.remove('playing');
                currentPlayingIndex = null;
            }
        }

        fileInput.addEventListener('change', function(e) {
            if (!e.target.files.length) return;
            const file = e.target.files[0];
            const index = activeButtonIndex;
            showStatus("Чтение файла...");

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64 = event.target.result;
                const audio = new Audio(base64);
                audio.onloadedmetadata = function() {
                    if (audio.duration > MAX_DURATION) {
                        alert("Слишком длинный файл (максимум 120 минут).");
                        return;
                    }
                    const defaultName = file.name.replace(/\.[^/.]+$/, "");
                    const customName = prompt("Введи название для кнопки:", defaultName);
                    if (customName === null) { showStatus("Загрузка отменена"); return; }
                    const finalName = customName.trim() === "" ? file.name : customName.trim();
                    soundData[index] = { label: finalName, data: base64 };
                    updateVisuals(index);
                    showStatus(`Загружено: "${finalName}". Не забудь Сохранить!`);
                    fileInput.value = '';
                };
            };
            reader.readAsDataURL(file);
        });

        async function deleteSound(index) {
            if (currentPlayingIndex === index) stopPlayback();
            delete soundData[index];
            try { await dbDelete(String(index)); } catch (e) { console.error(e); }
            updateVisuals(index);
            showStatus("Трек удален");
        }

        function updateVisuals(index) {
            const btn = document.getElementById(`btn-${index}`);
            const label = document.getElementById(`label-${index}`);
            if (soundData[index]) {
                btn.classList.add('has-sound');
                label.textContent = soundData[index].label;
                label.title = soundData[index].label;
            } else {
                btn.classList.remove('has-sound');
                label.innerHTML = '<span class="empty-label">Пусто</span>';
                label.title = "";
            }
        }

        async function saveProgress() {
            try {
                const keys = Object.keys(soundData);
                for (const k of keys) await dbPut(k, soundData[k]);
                showStatus("Сохранено успешно!");
            } catch (e) {
                alert("Ошибка сохранения: " + e.message);
            }
        }

        async function loadFromStorage() {
            try {
                const saved = await dbGetAll();
                soundData = saved || {};
                for (let i = 1; i <= TOTAL_BUTTONS; i++) updateVisuals(i);
                if (Object.keys(soundData).length) showStatus("Прогресс загружен");
            } catch (e) { console.error(e); }
        }

        async function clearAll() {
            if (confirm("Полностью очистить саундпак?")) {
                stopPlayback();
                soundData = {};
                try { await dbClear(); } catch (e) { console.error(e); }
                for (let i = 1; i <= TOTAL_BUTTONS; i++) updateVisuals(i);
                showStatus("Очищено");
            }
        }

        function showStatus(text) {
            statusMsg.textContent = text;
            setTimeout(() => { if (statusMsg.textContent === text) statusMsg.textContent = ""; }, 3000);
        }

        /* =========================================================
           WEBRTC ТРАНСЛЯЦИЯ через PeerJS
           ========================================================= */
        let peer = null;
        let call = null;
        let streamDest = null;
        let audioCtx = null;
        let streamActive = false;
        let isHost = false;

        function toggleStream() {
            const panel = document.getElementById('streamPanel');
            if (panel.classList.contains('visible')) {
                panel.classList.remove('visible');
                stopStream();
            } else {
                panel.classList.add('visible');
                document.getElementById('modeSelector').style.display = 'block';
                document.getElementById('hostView').style.display = 'none';
                document.getElementById('guestView').style.display = 'none';
            }
        }

        function randomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }

        function startHost() {
            isHost = true;
            const code = randomCode();
            document.getElementById('modeSelector').style.display = 'none';
            document.getElementById('hostView').style.display = 'block';
            document.getElementById('roomCode').textContent = code;
            document.getElementById('hostStatus').textContent = 'Подключение к серверу...';

            // Инициализация аудиоконтекста для перехвата звука
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (!streamDest) streamDest = audioCtx.createMediaStreamDestination();
            streamActive = true;

            peer = new Peer('sp42-' + code, { debug: 1 });

            peer.on('open', (id) => {
                document.getElementById('hostStatus').textContent = '✅ Комната готова. Отправь код другу.';
                document.getElementById('streamBtn').classList.add('active');
                document.getElementById('streamBtn').textContent = '⏹ Остановить трансляцию';
            });

            peer.on('call', (incoming) => {
                call = incoming;
                call.answer(streamDest.stream);
                document.getElementById('hostStatus').textContent = '🎧 Друг подключился и слушает!';
                call.on('close', () => {
                    document.getElementById('hostStatus').textContent = 'Друг отключился. Ждём...';
                });
            });

            peer.on('error', (err) => {
                console.error(err);
                document.getElementById('hostStatus').textContent = '❌ Ошибка: ' + err.type;
            });
        }

        function showGuest() {
            document.getElementById('modeSelector').style.display = 'none';
            document.getElementById('guestView').style.display = 'block';
        }

        function joinRoom() {
            const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
            if (code.length !== 6) { alert("Код должен содержать 6 символов"); return; }

            document.getElementById('guestStatus').textContent = 'Подключение...';
            peer = new Peer({ debug: 1 });

            peer.on('open', () => {
                call = peer.call('sp42-' + code, new MediaStream());
                if (!call) {
                    document.getElementById('guestStatus').textContent = '❌ Не удалось подключиться';
                    return;
                }

                call.on('stream', (remoteStream) => {
                    const audio = document.getElementById('remoteAudio') || document.createElement('audio');
                    audio.id = 'remoteAudio';
                    audio.srcObject = remoteStream;
                    audio.autoplay = true;
                    document.body.appendChild(audio);
                    document.getElementById('guestStatus').textContent = '🎵 Слушаешь музыку друга!';
                    document.getElementById('streamBtn').classList.add('active');
                    document.getElementById('streamBtn').textContent = '⏹ Отключиться';
                });

                call.on('close', () => {
                    document.getElementById('guestStatus').textContent = 'Соединение закрыто';
                });

                call.on('error', (err) => {
                    document.getElementById('guestStatus').textContent = '❌ Ошибка: ' + err;
                });
            });

            peer.on('error', (err) => {
                console.error(err);
                document.getElementById('guestStatus').textContent = '❌ ' + (err.type === 'peer-unavailable' ? 'Комната не найдена' : err.type);
            });
        }

        function stopStream() {
            streamActive = false;
            if (call) { try { call.close(); } catch(e){} call = null; }
            if (peer) { try { peer.destroy(); } catch(e){} peer = null; }
            const remote = document.getElementById('remoteAudio');
            if (remote) remote.remove();
            document.getElementById('streamBtn').classList.remove('active');
            document.getElementById('streamBtn').textContent = '🔊 Создать комнату';
            document.getElementById('modeSelector').style.display = 'block';
            document.getElementById('hostView').style.display = 'none';
            document.getElementById('guestView').style.display = 'none';
        }

        function copyRoomCode() {
            const code = document.getElementById('roomCode').textContent;
            navigator.clipboard.writeText(code).then(() => showStatus("Код скопирован!"));
        }

        function copyRoomLink() {
            const code = document.getElementById('roomCode').textContent;
            const link = location.origin + location.pathname + '?join=' + code;
            navigator.clipboard.writeText(link).then(() => showStatus("Ссылка скопирована!"));
        }

        // Автовход по ссылке ?join=XXXXXX
        window.addEventListener('load', () => {
            const params = new URLSearchParams(location.search);
            const joinCode = params.get('join');
            if (joinCode) {
                document.getElementById('streamPanel').classList.add('visible');
                showGuest();
                document.getElementById('joinCodeInput').value = joinCode.toUpperCase();
                setTimeout(joinRoom, 500);
            }
        });

        init();
    </script>
</body>
</html>

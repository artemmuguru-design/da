<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Саморазвивающийся ИИ на круге 🧠🚗</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(45deg, #0b1c2c, #132c3c);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        .game-container {
            background: #1e3a4d;
            padding: 20px;
            border-radius: 32px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        canvas {
            background: #1f4d3a;
            border-radius: 24px;
            box-shadow: inset 0 0 20px #0f2b1e, 0 10px 15px rgba(0,0,0,0.5);
            display: block;
            cursor: crosshair;
        }
        .panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background: #0f2a33;
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }
        .time-buttons {
            display: flex;
            gap: 10px;
        }
        button {
            background: #2a5f6e;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 10px 22px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.15s;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 #0e2c33;
            border: 1px solid #4c9bb0;
        }
        button:hover {
            background: #3785a0;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #0e2c33;
        }
        button.active {
            background: #e6b800;
            color: #0b1c2c;
            border-color: #ffd966;
            box-shadow: 0 0 15px #ffd966;
        }
        .stats {
            display: flex;
            gap: 24px;
            color: #d9eef7;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .stat-item {
            background: #0d2029;
            padding: 6px 16px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .brain-indicator {
            color: #b3e6ff;
            font-size: 1rem;
        }
        .best-score {
            background: #1a3a2a;
            border: 1px solid #4caf50;
        }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="gameCanvas" width="700" height="700"></canvas>

    <div class="panel">
        <div class="time-buttons">
            <button id="speed1x" class="active">1x</button>
            <button id="speed10x">10x</button>
            <button id="speed100x">100x</button>
            <button id="speed1000x">1000x</button>
        </div>
        <div class="stats">
            <div class="stat-item">🧠 <span id="brainStatus">Думает...</span></div>
            <div class="stat-item">🏁 <span id="lapCounter">0</span> кругов</div>
            <div class="stat-item">⏱️ <span id="generationCounter">0</span> поколение</div>
            <div class="stat-item best-score">🏆 <span id="bestScore">0</span> рекорд</div>
        </div>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // === КОНСТАНТЫ ДОРОГИ ===
        const CX = canvas.width / 2;
        const CY = canvas.height / 2;
        const ROAD_INNER_RADIUS = 160;
        const ROAD_OUTER_RADIUS = 260;
        const ROAD_CENTER_RADIUS = (ROAD_INNER_RADIUS + ROAD_OUTER_RADIUS) / 2;
        const CAR_SIZE = 16;

        // === ПОПУЛЯЦИЯ ИИ ===
        const POPULATION_SIZE = 50; // количество машин в популяции
        const MUTATION_RATE = 0.15; // сила мутаций
        const MUTATION_PROBABILITY = 0.3; // вероятность мутации каждого гена
        
        // Лучший ИИ за всю историю
        let bestBrain = null;
        let bestScore = 0;
        let bestLaps = 0;

        // Популяция машин
        let population = [];
        let generation = 0;
        let generationBestScore = 0;

        // Управление скоростью симуляции
        let speedMultiplier = 1;
        let frameCount = 0;

        // === КЛАСС МАШИНЫ ===
        class Car {
            constructor(brain = null) {
                this.angle = 0;
                this.speed = 0;
                this.x = CX + ROAD_CENTER_RADIUS;
                this.y = CY;
                this.alive = true;
                this.fitness = 0;
                this.lapsCompleted = 0;
                this.framesAlive = 0;
                this.totalDistance = 0;
                this.lastAngle = 0;
                this.currentLapProgress = 0;
                
                // Создаем или копируем мозг
                if (brain) {
                    this.brain = {
                        weights: [...brain.weights],
                        bias: brain.bias
                    };
                } else {
                    this.brain = this.createRandomBrain();
                }
            }

            createRandomBrain() {
                return {
                    weights: [
                        Math.random() * 4 - 2,  // вес для сенсора "прямо"
                        Math.random() * 4 - 2,  // вес для сенсора "влево"
                        Math.random() * 4 - 2,  // вес для сенсора "вправо"
                        Math.random() * 4 - 2,  // вес для скорости
                        Math.random() * 4 - 2,  // вес для угла отклонения
                    ],
                    bias: Math.random() * 2 - 1
                };
            }

            // Получение сенсорных данных
            getSensors() {
                const sensorAngles = [
                    car => car.angle,                    // прямо
                    car => car.angle - Math.PI / 4,      // левее
                    car => car.angle + Math.PI / 4,      // правее
                    car => car.angle - Math.PI / 2,      // сильно влево
                    car => car.angle + Math.PI / 2,      // сильно вправо
                ];
                
                const distances = [];
                for (let i = 0; i < sensorAngles.length; i++) {
                    const angle = sensorAngles[i](this);
                    const dirX = Math.cos(angle);
                    const dirY = Math.sin(angle);
                    
                    // Находим расстояние до границ дороги
                    const distToInner = this.rayCircleIntersection(
                        this.x, this.y, dirX, dirY, CX, CY, ROAD_INNER_RADIUS
                    );
                    const distToOuter = this.rayCircleIntersection(
                        this.x, this.y, dirX, dirY, CX, CY, ROAD_OUTER_RADIUS
                    );
                    
                    const minDist = Math.min(distToInner, distToOuter);
                    distances.push(minDist === Infinity ? 100 : minDist);
                }
                
                return distances;
            }

            rayCircleIntersection(ox, oy, dx, dy, cx, cy, r) {
                const L = Math.hypot(cx - ox, cy - oy);
                const tca = ((cx - ox) * dx + (cy - oy) * dy) / (dx * dx + dy * dy);
                if (tca < 0) return Infinity;
                const d2 = L * L - tca * tca;
                if (d2 > r * r) return Infinity;
                const thc = Math.sqrt(r * r - d2);
                const t1 = tca - thc;
                const t2 = tca + thc;
                if (t1 > 0) return t1;
                if (t2 > 0) return t2;
                return Infinity;
            }

            // Принятие решения на основе сенсоров
            decide(sensors) {
                const normalizedSensors = sensors.map(s => Math.min(s / 50, 1));
                const speedFactor = this.speed / 3;
                const angleDeviation = Math.abs(this.angle % (Math.PI * 2));
                
                const inputs = [
                    normalizedSensors[0],  // прямо
                    normalizedSensors[1],  // влево
                    normalizedSensors[2],  // вправо
                    speedFactor,           // текущая скорость
                    angleDeviation,        // угол
                ];
                
                // Нейросеть: взвешенная сумма входов
                let sum = this.brain.bias;
                for (let i = 0; i < inputs.length; i++) {
                    sum += this.brain.weights[i] * inputs[i];
                }
                
                // Функция активации (tanh для плавности)
                const activation = Math.tanh(sum);
                
                // Преобразуем в действие
                if (activation < -0.3) return 'left';
                if (activation > 0.3) return 'right';
                return 'straight';
            }

            // Обновление состояния машины
            update() {
                if (!this.alive) return;
                
                this.framesAlive++;
                const sensors = this.getSensors();
                const action = this.decide(sensors);
                
                // Применяем действие
                const turnRate = 0.06;
                if (action === 'left') {
                    this.angle -= turnRate;
                } else if (action === 'right') {
                    this.angle += turnRate;
                }
                
                // Управление скоростью
                const minSensorDist = Math.min(...sensors);
                if (minSensorDist < 15) {
                    this.speed = Math.max(0.5, this.speed - 0.1);
                } else {
                    this.speed = Math.min(3.0, this.speed + 0.15);
                }
                
                // Обновляем позицию
                this.angle += this.speed * 0.004;
                if (this.angle > Math.PI * 2) {
                    this.angle -= Math.PI * 2;
                    this.lapsCompleted++;
                }
                if (this.angle < 0) this.angle += Math.PI * 2;
                
                // Вычисляем координаты
                this.x = CX + ROAD_CENTER_RADIUS * Math.cos(this.angle);
                this.y = CY + ROAD_CENTER_RADIUS * Math.sin(this.angle);
                
                // Вычисляем фитнес
                this.totalDistance += this.speed;
                this.fitness = this.totalDistance + this.lapsCompleted * 1000;
                
                // Проверка на вылет с дороги
                const distFromCenter = Math.hypot(this.x - CX, this.y - CY);
                if (distFromCenter < ROAD_INNER_RADIUS - 10 || 
                    distFromCenter > ROAD_OUTER_RADIUS + 10) {
                    this.alive = false;
                }
            }

            // Мутация мозга
            mutate() {
                for (let i = 0; i < this.brain.weights.length; i++) {
                    if (Math.random() < MUTATION_PROBABILITY) {
                        this.brain.weights[i] += (Math.random() - 0.5) * MUTATION_RATE;
                        this.brain.weights[i] = Math.max(-4, Math.min(4, this.brain.weights[i]));
                    }
                }
                if (Math.random() < MUTATION_PROBABILITY) {
                    this.brain.bias += (Math.random() - 0.5) * MUTATION_RATE;
                    this.brain.bias = Math.max(-2, Math.min(2, this.brain.bias));
                }
            }
        }

        // === ГЕНЕТИЧЕСКИЙ АЛГОРИТМ ===
        function createInitialPopulation() {
            population = [];
            for (let i = 0; i < POPULATION_SIZE; i++) {
                population.push(new Car());
            }
        }

        function evolvePopulation() {
            // Сортируем по фитнесу (от лучшего к худшему)
            population.sort((a, b) => b.fitness - a.fitness);
            
            // Обновляем лучший результат
            if (population[0].fitness > bestScore) {
                bestScore = population[0].fitness;
                bestLaps = population[0].lapsCompleted;
                bestBrain = {
                    weights: [...population[0].brain.weights],
                    bias: population[0].brain.bias
                };
            }
            
            generationBestScore = population[0].fitness;
            
            // Создаем новое поколение
            const newPopulation = [];
            
            // Элитизм: сохраняем лучших 20%
            const eliteCount = Math.floor(POPULATION_SIZE * 0.2);
            for (let i = 0; i < eliteCount; i++) {
                newPopulation.push(new Car(population[i].brain));
            }
            
            // Создаем потомков через скрещивание и мутации
            while (newPopulation.length < POPULATION_SIZE) {
                const parent1 = this.selectParent(population);
                const parent2 = this.selectParent(population);
                const child = this.crossover(parent1, parent2);
                child.mutate();
                newPopulation.push(child);
            }
            
            population = newPopulation;
            generation++;
        }

        function selectParent(sortedPopulation) {
            // Турнирная селекция
            const tournamentSize = 5;
            let best = null;
            for (let i = 0; i < tournamentSize; i++) {
                const randomIndex = Math.floor(Math.random() * sortedPopulation.length);
                const candidate = sortedPopulation[randomIndex];
                if (!best || candidate.fitness > best.fitness) {
                    best = candidate;
                }
            }
            return best;
        }

        function crossover(parent1, parent2) {
            const child = new Car();
            // Смешиваем гены родителей
            for (let i = 0; i < child.brain.weights.length; i++) {
                if (Math.random() < 0.5) {
                    child.brain.weights[i] = parent1.brain.weights[i];
                } else {
                    child.brain.weights[i] = parent2.brain.weights[i];
                }
            }
            child.brain.bias = Math.random() < 0.5 ? parent1.brain.bias : parent2.brain.bias;
            return child;
        }

        // === ОТРИСОВКА ===
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Дорога
            ctx.beginPath();
            ctx.arc(CX, CY, ROAD_OUTER_RADIUS, 0, Math.PI * 2);
            ctx.arc(CX, CY, ROAD_INNER_RADIUS, 0, Math.PI * 2, true);
            ctx.fillStyle = '#2e3b2e';
            ctx.fill();
            ctx.strokeStyle = '#b0b0b0';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // Разметка
            ctx.beginPath();
            ctx.setLineDash([12, 16]);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#f5e56b';
            ctx.arc(CX, CY, ROAD_CENTER_RADIUS, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Стартовая линия
            const startX = CX + ROAD_CENTER_RADIUS;
            const startY = CY;
            ctx.beginPath();
            ctx.moveTo(startX - 14, startY - 12);
            ctx.lineTo(startX + 14, startY + 12);
            ctx.strokeStyle = '#ff4d4d';
            ctx.lineWidth = 5;
            ctx.stroke();
            
            // Машины
            population.forEach(car => {
                if (!car.alive) return;
                
                ctx.save();
                ctx.translate(car.x, car.y);
                ctx.rotate(car.angle + Math.PI / 2);
                
                // Цвет зависит от фитнеса
                const fitnessRatio = car.fitness / (bestScore || 1);
                const green = Math.floor(255 * Math.min(fitnessRatio, 1));
                const red = Math.floor(255 * (1 - Math.min(fitnessRatio, 1)));
                ctx.fillStyle = `rgb(${red}, ${green}, 100)`;
                
                ctx.shadowColor = '#ffcc66';
                ctx.shadowBlur = 5;
                ctx.fillRect(-CAR_SIZE / 2, -CAR_SIZE / 2, CAR_SIZE, CAR_SIZE);
                
                // Индикатор направления
                ctx.fillStyle = '#222';
                ctx.fillRect(-3, -CAR_SIZE / 2 - 4, 6, 6);
                
                ctx.restore();
            });
            
            // Сенсоры лучшей машины
            if (population.length > 0) {
                const bestCar = population.reduce((a, b) => 
                    (a.fitness > b.fitness) ? a : b
                );
                
                if (bestCar.alive) {
                    const sensors = bestCar.getSensors();
                    const sensorAngles = [
                        bestCar.angle,
                        bestCar.angle - Math.PI / 4,
                        bestCar.angle + Math.PI / 4,
                        bestCar.angle - Math.PI / 2,
                        bestCar.angle + Math.PI / 2,
                    ];
                    
                    for (let i = 0; i < 5; i++) {
                        const dist = Math.min(sensors[i], 50);
                        const endX = bestCar.x + Math.cos(sensorAngles[i]) * dist;
                        const endY = bestCar.y + Math.sin(sensorAngles[i]) * dist;
                        
                        ctx.beginPath();
                        ctx.moveTo(bestCar.x, bestCar.y);
                        ctx.lineTo(endX, endY);
                        ctx.strokeStyle = i === 0 ? '#00ffaa' : '#ffaa00';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    }
                }
            }
        }

        // === ИГРОВОЙ ЦИКЛ ===
        function gameLoop() {
            // Выполняем шаги симуляции
            const stepsPerFrame = speedMultiplier;
            
            for (let step = 0; step < stepsPerFrame; step++) {
                let allDead = true;
                
                // Обновляем все машины
                population.forEach(car => {
                    if (car.alive) {
                        car.update();
                        allDead = false;
                    }
                });
                
                // Если все машины мертвы или прошло много кадров - эволюция
                if (allDead || frameCount > 300) {
                    evolvePopulation();
                    frameCount = 0;
                    break;
                }
                
                frameCount++;
            }
            
            // Обновляем статистику
            const aliveCount = population.filter(car => car.alive).length;
            const bestCar = population.reduce((a, b) => 
                (a.fitness > b.fitness) ? a : b
            );
            
            document.getElementById('lapCounter').innerText = bestCar.lapsCompleted;
            document.getElementById('generationCounter').innerText = generation;
            document.getElementById('bestScore').innerText = Math.floor(bestScore);
            document.getElementById('brainStatus').innerText = 
                `Живы: ${aliveCount}/${POPULATION_SIZE}`;
            
            // Рисуем
            draw();
            
            requestAnimationFrame(gameLoop);
        }

        // === ОБРАБОТЧИКИ КНОПОК ===
        const speedButtons = {
            'speed1x': 1,
            'speed10x': 10,
            'speed100x': 100,
            'speed1000x': 1000
        };
        
        Object.keys(speedButtons).forEach(id => {
            document.getElementById(id).addEventListener('click', function() {
                speedMultiplier = speedButtons[id];
                setActiveButton(this);
            });
        });
        
        function setActiveButton(activeBtn) {
            document.querySelectorAll('.time-buttons button').forEach(btn => 
                btn.classList.remove('active')
            );
            activeBtn.classList.add('active');
        }
        
        // === ЗАПУСК ===
        createInitialPopulation();
        gameLoop();
    })();
</script>
</body>
</html>

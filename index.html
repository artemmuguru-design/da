<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Park - Бесконечная телепортация</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #000;
        }
    </style>
</head>
<body>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <a-scene id="vr-scene" 
             renderer="antialias: true; colorManagement: true"
             vr-mode-ui="enabled: true;">
        
        <!-- Освещение -->
        <a-entity light="type: ambient; color: #BBB; intensity: 0.4"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="1 3 2"></a-entity>
        <a-entity light="type: point; color: #FFE4B5; intensity: 0.5" position="0 3 0"></a-entity>

        <!-- Пол -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" 
                 color="#808080" material="roughness: 0.7; metalness: 0.1" class="floor"></a-plane>
        
        <!-- Разметка на полу -->
        <a-grid position="0 0.01 0" rotation="-90 0 0" width="20" height="20" 
                gridsize="2" thickness="0.03" color="#666"></a-grid>

        <!-- Стены -->
        <a-plane position="0 2.5 -10" rotation="0 0 0" width="20" height="5" 
                 color="#D3D3D3" material="roughness: 0.9; side: double"></a-plane>
        <a-plane position="0 2.5 10" rotation="0 180 0" width="20" height="5" 
                 color="#D3D3D3" material="roughness: 0.9; side: double"></a-plane>
        <a-plane position="-10 2.5 0" rotation="0 90 0" width="20" height="5" 
                 color="#C0C0C0" material="roughness: 0.9; side: double"></a-plane>
        <a-plane position="10 2.5 0" rotation="0 -90 0" width="20" height="5" 
                 color="#C0C0C0" material="roughness: 0.9; side: double"></a-plane>

        <!-- Потолок -->
        <a-plane position="0 5 0" rotation="90 0 0" width="20" height="20" 
                 color="#E8E8E8" material="roughness: 0.9; side: double"></a-plane>

        <!-- Декоративные элементы -->
        <a-box position="-4 0.5 -4" width="1.5" height="1" depth="1.5" color="#FF6B6B" 
               material="roughness: 0.4; metalness: 0.3"></a-box>
        <a-box position="4 0.75 -4" width="1" height="1.5" depth="1" color="#4ECDC4" 
               material="roughness: 0.4; metalness: 0.3"></a-box>
        <a-box position="-4 0.5 4" width="1" height="1" depth="1" color="#45B7D1" 
               material="roughness: 0.4; metalness: 0.3"></a-box>
        <a-box position="4 0.5 4" width="1" height="1" depth="1.5" color="#96CEB4" 
               material="roughness: 0.4; metalness: 0.3"></a-box>
        <a-box position="0 0.3 -6" width="2.5" height="0.6" depth="2.5" color="#FFEAA7" 
               material="roughness: 0.5; metalness: 0.2"></a-box>
        
        <a-sphere position="6 0.8 -6" radius="0.8" color="#FF8C00" 
                  material="roughness: 0.3; metalness: 0.5"></a-sphere>
        <a-cylinder position="-6 0.6 6" radius="0.6" height="1.2" color="#8B4513" 
                    material="roughness: 0.5; metalness: 0.2"></a-cylinder>
        <a-cone position="6 0.5 6" radius-bottom="0.7" radius-top="0" height="1.5" 
                color="#9370DB" material="roughness: 0.4; metalness: 0.3"></a-cone>

        <!-- Светящиеся шары для атмосферы -->
        <a-sphere position="-6 3 -6" radius="0.2" color="#00FF00" 
                  material="emissive: #00FF00; emissiveIntensity: 0.8" 
                  animation="property: position; from: -6 3 -6; to: -6 3.5 -6; dir: alternate; dur: 2000; loop: true"></a-sphere>
        <a-sphere position="6 3 -6" radius="0.2" color="#FF00FF" 
                  material="emissive: #FF00FF; emissiveIntensity: 0.8"
                  animation="property: position; from: 6 3 -6; to: 6 3.5 -6; dir: alternate; dur: 2500; loop: true"></a-sphere>
        <a-sphere position="0 3 6" radius="0.2" color="#00FFFF" 
                  material="emissive: #00FFFF; emissiveIntensity: 0.8"
                  animation="property: position; from: 0 3 6; to: 0 3.5 6; dir: alternate; dur: 1800; loop: true"></a-sphere>

        <!-- Камера с ретиклем -->
        <a-entity id="player" position="0 1.6 0" camera look-controls>
            
            <!-- Красный прицел (ретикль) -->
            <a-entity id="reticle-container" position="0 0 -0.5">
                <!-- Внешнее кольцо -->
                <a-ring position="0 0 0" radius-inner="0.008" radius-outer="0.012" 
                        color="#FF0000" material="shader: flat; emissive: #FF0000; emissiveIntensity: 1.5">
                </a-ring>
                <!-- Внутренняя точка -->
                <a-ring position="0 0 0" radius-inner="0.001" radius-outer="0.004" 
                        color="#FF3333" material="shader: flat; emissive: #FF0000; emissiveIntensity: 2">
                </a-ring>
                
                <!-- Прогресс-бар телепортации -->
                <a-entity id="teleport-progress" position="0 0.03 0" visible="false">
                    <a-ring position="0 0 0" radius-inner="0.01" radius-outer="0.012" 
                            color="#00FF00" material="shader: flat; emissive: #00FF00; emissiveIntensity: 1"
                            theta-length="0">
                        <a-animation id="progress-animation" attribute="theta-length" 
                                   from="0" to="360" dur="5000" easing="linear" begin="startProgress">
                        </a-animation>
                    </a-ring>
                    <!-- Обратный отсчет -->
                    <a-text id="countdown-text" position="0 0.04 0" align="center" 
                            value="" color="#00FF00" width="0.1" 
                            material="emissive: #00FF00; emissiveIntensity: 1"></a-text>
                </a-entity>
            </a-entity>

            <!-- Луч для отслеживания взгляда -->
            <a-entity id="cursor" cursor="rayOrigin: mouse; fuse: false" 
                      raycaster="objects: .floor; far: 30; interval: 100"
                      line="color: #FF0000; opacity: 0.3; visible: false">
            </a-entity>
        </a-entity>

        <!-- VR UI Панель с информацией -->
        <a-entity id="vr-ui-panel" position="0 2.5 -3" rotation="0 0 0">
            <!-- Фон панели -->
            <a-plane width="1.2" height="0.4" color="#1a1a1a" 
                     material="opacity: 0.8; roughness: 0.5; metalness: 0.5"></a-plane>
            <a-plane width="1.15" height="0.35" position="0 0 0.01" color="#2a2a2a" 
                     material="opacity: 0.6; roughness: 0.3; metalness: 0.7"></a-plane>
            
            <!-- Заголовок -->
            <a-text position="0 0.1 0.02" value="🎮 VR PARK" align="center" 
                    color="#FF0000" width="1.2" material="emissive: #FF0000; emissiveIntensity: 0.5"></a-text>
            
            <!-- Статус -->
            <a-text id="vr-status-text" position="0 0 0.02" value="⏱️ Готов" align="center" 
                    color="#FFFFFF" width="1" material="emissive: #FFFFFF; emissiveIntensity: 0.3"></a-text>
            
            <!-- Инструкция -->
            <a-text position="0 -0.1 0.02" value="Смотри на пол 5 сек" align="center" 
                    color="#AAAAAA" width="1.1" material="emissive: #AAAAAA; emissiveIntensity: 0.2"></a-text>
        </a-entity>

        <!-- Маркер последней телепортации -->
        <a-entity id="teleport-markers"></a-entity>
    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const scene = document.querySelector('a-scene');
            const player = document.getElementById('player');
            const cursor = document.getElementById('cursor');
            const reticleContainer = document.getElementById('reticle-container');
            const teleportProgress = document.getElementById('teleport-progress');
            const countdownText = document.getElementById('countdown-text');
            const vrStatusText = document.getElementById('vr-status-text');
            const teleportMarkers = document.getElementById('teleport-markers');
            const progressAnimation = document.getElementById('progress-animation');
            
            let isLookingAtFloor = false;
            let teleportTimer = null;
            let countdownValue = 5;
            let isTeleporting = false;
            let teleportCount = 0;

            // Функция для проверки, смотрит ли игрок на пол
            function checkFloorLook(direction) {
                // Если смотрим вниз (угол меньше -30 градусов от горизонта)
                return direction.y < -0.3;
            }

            // Сброс таймера телепортации
            function resetTeleportTimer() {
                if (teleportTimer) {
                    clearInterval(teleportTimer);
                    teleportTimer = null;
                }
                countdownValue = 5;
                isLookingAtFloor = false;
                isTeleporting = false;
                
                // Скрываем прогресс
                teleportProgress.setAttribute('visible', false);
                
                // Сбрасываем анимацию прогресса
                const ring = teleportProgress.querySelector('a-ring');
                if (ring) {
                    ring.setAttribute('theta-length', '0');
                }
                
                // Обновляем статус
                vrStatusText.setAttribute('value', '⏱️ Готов');
                vrStatusText.setAttribute('color', '#FFFFFF');
            }

            // Выполнение телепортации
            function performTeleport() {
                if (isTeleporting) return;
                isTeleporting = true;
                
                // Получаем направление взгляда
                const playerRotation = player.getAttribute('rotation');
                const rotationRad = THREE.MathUtils.degToRad(playerRotation.y);
                const pitchRad = THREE.MathUtils.degToRad(playerRotation.x);
                
                // Вычисляем направление с учетом поворота по вертикали
                const direction = new THREE.Vector3(
                    -Math.sin(rotationRad) * Math.cos(pitchRad),
                    -Math.sin(pitchRad),
                    -Math.cos(rotationRad) * Math.cos(pitchRad)
                );
                direction.normalize();
                
                // Находим пересечение с полом (y = 0)
                const playerPos = player.getAttribute('position');
                const cameraPos = new THREE.Vector3(playerPos.x, playerPos.y, playerPos.z);
                
                if (direction.y < 0) {
                    const t = -cameraPos.y / direction.y;
                    if (t > 0 && t < 20) {
                        const targetX = cameraPos.x + direction.x * t;
                        const targetZ = cameraPos.z + direction.z * t;
                        
                        // Ограничиваем пределами комнаты
                        const clampedX = Math.max(-9, Math.min(9, targetX));
                        const clampedZ = Math.max(-9, Math.min(9, targetZ));
                        
                        // Сохраняем высоту
                        const targetY = 1.6;
                        
                        // Телепортация
                        player.setAttribute('position', `${clampedX} ${targetY} ${clampedZ}`);
                        
                        // Увеличиваем счетчик
                        teleportCount++;
                        
                        // Создаем эффект на месте телепортации
                        createTeleportEffect(clampedX, 0.1, clampedZ);
                        
                        // Создаем маркер
                        createTeleportMarker(clampedX, 0.05, clampedZ);
                        
                        // Обновляем статус
                        vrStatusText.setAttribute('value', `✨ Телепорт #${teleportCount}`);
                        vrStatusText.setAttribute('color', '#00FF00');
                        
                        // Воспроизводим звук (если есть)
                        const sound = document.getElementById('teleport-sound');
                        if (sound) {
                            sound.play();
                        }
                        
                        // Через 2 секунды сбрасываем статус
                        setTimeout(() => {
                            if (!isLookingAtFloor) {
                                vrStatusText.setAttribute('value', '⏱️ Готов');
                                vrStatusText.setAttribute('color', '#FFFFFF');
                            }
                        }, 2000);
                    }
                }
                
                // Сбрасываем таймер
                resetTeleportTimer();
                isTeleporting = false;
            }

            // Создание эффекта телепортации
            function createTeleportEffect(x, y, z) {
                const effect = document.createElement('a-entity');
                
                // Световой круг
                const circle = document.createElement('a-ring');
                circle.setAttribute('position', `${x} ${y} ${z}`);
                circle.setAttribute('rotation', '-90 0 0');
                circle.setAttribute('radius-inner', '0.1');
                circle.setAttribute('radius-outer', '1.5');
                circle.setAttribute('color', '#00FF00');
                circle.setAttribute('material', 'opacity: 0.8; emissive: #00FF00; emissiveIntensity: 1; transparent: true');
                
                // Анимация расширения и исчезновения
                circle.setAttribute('animation__scale', {
                    property: 'scale',
                    from: '0.1 0.1 0.1',
                    to: '2 2 2',
                    dur: 800,
                    easing: 'easeOutQuad'
                });
                
                circle.setAttribute('animation__fade', {
                    property: 'material.opacity',
                    from: '0.8',
                    to: '0',
                    dur: 800,
                    easing: 'easeOutQuad'
                });
                
                effect.appendChild(circle);
                
                // Частицы
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const particle = document.createElement('a-sphere');
                    particle.setAttribute('position', `${x} ${y} ${z}`);
                    particle.setAttribute('radius', '0.05');
                    particle.setAttribute('color', '#00FF00');
                    particle.setAttribute('material', 'emissive: #00FF00; emissiveIntensity: 0.5');
                    
                    const targetX = x + Math.cos(angle) * 1.5;
                    const targetZ = z + Math.sin(angle) * 1.5;
                    
                    particle.setAttribute('animation', {
                        property: 'position',
                        from: `${x} ${y} ${z}`,
                        to: `${targetX} ${y + 1} ${targetZ}`,
                        dur: 600,
                        easing: 'easeOutQuad'
                    });
                    
                    particle.setAttribute('animation__fade', {
                        property: 'material.opacity',
                        from: '1',
                        to: '0',
                        dur: 600,
                        easing: 'easeOutQuad'
                    });
                    
                    effect.appendChild(particle);
                }
                
                scene.appendChild(effect);
                
                // Удаляем эффект через 1 секунду
                setTimeout(() => {
                    scene.removeChild(effect);
                }, 1000);
            }

            // Создание маркера телепортации
            function createTeleportMarker(x, y, z) {
                const marker = document.createElement('a-entity');
                
                // Полупрозрачный круг
                const circle = document.createElement('a-ring');
                circle.setAttribute('position', `${x} ${y} ${z}`);
                circle.setAttribute('rotation', '-90 0 0');
                circle.setAttribute('radius-inner', '0.15');
                circle.setAttribute('radius-outer', '0.2');
                circle.setAttribute('color', '#00FF00');
                circle.setAttribute('material', 'opacity: 0.5; emissive: #00FF00; emissiveIntensity: 0.3; transparent: true');
                
                // Номер телепортации
                const text = document.createElement('a-text');
                text.setAttribute('position', `${x} ${y + 0.01} ${z}`);
                text.setAttribute('rotation', '-90 0 0');
                text.setAttribute('value', `${teleportCount}`);
                text.setAttribute('align', 'center');
                text.setAttribute('color', '#00FF00');
                text.setAttribute('width', '0.3');
                text.setAttribute('material', 'emissive: #00FF00; emissiveIntensity: 0.5');
                
                marker.appendChild(circle);
                marker.appendChild(text);
                teleportMarkers.appendChild(marker);
                
                // Пульсация маркера
                marker.setAttribute('animation', {
                    property: 'scale',
                    from: '1 1 1',
                    to: '1.2 1.2 1.2',
                    dir: 'alternate',
                    dur: 1500,
                    loop: true,
                    easing: 'easeInOutQuad'
                });
                
                // Оставляем только последние 10 маркеров
                const markers = teleportMarkers.children;
                if (markers.length > 10) {
                    teleportMarkers.removeChild(markers[0]);
                }
            }

            // Обработчик пересечения луча с полом
            cursor.addEventListener('raycaster-intersection', function(evt) {
                if (evt.detail.intersections && evt.detail.intersections.length > 0) {
                    const intersection = evt.detail.intersections[0];
                    const point = intersection.point;
                    const face = intersection.face;
                    
                    // Проверяем, что это пол (нормаль направлена вверх)
                    if (face && face.normal && face.normal.y > 0.5) {
                        if (!isLookingAtFloor && !isTeleporting) {
                            // Начинаем отсчет
                            isLookingAtFloor = true;
                            countdownValue = 5;
                            
                            // Показываем прогресс-бар
                            teleportProgress.setAttribute('visible', true);
                            countdownText.setAttribute('value', '5');
                            
                            // Обновляем статус
                            vrStatusText.setAttribute('value', '⏱️ Смотрю на пол...');
                            vrStatusText.setAttribute('color', '#FFA500');
                            
                            // Запускаем анимацию прогресса
                            const progressRing = teleportProgress.querySelector('a-ring');
                            if (progressRing) {
                                progressRing.setAttribute('theta-length', '0');
                                progressRing.emit('startProgress');
                            }
                            
                            // Запускаем таймер
                            teleportTimer = setInterval(function() {
                                countdownValue--;
                                if (countdownValue > 0) {
                                    countdownText.setAttribute('value', countdownValue.toString());
                                    vrStatusText.setAttribute('value', `⏱️ Телепорт через ${countdownValue}...`);
                                } else {
                                    // Телепортация!
                                    clearInterval(teleportTimer);
                                    teleportTimer = null;
                                    performTeleport();
                                }
                            }, 1000);
                        }
                    }
                }
            });

            // Обработчик прекращения пересечения
            cursor.addEventListener('raycaster-intersection-cleared', function() {
                if (isLookingAtFloor && !isTeleporting) {
                    resetTeleportTimer();
                }
            });

            // Обработчик входа в VR
            scene.addEventListener('enter-vr', function() {
                console.log('Вход в VR режим');
                vrStatusText.setAttribute('value', '🥽 VR активен');
                vrStatusText.setAttribute('color', '#00FFFF');
            });

            // Обработчик выхода из VR
            scene.addEventListener('exit-vr', function() {
                console.log('Выход из VR режима');
                vrStatusText.setAttribute('value', '⏱️ Готов');
                vrStatusText.setAttribute('color', '#FFFFFF');
            });

            // Дополнительная проверка направления взгляда каждые 100мс
            setInterval(function() {
                if (isLookingAtFloor && !isTeleporting) {
                    const rotation = player.getAttribute('rotation');
                    const pitchRad = THREE.MathUtils.degToRad(rotation.x);
                    const direction = new THREE.Vector3(0, -Math.sin(pitchRad), -Math.cos(pitchRad));
                    
                    if (direction.y > -0.3) {
                        // Перестали смотреть на пол
                        resetTeleportTimer();
                    }
                }
            }, 100);

            console.log('🎮 VR Park готов!');
            console.log('📋 Управление:');
            console.log('  - Войдите в VR режим');
            console.log('  - Красная точка показывает центр взгляда');
            console.log('  - Смотрите на пол 5 секунд для телепортации');
            console.log('  - Можно телепортироваться неограниченное количество раз');
            console.log('  - Маркеры показывают историю телепортаций');
        });
    </script>
</body>
    </html>

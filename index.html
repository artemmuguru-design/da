<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VR Park - Строитель с телепортом</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@1.4.0/dist/aframe-physics-system.min.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
    
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      background: radial-gradient(circle, #ff0000 30%, rgba(255,0,0,0) 70%);
      border-radius: 50%;
      z-index: 1000;
      pointer-events: none;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
      border: 2px solid rgba(255, 50, 50, 0.9);
    }

    #fuse-circle {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -70%);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: conic-gradient(#00ff44 0% 0%, rgba(0, 255, 68, 0.2) 0% 100%);
      border: 3px solid #00ff44;
      z-index: 1000;
      pointer-events: none;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.4);
    }

    #fuse-text {
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 10px black;
      background: rgba(0,0,0,0.5);
      padding: 2px 8px;
      border-radius: 10px;
      font-family: monospace;
    }

    #drop-btn {
      position: fixed;
      bottom: 40px;
      right: 40px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #ff2222;
      color: white;
      font-size: 20px;
      font-weight: bold;
      border: 4px solid white;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.7);
      z-index: 999;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.3;
      padding: 10px;
      user-select: none;
      cursor: pointer;
    }
    #drop-btn:active { transform: scale(0.85); background: #cc0000; }

    #vr-btn {
      position: fixed;
      bottom: 40px;
      left: 40px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #4444ff;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border: 4px solid white;
      box-shadow: 0 0 40px rgba(0, 0, 255, 0.7);
      z-index: 999;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.3;
      padding: 10px;
      user-select: none;
      cursor: pointer;
    }
    #vr-btn:active { transform: scale(0.85); background: #3333cc; }

    #info {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 18px;
      background: rgba(0,0,0,0.8);
      padding: 10px 24px;
      border-radius: 40px;
      z-index: 999;
      border: 2px solid rgba(255,255,255,0.3);
      pointer-events: none;
      white-space: nowrap;
      text-align: center;
      font-family: Arial;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <div id="crosshair"></div>
  <div id="fuse-circle">
    <span id="fuse-text">5</span>
  </div>

  <button id="vr-btn">VR<br>РЕЖИМ</button>
  <button id="drop-btn">БРОСИТЬ<br>БЛОК</button>
  <div id="info">🎯 Наведись на блок 5 сек - взять, на пол 4 сек - телепорт</div>

  <a-scene id="scene" physics="driver: local; gravity: -9.8">
    
    <!-- СТЕНЫ -->
    <a-box position="0 2 -6" width="12" height="4" depth="0.3" color="#d0d0d0" static-body></a-box>
    <a-box position="-6 2 0" width="0.3" height="4" depth="12" color="#d0d0d0" static-body></a-box>
    <a-box position="6 2 0" width="0.3" height="4" depth="12" color="#d0d0d0" static-body></a-box>
    <a-box position="0 2 6" width="12" height="4" depth="0.3" color="#d0d0d0" opacity="0.15" static-body></a-box>

    <!-- ПОЛ И ПОТОЛОК -->
    <a-plane class="floor" position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#ffaa33" static-body></a-plane>
    <a-plane position="0 4 0" rotation="90 0 0" width="12" height="12" color="#ffaa33" static-body></a-plane>

    <!-- ОСВЕЩЕНИЕ -->
    <a-light type="ambient" intensity="0.7"></a-light>
    <a-light type="directional" position="5 10 5" intensity="0.9"></a-light>
    <a-light type="point" position="0 3 0" intensity="0.3" color="#ffaa55"></a-light>

    <!-- ПРАВАЯ РУКА ДЛЯ VR (будет носить блок) -->
    <a-entity id="rightHand" hand-tracking-controls="hand: right"></a-entity>

    <!-- КАМЕРА -->
    <a-camera id="camera" position="0 1.6 0" look-controls
              raycaster="objects: .block, .floor; far: 10; interval: 100">
    </a-camera>

    <!-- БЛОКИ -->
    <a-box class="block" position="-1.5 0.25 -2" width="0.5" height="0.5" depth="0.5" color="#ff5555" dynamic-body="mass: 1; shape: box"></a-box>
    <a-box class="block" position="1.5 0.25 -2.5" width="0.5" height="0.5" depth="0.5" color="#55aaff" dynamic-body="mass: 1; shape: box"></a-box>
    <a-box class="block" position="0 0.25 -4" width="0.5" height="0.5" depth="0.5" color="#55ff88" dynamic-body="mass: 1; shape: box"></a-box>
    <a-box class="block" position="-2.5 0.25 -4.5" width="0.5" height="0.5" depth="0.5" color="#ffaa55" dynamic-body="mass: 1; shape: box"></a-box>
    <a-box class="block" position="2.5 0.25 -5" width="0.5" height="0.5" depth="0.5" color="#cc77ff" dynamic-body="mass: 1; shape: box"></a-box>

  </a-scene>

  <script>
    (function() {
      const fuseCircle = document.getElementById('fuse-circle');
      const fuseText = document.getElementById('fuse-text');
      const info = document.getElementById('info');
      const dropBtn = document.getElementById('drop-btn');
      const vrBtn = document.getElementById('vr-btn');
      const scene = document.querySelector('#scene');
      const camera = document.querySelector('#camera');
      const rightHand = document.querySelector('#rightHand');

      let carriedBlock = null;
      let isFusing = false;
      let fuseTimer = 0;
      let fuseTarget = null;
      let fuseType = null;
      let fuseDuration = 5;
      const TELEPORT_DURATION = 4;

      // ===== ВЗЯТЬ БЛОК =====
      function pickUpBlock(block) {
        if (carriedBlock) return;
        carriedBlock = block;
        block.removeAttribute('dynamic-body');
        
        // Прикрепляем блок к камере (перед глазами)
        camera.appendChild(block);
        block.setAttribute('position', '0 -0.5 -1.5');
        block.setAttribute('rotation', '0 0 0');
        
        fuseCircle.style.display = 'none';
        isFusing = false;
        info.textContent = '✋ Блок взят! Иди куда хочешь, нажми БРОСИТЬ чтобы поставить';
        info.style.borderColor = '#44ff44';
      }

      // ===== ТЕЛЕПОРТ =====
      function teleportTo(position) {
        // Перемещаем камеру (игрока)
        camera.setAttribute('position', {
          x: position.x,
          y: 1.6,
          z: position.z
        });
        
        info.textContent = '🌀 Телепорт! Ты переместился';
        info.style.borderColor = '#44aaff';
        
        // Эффект вспышки
        const flash = document.createElement('div');
        flash.style.cssText = `
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: white;
          z-index: 9999;
          pointer-events: none;
          transition: opacity 0.5s;
        `;
        document.body.appendChild(flash);
        setTimeout(() => {
          flash.style.opacity = '0';
          setTimeout(() => flash.remove(), 500);
        }, 100);
        
        setTimeout(() => {
          info.textContent = '🎯 Наведись на блок 5 сек - взять, на пол 4 сек - телепорт';
          info.style.borderColor = 'rgba(255,255,255,0.3)';
        }, 2000);
      }

      // ===== БРОСИТЬ/ПОСТАВИТЬ БЛОК =====
      function dropBlock() {
        if (!carriedBlock) {
          info.textContent = '⚠️ Сначала возьми блок (наведись на 5 сек)';
          info.style.borderColor = '#ffaa00';
          setTimeout(() => {
            info.textContent = '🎯 Наведись на блок 5 сек - взять, на пол 4 сек - телепорт';
            info.style.borderColor = 'rgba(255,255,255,0.3)';
          }, 2000);
          return;
        }

        const block = carriedBlock;
        
        // Получаем позицию и направление камеры
        const camPos = camera.getAttribute('position');
        const camRot = camera.getAttribute('rotation');
        
        // Вычисляем направление вперед
        const radY = THREE.MathUtils.degToRad(camRot.y);
        const dirX = -Math.sin(radY);
        const dirZ = -Math.cos(radY);
        
        // Позиция для установки блока (на полу перед игроком)
        const placePos = {
          x: camPos.x + dirX * 2,
          y: 0.25, // На полу
          z: camPos.z + dirZ * 2
        };
        
        // Перемещаем блок обратно в сцену
        camera.removeChild(block);
        scene.appendChild(block);
        
        // Устанавливаем позицию
        block.setAttribute('position', placePos);
        block.setAttribute('dynamic-body', 'mass: 1; shape: box');
        
        carriedBlock = null;
        info.textContent = '📦 Блок поставлен!';
        info.style.borderColor = '#ffaa00';
        
        // Эффект установки
        block.setAttribute('color', '#ffff00');
        setTimeout(() => {
          block.setAttribute('color', block.getAttribute('data-original-color') || '#ff5555');
        }, 300);
        
        setTimeout(() => {
          info.textContent = '🎯 Наведись на блок 5 сек - взять, на пол 4 сек - телепорт';
          info.style.borderColor = 'rgba(255,255,255,0.3)';
        }, 2000);
      }

      // Сохраняем оригинальный цвет блока при создании
      document.querySelectorAll('.block').forEach(block => {
        block.setAttribute('data-original-color', block.getAttribute('color'));
      });

      // ===== ОБРАБОТЧИКИ RAYCASTER =====
      camera.addEventListener('raycaster-intersection', function(evt) {
        const intersections = evt.detail.intersections;
        if (intersections.length === 0 || carriedBlock) {
          if (isFusing) cancelFuse();
          return;
        }

        const target = intersections[0].object.el;
        if (!target) return;

        if (target.classList.contains('block')) {
          if (fuseTarget !== target || fuseType !== 'block') {
            fuseTarget = target;
            fuseType = 'block';
            fuseDuration = 5;
            startFuse();
          }
        } else if (target.classList.contains('floor')) {
          if (fuseTarget !== target || fuseType !== 'floor') {
            fuseTarget = target;
            fuseType = 'floor';
            fuseDuration = TELEPORT_DURATION;
            startFuse();
          }
        } else {
          if (isFusing) cancelFuse();
        }
      });

      camera.addEventListener('raycaster-intersection-cleared', function() {
        if (isFusing) cancelFuse();
      });

      // ===== УПРАВЛЕНИЕ ОТСЧЕТОМ =====
      function startFuse() {
        if (isFusing) return;
        isFusing = true;
        fuseTimer = fuseDuration;
        fuseCircle.style.display = 'flex';
        fuseText.textContent = Math.ceil(fuseTimer);
        updateFuseCircle(1);
      }

      function cancelFuse() {
        isFusing = false;
        fuseCircle.style.display = 'none';
        fuseTarget = null;
        fuseType = null;
        if (!carriedBlock) {
          info.textContent = '🎯 Наведись на блок 5 сек - взять, на пол 4 сек - телепорт';
          info.style.borderColor = 'rgba(255,255,255,0.3)';
        }
      }

      function updateFuseCircle(progress) {
        const angle = progress * 360;
        fuseCircle.style.background = `conic-gradient(#00ff44 ${angle}deg, rgba(0, 255, 68, 0.2) ${angle}deg 360deg)`;
      }

      // ===== ГЛАВНЫЙ ЦИКЛ =====
      let lastTime = Date.now();
      function updateLoop() {
        const now = Date.now();
        const delta = (now - lastTime) / 1000;
        lastTime = now;

        if (isFusing && fuseTarget) {
          fuseTimer -= delta;
          if (fuseTimer <= 0) {
            // Время вышло - действие!
            if (fuseType === 'block' && !carriedBlock) {
              pickUpBlock(fuseTarget);
            } else if (fuseType === 'floor') {
              const pos = fuseTarget.getAttribute('position');
              teleportTo(pos);
            }
            isFusing = false;
            fuseCircle.style.display = 'none';
            fuseTarget = null;
            fuseType = null;
          } else {
            const progress = fuseTimer / fuseDuration;
            updateFuseCircle(1 - progress);
            fuseText.textContent = Math.ceil(fuseTimer);
            info.textContent = `⏳ ${fuseType === 'block' ? 'Взятие блока' : 'Телепорт'}: ${Math.ceil(fuseTimer)}`;
          }
        }

        requestAnimationFrame(updateLoop);
      }
      updateLoop();

      // ===== КНОПКИ =====
      dropBtn.addEventListener('click', function(e) {
        e.preventDefault();
        dropBlock();
      });

      vrBtn.addEventListener('click', function(e) {
        e.preventDefault();
        // Вход в VR режим
        if (scene.is('vr-mode')) {
          scene.exitVR();
        } else {
          scene.enterVR();
        }
      });

      // Отслеживаем вход/выход из VR
      scene.addEventListener('enter-vr', function() {
        info.textContent = '🥽 VR режим! Смотри на блок 5 сек - взять';
        info.style.borderColor = '#4444ff';
        vrBtn.textContent = 'ВЫХОД\nИЗ VR';
      });

      scene.addEventListener('exit-vr', function() {
        info.textContent = '🎯 Наведись на блок 5 сек - взять, на пол 4 сек - телепорт';
        info.style.borderColor = 'rgba(255,255,255,0.3)';
        vrBtn.textContent = 'VR\nРЕЖИМ';
      });

      console.log('✅ VR игра готова!');
      console.log('📱 На телефоне: наведись на блок 5 сек - возьмешь, на пол 4 сек - телепорт');
      console.log('🥽 В VR шлеме: блок следует за тобой, кнопка БРОСИТЬ ставит его');
      console.log('🔵 Кнопка VR РЕЖИМ - вход в полноценный VR');
    })();
  </script>

</body>
      </html>

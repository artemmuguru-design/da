<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChugurAI — Neural Assistant</title>

<!-- Подключение Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #000000; color: #ffffff; padding: 20px; overflow-x: hidden; touch-action: manipulation;
  }
  .card {
    position: relative; width: 100%; max-width: 460px; background: #0a0a0a;
    border: 1px solid #222; border-radius: 24px; padding: 40px 30px 30px;
    text-align: center; box-shadow: 0 20px 60px rgba(255, 255, 255, 0.03);
  }
  
  /* Шапка профиля */
  .auth-header {
    position: absolute; top: 15px; right: 15px; display: flex; align-items: center; gap: 10px;
  }
  .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #444; }
  .user-name { font-size: 13px; color: #aaa; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logout-btn {
    background: transparent; border: 1px solid #444; color: #888; font-size: 11px;
    padding: 4px 8px; border-radius: 8px; cursor: pointer; transition: 0.2s;
  }
  .logout-btn:hover { border-color: #ff5555; color: #ff5555; }

  /* Контейнер для кнопки Google */
  #googleBtnContainer { display: flex; justify-content: center; margin-bottom: 20px; }

  h1 { font-size: 24px; font-weight: 700; letter-spacing: 6px; color: #ffffff; text-transform: uppercase; margin-bottom: 6px; }
  .subtitle { font-size: 12px; color: #888888; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 36px; font-weight: 500; }

  /* Робот */
  .robot { width: 110px; height: 110px; margin: 0 auto 30px; position: relative; pointer-events: none; }
  .antenna { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); width: 2px; height: 20px; background: #ffffff; }
  .antenna::after { content: ""; position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
  .head { width: 110px; height: 96px; margin-top: 12px; background: #111111; border: 2px solid #333333; border-radius: 20px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; padding-top: 24px; gap: 16px; position: relative; transition: border-color 0.3s, box-shadow 0.3s; }
  .eye { width: 14px; height: 14px; border-radius: 50%; background: #ffffff; transition: 0.3s; }
  .mouth { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 32px; height: 3px; border-radius: 2px; background: #ffffff; transition: 0.15s; opacity: 0.7; }
  .robot.talking .mouth { animation: talk 0.3s infinite alternate; opacity: 1; }
  @keyframes talk { from { height: 3px; width: 32px; } to { height: 12px; width: 20px; } }
  .robot.listening .head { border-color: #ffffff; box-shadow: 0 0 20px rgba(255, 255, 255, 0.1); }
  .robot.listening .eye { background: #888888; transform: scale(1.2); }

  /* Кнопка микрофона */
  .mic-btn { width: 80px; height: 80px; border-radius: 50%; border: 1.5px solid #444; cursor: pointer; background: transparent; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; transition: all 0.3s ease; position: relative; z-index: 10; -webkit-tap-highlight-color: transparent; }
  .mic-btn:hover { border-color: #ffffff; background: rgba(255, 255, 255, 0.03); }
  .mic-btn:active { transform: scale(0.95); }
  .mic-btn svg { width: 32px; height: 32px; fill: #ffffff; pointer-events: none; transition: fill 0.3s; }
  .mic-btn.active { background: #ffffff; border-color: #ffffff; animation: pulseMic 1.5s infinite; }
  .mic-btn.active svg { fill: #000000; }
  @keyframes pulseMic { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.3); } 70% { box-shadow: 0 0 0 20px rgba(255, 255, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } }

  /* Статус */
  .status { font-size: 13px; color: #888888; min-height: 20px; margin-bottom: 24px; font-weight: 500; letter-spacing: 0.5px; transition: 0.3s; }
  .status.error { color: #ff5555; }
  .status.thinking { color: #ffffff; animation: pulseText 1.5s infinite; }
  @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Пузыри */
  .bubble { background: #111111; border: 1px solid #222222; border-radius: 16px; padding: 16px 20px; font-size: 15px; line-height: 1.5; text-align: left; margin-bottom: 12px; min-height: 60px; color: #aaaaaa; word-break: break-word; position: relative; transition: 0.3s; }
  .bubble .label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #666666; margin-bottom: 8px; font-weight: 600; }
  .bubble.reply { border-color: #444444; background: #000000; color: #ffffff; }
  .bubble.reply .label { color: #ffffff; }

  /* Картинка */
  #imgContainer { display: none; margin-top: 12px; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
  #imgContainer img { width: 100%; height: auto; display: block; }

  /* Ввод */
  .text-input { width: 100%; margin-top: 20px; padding: 14px 20px; border-radius: 16px; border: 1px solid #333333; background: #000000; color: #ffffff; font-size: 15px; font-family: inherit; outline: none; transition: 0.3s; }
  .text-input:focus { border-color: #ffffff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.05); }
  .text-input::placeholder { color: #555555; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="card">
  <!-- Шапка профиля -->
  <div class="auth-header hidden" id="userProfile">
    <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
    <span id="userName" class="user-name"></span>
    <button class="logout-btn" id="logoutBtn">Выйти</button>
  </div>

  <h1>ChugurAI</h1>
  <p class="subtitle">Neural Assistant</p>

  <!-- Контейнер для кнопки Google (Экран входа) -->
  <div id="googleBtnContainer"></div>

  <!-- Основной интерфейс (скрыт до входа) -->
  <div id="mainApp" class="hidden">
    <div class="robot" id="robot">
      <div class="antenna"></div>
      <div class="head">
        <div class="eye"></div>
        <div class="eye"></div>
        <div class="mouth"></div>
      </div>
    </div>

    <button class="mic-btn" id="micBtn" type="button">
      <svg viewBox="0 0 24 24">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
        <path d="M19 12a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-2.06A9 9 0 0 0 21 12h-2z"/>
      </svg>
    </button>

    <div class="status" id="status">Нажмите на микрофон или напишите</div>

    <div class="bubble"><span class="label">Вы сказали</span><span id="heardText">—</span></div>
    
    <div class="bubble reply">
      <span class="label">ChugurAI</span>
      <span id="replyText">—</span>
      <div id="imgContainer"><img id="generatedImg" alt="Сгенерированное изображение"></div>
    </div>

    <input class="text-input" id="textInput" type="text" placeholder="Напиши или попроси нарисовать..." autocomplete="off">
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  
  // ============================================================
  // 1. АВТОРИЗАЦИЯ GOOGLE
  // ============================================================
  var googleBtnContainer = document.getElementById('googleBtnContainer');
  var userProfile = document.getElementById('userProfile');
  var userAvatar = document.getElementById('userAvatar');
  var userName = document.getElementById('userName');
  var logoutBtn = document.getElementById('logoutBtn');
  var mainApp = document.getElementById('mainApp');

  // Твой Client ID
  var GOOGLE_CLIENT_ID = "863049198588-ih96igl85cfvn8jtbg7rntispkn1m0m2.apps.googleusercontent.com";

  function signOut() {
    localStorage.removeItem('chugur_user');
    userProfile.classList.add('hidden');
    mainApp.classList.add('hidden');
    googleBtnContainer.classList.remove('hidden');
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.disableAutoSelect();
    }
  }

  logoutBtn.addEventListener('click', signOut);

  // Проверка сохраненного пользователя
  var savedUser = localStorage.getItem('chugur_user');
  if (savedUser) {
    try {
      var user = JSON.parse(savedUser);
      userAvatar.src = user.picture;
      userName.textContent = user.name;
      userProfile.classList.remove('hidden');
      mainApp.classList.remove('hidden');
      googleBtnContainer.classList.add('hidden');
    } catch(e) {
      localStorage.removeItem('chugur_user');
    }
  }

  // Обработка ответа от Google
  window.handleCredentialResponse = function(response) {
    var base64Url = response.credential.split('.')[1];
    var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    
    var user = JSON.parse(jsonPayload);
    
    localStorage.setItem('chugur_user', JSON.stringify({
      name: user.name,
      email: user.email,
      picture: user.picture
    }));

    userAvatar.src = user.picture;
    userName.textContent = user.name;
    userProfile.classList.remove('hidden');
    mainApp.classList.remove('hidden');
    googleBtnContainer.classList.add('hidden');
  };

  // Инициализация кнопки Google
  function initGoogleSignIn() {
    if (typeof google !== 'undefined' && google.accounts) {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: window.handleCredentialResponse
      });
      google.accounts.id.renderButton(
        googleBtnContainer,
        { theme: "outline", size: "large", text: "signin_with", shape: "pill" }
      );
    } else {
      setTimeout(initGoogleSignIn, 100);
    }
  }

  if (!savedUser) {
    initGoogleSignIn();
  }

  // ============================================================
  // 2. ЛОГИКА ИИ (ЧАТ И КАРТИНКИ)
  // ============================================================
  var micBtn = document.getElementById('micBtn');
  var robot = document.getElementById('robot');
  var statusEl = document.getElementById('status');
  var heardText = document.getElementById('heardText');
  var replyText = document.getElementById('replyText');
  var textInput = document.getElementById('textInput');
  var imgContainer = document.getElementById('imgContainer');
  var generatedImg = document.getElementById('generatedImg');

  var THINKING_DELAY_SEC = 20; 
  var COOLDOWN_SEC = 46;       
  var cooldownEndTime = 0;
  var cooldownTimer = null;
  var isRateLimited = false;
  var isListening = false;

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;

  // --- МИКРОФОН ---
  if (SR) {
    try {
      recognition = new SR();
      recognition.lang = 'ru-RU';
      recognition.interimResults = false;
      recognition.continuous = false;

      recognition.onstart = function() {
        isListening = true;
        micBtn.classList.add('active');
        robot.classList.add('listening');
        statusEl.textContent = '🎤 Слушаю…';
        statusEl.classList.remove('error', 'thinking');
      };

      recognition.onresult = function(event) {
        var text = event.results[0][0].transcript;
        if (Date.now() < cooldownEndTime) return showCooldownError();
        handleUserText(text);
      };

      recognition.onerror = function(event) {
        if (event.error !== 'no-speech' && event.error !== 'aborted') {
          statusEl.textContent = event.error === 'not-allowed' ? '❌ Нет доступа к микрофону.' : '⚠️ Ошибка: ' + event.error;
          statusEl.classList.add('error');
        }
      };

      recognition.onend = function() {
        isListening = false;
        micBtn.classList.remove('active');
        robot.classList.remove('listening');
        if (!isRateLimited && statusEl.className.indexOf('thinking') === -1) {
          statusEl.textContent = 'Нажмите на микрофон';
        }
      };
    } catch(e) {}
  }

  micBtn.addEventListener('click', function(e) {
    e.preventDefault();
    if (!recognition) {
      statusEl.textContent = '⚠️ Микрофон не поддерживается.';
      statusEl.classList.add('error');
      return;
    }
    if (Date.now() < cooldownEndTime) return showCooldownError();
    if (window.speechSynthesis) speechSynthesis.cancel();
    
    if (isListening) {
      try { recognition.stop(); } catch(e) {}
      return;
    }
    try { recognition.start(); } catch (err) {}
  });

  // --- ОЗВУЧКА ---
  var bestRuVoice = null;
  function loadVoices() {
    try {
      if (!('speechSynthesis' in window)) return;
      var availableVoices = speechSynthesis.getVoices();
      var ruVoices = availableVoices.filter(function(v) { return v.lang && v.lang.indexOf('ru') !== -1; });
      if (ruVoices.length > 0) {
        bestRuVoice = ruVoices[0];
        for (var i = 0; i < ruVoices.length; i++) {
          if (/(google|premium|natural|online|dmitry|yuri)/i.test(ruVoices[i].name)) {
            bestRuVoice = ruVoices[i]; break;
          }
        }
      } else { bestRuVoice = availableVoices[0]; }
    } catch(e) {}
  }
  loadVoices();
  if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = loadVoices;

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var cleanText = text.replace(/\*\*/g, '').replace(/\*/g, '').replace(/#/g, '');
    var utter = new SpeechSynthesisUtterance(cleanText);
    utter.lang = 'ru-RU'; 
    utter.rate = 1.0; 
    if (bestRuVoice) utter.voice = bestRuVoice;
    utter.onstart = function() { robot.classList.add('talking'); };
    utter.onend = function() { robot.classList.remove('talking'); };
    speechSynthesis.speak(utter);
  }

  // --- ТАЙМЕРЫ ---
  function showCooldownError() {
    isRateLimited = true;
    if (cooldownTimer) clearInterval(cooldownTimer);
    var update = function() {
      var left = Math.ceil((cooldownEndTime - Date.now()) / 1000);
      if (left > 0) {
        statusEl.classList.add('error');
        statusEl.classList.remove('thinking');
        statusEl.textContent = 'Слишком быстро! Ждем: ' + left + 'с';
      } else {
        clearInterval(cooldownTimer);
        cooldownTimer = null;
        statusEl.classList.remove('error');
        isRateLimited = false;
        statusEl.textContent = 'Готов помочь';
      }
    };
    update(); cooldownTimer = setInterval(update, 1000);
  }

  function startCooldown() {
    cooldownEndTime = Date.now() + (COOLDOWN_SEC * 1000);
    if (cooldownTimer) clearInterval(cooldownTimer);
  }

  // --- ЗАПРОС К НЕЙРОСЕТИ ---
  function fetchText(input, isForImagePrompt) {
    var systemPrompt = "Ты — ChugurAI, дружелюбный ассистент. Отвечай кратко. В начале ответа используй: «Да, сэр», «Конечно, сэр» или «Разумеется, сэр».";
    
    if (isForImagePrompt) {
       systemPrompt = "You are an AI image prompt engineer. Translate the user's image request into a highly detailed, accurate English prompt for an image generator (like Midjourney). Reply ONLY with the English prompt, no conversational text, no quotes. Description: " + input;
    }
    
    return fetch('https://keylessai.thryx.workers.dev/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'gpt-4o',
        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: input }]
      })
    })
    .then(function(res) {
      if (res.status === 429) throw new Error('RATE_LIMIT');
      if (!res.ok) throw new Error('API_ERROR');
      return res.json();
    })
    .then(function(data) {
      return data.choices[0].message.content.trim().replace(/\*\*/g, '');
    })
    .catch(function(err) {
      var fallbackUrl = 'https://text.pollinations.ai/' + encodeURIComponent(input) + '?model=openai&system=' + encodeURIComponent(systemPrompt);
      return fetch(fallbackUrl)
        .then(function(res) { return res.text(); })
        .then(function(text) {
          if (text.toLowerCase().indexOf('limit') !== -1 && text.toLowerCase().indexOf('seconds') !== -1) {
            throw new Error('RATE_LIMIT');
          }
          return text.replace(/\*\*/g, '').replace(/\*/g, '');
        });
    });
  }

  // --- ОБРАБОТКА ТЕКСТА И ГЕНЕРАЦИЯ ---
  function handleUserText(rawText) {
    var text = rawText.trim();
    if (!text) return;
    
    heardText.textContent = text;
    replyText.textContent = '…';
    imgContainer.style.display = 'none'; 
    generatedImg.src = ''; 
    
    startCooldown();

    // Умное распознавание картинок
    var strictImageVerbs = /(нарисуй|сгенерируй|изобрази|отрисуй|визуализируй|начерти|draw|generate|paint)/i;
    var softImageVerbs = /(создай|сделай|покажи|хочу|дай|можешь)/i;
    var imageNouns = /(картинк|картин|изображени|фот|фотографи|рисун|арт|иллюстраци|пейзаж|портрет|график|image|picture|photo|art)/i;

    var isImageRequest = strictImageVerbs.test(text) || (softImageVerbs.test(text) && imageNouns.test(text));

    var prompt = text;
    if (isImageRequest) {
      prompt = prompt.replace(/нарисуй|сгенерируй|создай|сделай|покажи|изобрази|отрисуй|визуализируй|начерти|мне|пожалуйста|картинку|картину|изображение|фото|фотографию|рисунок|арт|иллюстрацию|графику|пейзаж|портрет/gi, '').trim();
      if (!prompt) prompt = "красивый футуристичный пейзаж";
    }

    var visualTime = THINKING_DELAY_SEC;
    statusEl.classList.remove('error');
    statusEl.classList.add('thinking');
    statusEl.textContent = isImageRequest ? 'Анализирую запрос... (' + visualTime + 'с)' : 'Анализирую... (' + visualTime + 'с)';

    var visualTimer = setInterval(function() {
      visualTime--;
      if (visualTime > 0) {
        statusEl.textContent = (isImageRequest ? 'Анализирую запрос... (' : 'Анализирую... (') + visualTime + 'с)';
      } else {
        statusEl.textContent = isImageRequest ? 'Рисую...' : 'Получаю ответ...';
        clearInterval(visualTimer);
      }
    }, 1000);

    var apiRequest = null;

    if (isImageRequest) {
      apiRequest = new Promise(function(resolve, reject) {
        fetchText(prompt, true).then(function(englishPrompt) {
          var cleanEnglishPrompt = englishPrompt.replace(/["']/g, '').trim();
          var imgUrl = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(cleanEnglishPrompt) + '?width=512&height=512&nologo=true&model=flux';
          
          generatedImg.onload = function() { resolve({ success: true, url: imgUrl, prompt: prompt }); };
          generatedImg.onerror = function() { reject(new Error('IMAGE_ERROR')); };
          generatedImg.src = imgUrl;
        }).catch(reject);
      });
    } else {
      apiRequest = fetchText(text, false);
    }

    // Ждем и ответ от сервера, и окончание 20 секунд
    var minWait = new Promise(function(resolve) { setTimeout(resolve, THINKING_DELAY_SEC * 1000); });

    Promise.all([apiRequest, minWait]).then(function(results) {
      var result = results[0];
      clearInterval(visualTimer);

      if (isImageRequest) {
        if (result.success) {
          statusEl.classList.remove('thinking');
          statusEl.textContent = 'Готово!';
          replyText.textContent = 'Да, сэр. Вот ваша картинка по запросу: "' + result.prompt + '"';
          imgContainer.style.display = 'block'; 
          speak('Да, сэр. Вот ваша картинка.');
        } else {
          statusEl.textContent = 'Ошибка';
          replyText.textContent = 'Извините, сэр, не удалось нарисовать.';
        }
      } else {
        replyText.textContent = result;
        statusEl.cl

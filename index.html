<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Камера</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        #container { width: 100%; height: 100vh; position: relative; }
        video { display: none; }
        #vr-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; font-size: 18px; background: #4CAF50; color: white;
            border: none; border-radius: 25px; cursor: pointer; z-index: 999;
            font-family: Arial, sans-serif;
        }
        #status {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            color: white; font-family: Arial, sans-serif; z-index: 999;
            background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 20px;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="status">Загрузка...</div>
    <button id="vr-btn" style="display:none;">🥽 Войти в VR</button>
    
    <video id="video" autoplay playsinline muted loop></video>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <script>
        const video = document.getElementById('video');
        const container = document.getElementById('container');
        const statusDiv = document.getElementById('status');
        const vrBtn = document.getElementById('vr-btn');
        
        // Создаем сцену сразу, но сферу добавим после загрузки видео
        let scene, sphere;
        
        function initScene() {
            scene = document.createElement('a-scene');
            scene.setAttribute('embedded', '');
            scene.setAttribute('vr-mode-ui', 'enabled: true');
            scene.style.width = '100%';
            scene.style.height = '100%';
            scene.style.position = 'absolute';
            scene.style.top = '0';
            scene.style.left = '0';
            container.appendChild(scene);
            
            // Добавляем белый фон вместо черного на время загрузки
            const sky = document.createElement('a-sky');
            sky.setAttribute('color', '#333333');
            sky.setAttribute('id', 'background-sky');
            scene.appendChild(sky);
            
            // Камера
            const camera = document.createElement('a-entity');
            camera.setAttribute('camera', 'fov: 80; near: 0.1; far: 1000');
            camera.setAttribute('position', '0 0 0');
            camera.setAttribute('look-controls', '');
            scene.appendChild(camera);
            
            // Свет
            const light = document.createElement('a-entity');
            light.setAttribute('light', 'type: ambient; color: #FFF; intensity: 1');
            scene.appendChild(light);
        }
        
        // Инициализируем сцену сразу
        initScene();
        
        // Запускаем камеру
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: 'environment', 
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                frameRate: { ideal: 30 }
            } 
        }).then(stream => {
            video.srcObject = stream;
            
            video.onloadedmetadata = () => {
                video.play();
                statusDiv.textContent = 'Видео загружено';
                
                // Ждем первый кадр видео
                video.addEventListener('playing', () => {
                    statusDiv.textContent = 'Готово';
                    statusDiv.style.display = 'none';
                    vrBtn.style.display = 'block';
                    
                    // Удаляем старый фон
                    const oldSky = document.getElementById('background-sky');
                    if (oldSky) oldSky.remove();
                    
                    // Создаем сферу с видео
                    createVideoSphere();
                }, { once: true });
            };
        }).catch(err => {
            statusDiv.textContent = 'Ошибка: ' + err.message;
            console.error('Ошибка камеры:', err);
        });

        function createVideoSphere() {
            // Создаем canvas для предварительного рендеринга
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Рисуем первый кадр видео на canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Создаем текстуру из canvas
            const texture = canvas.toDataURL('image/jpeg', 0.8);
            
            sphere = document.createElement('a-sphere');
            sphere.setAttribute('radius', '500');
            sphere.setAttribute('segments-width', '64');
            sphere.setAttribute('segments-height', '64');
            sphere.setAttribute('material', {
                shader: 'flat',
                src: '#video',
                side: 'back',
                transparent: false
            });
            sphere.setAttribute('scale', '-1 1 1');
            sphere.setAttribute('id', 'video-sphere');
            scene.appendChild(sphere);
            
            // Добавляем черный фон для периферии
            const sky = document.createElement('a-sky');
            sky.setAttribute('color', '#000000');
            sky.setAttribute('radius', '1000');
            scene.appendChild(sky);
        }

        document.getElementById('vr-btn').onclick = function() {
            const sceneElement = document.querySelector('a-scene');
            if (sceneElement && sceneElement.renderer) {
                sceneElement.enterVR();
            }
        };
        
        // Обработка ошибок видео
        video.addEventListener('error', (e) => {
            statusDiv.textContent = 'Ошибка видео';
            console.error('Ошибка видео:', e);
        });
        
        // Автоматически перезапускаем видео если оно остановилось
        video.addEventListener('pause', () => {
            if (video.srcObject) {
                video.play().catch(() => {});
            }
        });
    </script>
</body>
</html>

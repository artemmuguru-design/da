<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChugurAI — Auth</title>
<!-- 1. Подключаем библиотеку Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #000000; color: #ffffff; padding: 20px; overflow-x: hidden; touch-action: manipulation;
  }
  .card {
    position: relative; width: 100%; max-width: 460px; background: #0a0a0a;
    border: 1px solid #222; border-radius: 24px; padding: 40px 30px 30px;
    text-align: center; box-shadow: 0 20px 60px rgba(255, 255, 255, 0.03);
  }
  
  /* Шапка с профилем */
  .auth-header {
    position: absolute; top: 15px; right: 15px; display: flex; align-items: center; gap: 10px;
  }
  .user-avatar {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid #444;
  }
  .user-name { font-size: 13px; color: #aaa; }
  .logout-btn {
    background: transparent; border: 1px solid #444; color: #888; font-size: 11px;
    padding: 4px 8px; border-radius: 8px; cursor: pointer; transition: 0.2s;
  }
  .logout-btn:hover { border-color: #ff5555; color: #ff5555; }

  /* Контейнер для кнопки Google */
  #googleBtnContainer { display: flex; justify-content: center; margin-bottom: 20px; }

  h1 { font-size: 24px; font-weight: 700; letter-spacing: 6px; color: #ffffff; text-transform: uppercase; margin-bottom: 6px; }
  .subtitle { font-size: 12px; color: #888888; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 36px; font-weight: 500; }

  /* Робот */
  .robot { width: 110px; height: 110px; margin: 0 auto 30px; position: relative; pointer-events: none; }
  .antenna { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); width: 2px; height: 20px; background: #ffffff; }
  .antenna::after { content: ""; position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
  .head { width: 110px; height: 96px; margin-top: 12px; background: #111111; border: 2px solid #333333; border-radius: 20px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; padding-top: 24px; gap: 16px; position: relative; transition: border-color 0.3s, box-shadow 0.3s; }
  .eye { width: 14px; height: 14px; border-radius: 50%; background: #ffffff; transition: 0.3s; }
  .mouth { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 32px; height: 3px; border-radius: 2px; background: #ffffff; transition: 0.15s; opacity: 0.7; }
  .robot.talking .mouth { animation: talk 0.3s infinite alternate; opacity: 1; }
  @keyframes talk { from { height: 3px; width: 32px; } to { height: 12px; width: 20px; } }
  .robot.listening .head { border-color: #ffffff; box-shadow: 0 0 20px rgba(255, 255, 255, 0.1); }
  .robot.listening .eye { background: #888888; transform: scale(1.2); }

  /* Кнопка */
  .mic-btn { width: 80px; height: 80px; border-radius: 50%; border: 1.5px solid #444; cursor: pointer; background: transparent; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; transition: all 0.3s ease; position: relative; z-index: 10; -webkit-tap-highlight-color: transparent; }
  .mic-btn:hover { border-color: #ffffff; background: rgba(255, 255, 255, 0.03); }
  .mic-btn:active { transform: scale(0.95); }
  .mic-btn svg { width: 32px; height: 32px; fill: #ffffff; pointer-events: none; transition: fill 0.3s; }
  .mic-btn.active { background: #ffffff; border-color: #ffffff; animation: pulseMic 1.5s infinite; }
  .mic-btn.active svg { fill: #000000; }
  @keyframes pulseMic { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.3); } 70% { box-shadow: 0 0 0 20px rgba(255, 255, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } }

  /* Статус */
  .status { font-size: 13px; color: #888888; min-height: 20px; margin-bottom: 24px; font-weight: 500; letter-spacing: 0.5px; transition: 0.3s; }
  .status.error { color: #ff5555; }
  .status.thinking { color: #ffffff; animation: pulseText 1.5s infinite; }
  @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Пузыри */
  .bubble { background: #111111; border: 1px solid #222222; border-radius: 16px; padding: 16px 20px; font-size: 15px; line-height: 1.5; text-align: left; margin-bottom: 12px; min-height: 60px; color: #aaaaaa; word-break: break-word; position: relative; transition: 0.3s; }
  .bubble .label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #666666; margin-bottom: 8px; font-weight: 600; }
  .bubble.reply { border-color: #444444; background: #000000; color: #ffffff; }
  .bubble.reply .label { color: #ffffff; }

  #imgContainer { display: none; margin-top: 12px; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
  #imgContainer img { width: 100%; height: auto; display: block; }

  /* Ввод */
  .text-input { width: 100%; margin-top: 20px; padding: 14px 20px; border-radius: 16px; border: 1px solid #333333; background: #000000; color: #ffffff; font-size: 15px; font-family: inherit; outline: none; transition: 0.3s; }
  .text-input:focus { border-color: #ffffff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.05); }
  .text-input::placeholder { color: #555555; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="card">
  <!-- Шапка профиля (появляется после входа) -->
  <div class="auth-header hidden" id="userProfile">
    <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
    <span id="userName" class="user-name"></span>
    <button class="logout-btn" id="logoutBtn">Выйти</button>
  </div>

  <h1>ChugurAI</h1>
  <p class="subtitle">Neural Assistant</p>

  <!-- Контейнер для кнопки Google -->
  <div id="googleBtnContainer"></div>

  <!-- Основной интерфейс (скрыт до входа) -->
  <div id="mainApp" class="hidden">
    <div class="robot" id="robot">
      <div class="antenna"></div>
      <div class="head">
        <div class="eye"></div>
        <div class="eye"></div>
        <div class="mouth"></div>
      </div>
    </div>

    <button class="mic-btn" id="micBtn" type="button">
      <svg viewBox="0 0 24 24">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
        <path d="M19 12a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-2.06A9 9 0 0 0 21 12h-2z"/>
      </svg>
    </button>

    <div class="status" id="status">Нажмите на микрофон или напишите</div>

    <div class="bubble"><span class="label">Вы сказали</span><span id="heardText">—</span></div>
    
    <div class="bubble reply">
      <span class="label">ChugurAI</span>
      <span id="replyText">—</span>
      <div id="imgContainer"><img id="generatedImg" alt="Сгенерированное изображение"></div>
    </div>

    <input class="text-input" id="textInput" type="text" placeholder="Напиши или попроси нарисовать..." autocomplete="off">
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // --- ЭЛЕМЕНТЫ АВТОРИЗАЦИИ ---
  var googleBtnContainer = document.getElementById('googleBtnContainer');
  var userProfile = document.getElementById('userProfile');
  var userAvatar = document.getElementById('userAvatar');
  var userName = document.getElementById('userName');
  var logoutBtn = document.getElementById('logoutBtn');
  var mainApp = document.getElementById('mainApp');

  // --- ФУНКЦИЯ ВЫХОДА ---
  function signOut() {
    localStorage.removeItem('chugur_user');
    userProfile.classList.add('hidden');
    mainApp.classList.add('hidden');
    googleBtnContainer.classList.remove('hidden');
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.disableAutoSelect();
    }
  }

  logoutBtn.addEventListener('click', signOut);

  // --- ПРОВЕРКА СОХРАНЕННОГО ПОЛЬЗОВАТЕЛЯ ---
  var savedUser = localStorage.getItem('chugur_user');
  if (savedUser) {
    try {
      var user = JSON.parse(savedUser);
      userAvatar.src = user.picture;
      userName.textContent = user.name;
      userProfile.classList.remove('hidden');
      mainApp.classList.remove('hidden');
      googleBtnContainer.classList.add('hidden');
    } catch(e) {
      localStorage.removeItem('chugur_user');
    }
  }

  // --- ИНИЦИАЛИЗАЦИЯ GOOGLE SIGN-IN ---
  window.handleCredentialResponse = function(response) {
    // Декодируем JWT токен, чтобы получить данные пользователя
    var base64Url = response.credential.split('.')[1];
    var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    
    var user = JSON.parse(jsonPayload);
    
    // Сохраняем данные
    localStorage.setItem('chugur_user', JSON.stringify({
      name: user.name,
      email: user.email,
      picture: user.picture
    }));

    // Обновляем интерфейс
    userAvatar.src = user.picture;
    userName.textContent = user.name;
    userProfile.classList.remove('hidden');
    mainApp.classList.remove('hidden');
    googleBtnContainer.classList.add('hidden');
  };

  // Инициализация кнопки Google (вызывается после загрузки скрипта)
  function initGoogleSignIn() {
    if (typeof google !== 'undefined' && google.accounts) {
      google.accounts.id.initialize({
        client_id: "YOUR_GOOGLE_CLIENT_ID", // <-- ЗАМЕНИ НА СВОЙ ID
        callback: window.handleCredentialResponse
      });
      google.accounts.id.renderButton(
        googleBtnContainer,
        { theme: "outline", size: "large", text: "signin_with", shape: "pill" }
      );
    } else {
      setTimeout(initGoogleSignIn, 100);
    }
  }

  // Запускаем инициализацию только если пользователь не авторизован
  if (!savedUser) {
    initGoogleSignIn();
  }

  // ============================================================
  // ДАЛЬШЕ ИДЕТ ВЕСЬ ТВОЙ СТАРЫЙ КОД (ЛОГИКА ИИ, МИКРОФОН, Т.Д.)
  // ============================================================
  // ... (вставь сюда все переменные и функции для работы с ИИ)
});
</script>
</body>
</html>

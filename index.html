<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ в пиксельном мире 🌍🤖</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        .game-container {
            background: #1e2a3a;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        canvas {
            background: #2d4a2d;
            border-radius: 12px;
            box-shadow: inset 0 0 20px #1a301a, 0 8px 16px rgba(0,0,0,0.5);
            display: block;
            image-rendering: pixelated;
        }
        .panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: #1a2535;
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .time-buttons {
            display: flex;
            gap: 8px;
        }
        button {
            background: #3a5f7a;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.15s;
            letter-spacing: 1px;
            box-shadow: 0 3px 0 #1e3a4d;
            border: 1px solid #5a8faa;
        }
        button:hover {
            background: #4a7f9a;
            transform: translateY(-1px);
            box-shadow: 0 4px 0 #1e3a4d;
        }
        button.active {
            background: #e6b800;
            color: #1a1a2e;
            border-color: #ffd966;
            box-shadow: 0 0 12px #ffd966;
        }
        .stats {
            display: flex;
            gap: 15px;
            color: #d9eef7;
            font-weight: 600;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        .stat-item {
            background: #152030;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .info-panel {
            color: #aaccdd;
            font-size: 0.8rem;
            text-align: center;
            max-width: 400px;
        }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div class="panel">
        <div class="time-buttons">
            <button id="speed1x" class="active">1x</button>
            <button id="speed10x">10x</button>
            <button id="speed100x">100x</button>
            <button id="speed1000x">1000x</button>
        </div>
        <div class="stats">
            <div class="stat-item">🤖 <span id="aiStatus">Изучает мир...</span></div>
            <div class="stat-item">📦 <span id="foodCounter">0</span> еды</div>
            <div class="stat-item">👣 <span id="stepCounter">0</span> шагов</div>
            <div class="stat-item">🔄 <span id="generationCounter">0</span> поколение</div>
        </div>
    </div>
    <div class="info-panel">
        🎯 Цель: собирать еду 🍎 и не умереть с голоду. ИИ начинает с нулевыми знаниями!
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // === НАСТРОЙКИ МИРА ===
        const GRID_SIZE = 20; // размер клетки в пикселях
        const WORLD_WIDTH = 25; // ширина мира в клетках
        const WORLD_HEIGHT = 25; // высота мира в клетках
        const TILE_SIZE = 20;
        
        // === ТИПЫ ТАЙЛОВ ===
        const TILE = {
            EMPTY: 0,
            WALL: 1,
            FOOD: 2,
        };
        
        // === МИР ===
        let world = [];
        let foodLocations = [];
        
        // === ПАРАМЕТРЫ ИИ ===
        const POPULATION_SIZE = 30;
        const MUTATION_RATE = 0.2;
        const MUTATION_PROBABILITY = 0.3;
        const MAX_STEPS = 200; // максимум шагов для одного ИИ
        
        // === ПОПУЛЯЦИЯ ===
        let population = [];
        let generation = 0;
        let bestScore = 0;
        let bestBrain = null;
        
        // === УПРАВЛЕНИЕ ===
        let speedMultiplier = 1;
        let frameCount = 0;
        
        // === КЛАСС ИИ-ЧЕЛОВЕЧКА ===
        class AIPerson {
            constructor(brain = null) {
                // Начальная позиция (в центре)
                this.x = Math.floor(WORLD_WIDTH / 2);
                this.y = Math.floor(WORLD_HEIGHT / 2);
                this.alive = true;
                this.fitness = 0;
                this.foodEaten = 0;
                this.steps = 0;
                this.energy = 100; // энергия (уменьшается с каждым шагом)
                this.direction = 0; // 0-3: вверх, вправо, вниз, влево
                this.vision = []; // что видит вокруг
                this.memory = []; // память о прошлых действиях
                
                if (brain) {
                    this.brain = {
                        weights: [...brain.weights],
                        bias: brain.bias
                    };
                } else {
                    this.brain = this.createRandomBrain();
                }
            }
            
            createRandomBrain() {
                return {
                    weights: [
                        Math.random() * 4 - 2, // вес для еды впереди
                        Math.random() * 4 - 2, // вес для еды слева
                        Math.random() * 4 - 2, // вес для еды справа
                        Math.random() * 4 - 2, // вес для стены впереди
                        Math.random() * 4 - 2, // вес для стены слева
                        Math.random() * 4 - 2, // вес для стены справа
                        Math.random() * 4 - 2, // вес для энергии
                        Math.random() * 4 - 2, // вес для случайности
                    ],
                    bias: Math.random() * 2 - 1
                };
            }
            
            // Получение информации о мире вокруг
            getVision() {
                const directions = [
                    {dx: 0, dy: -1}, // вверх
                    {dx: 1, dy: 0},  // вправо
                    {dx: 0, dy: 1},  // вниз
                    {dx: -1, dy: 0}, // влево
                ];
                
                this.vision = [];
                for (let i = 0; i < directions.length; i++) {
                    const nx = this.x + directions[i].dx;
                    const ny = this.y + directions[i].dy;
                    
                    if (nx < 0 || nx >= WORLD_WIDTH || ny < 0 || ny >= WORLD_HEIGHT) {
                        this.vision.push({type: 'wall', food: false});
                    } else {
                        this.vision.push({
                            type: world[ny][nx] === TILE.WALL ? 'wall' : 'empty',
                            food: world[ny][nx] === TILE.FOOD,
                        });
                    }
                }
                
                // Добавляем информацию о ближайшей еде (если есть)
                const nearestFood = this.findNearestFood();
                if (nearestFood) {
                    this.vision.push({type: 'food_direction', x: nearestFood.x, y: nearestFood.y});
                }
            }
            
            findNearestFood() {
                let minDist = Infinity;
                let nearest = null;
                
                for (let food of foodLocations) {
                    const dist = Math.abs(food.x - this.x) + Math.abs(food.y - this.y);
                    if (dist < minDist) {
                        minDist = dist;
                        nearest = food;
                    }
                }
                
                return nearest;
            }
            
            // Принятие решения
            decide() {
                this.getVision();
                
                // Подготовка входных данных для нейросети
                const inputs = [];
                
                // Информация о клетках вокруг (в порядке: вверх, вправо, вниз, влево)
                for (let i = 0; i < 4; i++) {
                    inputs.push(this.vision[i].food ? 1 : 0);
                    inputs.push(this.vision[i].type === 'wall' ? 1 : 0);
                }
                
                // Энергия
                inputs.push(this.energy / 100);
                
                // Направление к ближайшей еде (если есть)
                const foodDir = this.vision.find(v => v.type === 'food_direction');
                if (foodDir) {
                    const dx = foodDir.x - this.x;
                    const dy = foodDir.y - this.y;
                    inputs.push(Math.tanh(dx));
                    inputs.push(Math.tanh(dy));
                } else {
                    inputs.push(0);
                    inputs.push(0);
                }
                
                // Случайный вход для разнообразия
                inputs.push(Math.random() * 2 - 1);
                
                // Нейросеть принимает решение
                let sum = this.brain.bias;
                for (let i = 0; i < inputs.length; i++) {
                    sum += this.brain.weights[i] * inputs[i];
                }
                
                const activation = Math.tanh(sum);
                
                // Преобразуем в направление (0-3)
                if (activation < -0.5) return 0; // вверх
                if (activation < 0) return 1;    // вправо
                if (activation < 0.5) return 2;  // вниз
                return 3;                        // влево
            }
            
            // Шаг ИИ
            step() {
                if (!this.alive) return;
                
                this.steps++;
                this.energy -= 0.5; // тратим энергию
                
                if (this.energy <= 0) {
                    this.alive = false;
                    return;
                }
                
                if (this.steps > MAX_STEPS) {
                    this.alive = false;
                    return;
                }
                
                const direction = this.decide();
                this.direction = direction;
                
                const directions = [
                    {dx: 0, dy: -1}, // вверх
                    {dx: 1, dy: 0},  // вправо
                    {dx: 0, dy: 1},  // вниз
                    {dx: -1, dy: 0}, // влево
                ];
                
                const newX = this.x + directions[direction].dx;
                const newY = this.y + directions[direction].dy;
                
                // Проверка границ и стен
                if (newX >= 0 && newX < WORLD_WIDTH && 
                    newY >= 0 && newY < WORLD_HEIGHT &&
                    world[newY][newX] !== TILE.WALL) {
                    
                    this.x = newX;
                    this.y = newY;
                    
                    // Проверка на еду
                    if (world[newY][newX] === TILE.FOOD) {
                        this.eatFood(newX, newY);
                    }
                }
                
                // Обновляем фитнес
                this.fitness = this.foodEaten * 100 + this.steps;
            }
            
            eatFood(x, y) {
                this.foodEaten++;
                this.energy = Math.min(100, this.energy + 30);
                world[y][x] = TILE.EMPTY;
                
                // Удаляем еду из списка
                foodLocations = foodLocations.filter(f => !(f.x === x && f.y === y));
                
                // Создаем новую еду в случайном месте
                spawnFood();
            }
            
            // Мутация
            mutate() {
                for (let i = 0; i < this.brain.weights.length; i++) {
                    if (Math.random() < MUTATION_PROBABILITY) {
                        this.brain.weights[i] += (Math.random() - 0.5) * MUTATION_RATE;
                        this.brain.weights[i] = Math.max(-4, Math.min(4, this.brain.weights[i]));
                    }
                }
                if (Math.random() < MUTATION_PROBABILITY) {
                    this.brain.bias += (Math.random() - 0.5) * MUTATION_RATE;
                    this.brain.bias = Math.max(-2, Math.min(2, this.brain.bias));
                }
            }
        }
        
        // === ФУНКЦИИ МИРА ===
        function createWorld() {
            world = [];
            foodLocations = [];
            
            // Создаем пустой мир
            for (let y = 0; y < WORLD_HEIGHT; y++) {
                world[y] = [];
                for (let x = 0; x < WORLD_WIDTH; x++) {
                    world[y][x] = TILE.EMPTY;
                }
            }
            
            // Добавляем стены по краям
            for (let x = 0; x < WORLD_WIDTH; x++) {
                world[0][x] = TILE.WALL;
                world[WORLD_HEIGHT - 1][x] = TILE.WALL;
            }
            for (let y = 0; y < WORLD_HEIGHT; y++) {
                world[y][0] = TILE.WALL;
                world[y][WORLD_WIDTH - 1] = TILE.WALL;
            }
            
            // Добавляем несколько препятствий
            for (let i = 0; i < 8; i++) {
                const wx = Math.floor(Math.random() * (WORLD_WIDTH - 4)) + 2;
                const wy = Math.floor(Math.random() * (WORLD_HEIGHT - 4)) + 2;
                world[wy][wx] = TILE.WALL;
            }
            
            // Создаем начальную еду
            for (let i = 0; i < 15; i++) {
                spawnFood();
            }
        }
        
        function spawnFood() {
            let attempts = 0;
            while (attempts < 100) {
                const x = Math.floor(Math.random() * (WORLD_WIDTH - 2)) + 1;
                const y = Math.floor(Math.random() * (WORLD_HEIGHT - 2)) + 1;
                
                if (world[y][x] === TILE.EMPTY) {
                    world[y][x] = TILE.FOOD;
                    foodLocations.push({x, y});
                    return;
                }
                attempts++;
            }
        }
        
        // === ГЕНЕТИЧЕСКИЙ АЛГОРИТМ ===
        function createInitialPopulation() {
            population = [];
            for (let i = 0; i < POPULATION_SIZE; i++) {
                population.push(new AIPerson());
            }
        }
        
        function evolvePopulation() {
            // Сортируем по фитнесу
            population.sort((a, b) => b.fitness - a.fitness);
            
            // Обновляем лучший результат
            if (population[0].fitness > bestScore) {
                bestScore = population[0].fitness;
                bestBrain = {
                    weights: [...population[0].brain.weights],
                    bias: population[0].brain.bias
                };
            }
            
            // Создаем новое поколение
            const newPopulation = [];
            
            // Элитизм: сохраняем 20% лучших
            const eliteCount = Math.floor(POPULATION_SIZE * 0.2);
            for (let i = 0; i < eliteCount; i++) {
                newPopulation.push(new AIPerson(population[i].brain));
            }
            
            // Создаем потомков
            while (newPopulation.length < POPULATION_SIZE) {
                const parent1 = selectParent();
                const parent2 = selectParent();
                const child = crossover(parent1, parent2);
                child.mutate();
                newPopulation.push(child);
            }
            
            population = newPopulation;
            generation++;
            
            // Пересоздаем мир для нового поколения
            createWorld();
        }
        
        function selectParent() {
            // Турнирная селекция
            const tournamentSize = 5;
            let best = null;
            for (let i = 0; i < tournamentSize; i++) {
                const randomIndex = Math.floor(Math.random() * population.length);
                const candidate = population[randomIndex];
                if (!best || candidate.fitness > best.fitness) {
                    best = candidate;
                }
            }
            return best;
        }
        
        function crossover(parent1, parent2) {
            const child = new AIPerson();
            for (let i = 0; i < child.brain.weights.length; i++) {
                if (Math.random() < 0.5) {
                    child.brain.weights[i] = parent1.brain.weights[i];
                } else {
                    child.brain.weights[i] = parent2.brain.weights[i];
                }
            }
            child.brain.bias = Math.random() < 0.5 ? parent1.brain.bias : parent2.brain.bias;
            return child;
        }
        
        // === ОТРИСОВКА ===
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем мир
            for (let y = 0; y < WORLD_HEIGHT; y++) {
                for (let x = 0; x < WORLD_WIDTH; x++) {
                    const px = x * TILE_SIZE;
                    const py = y * TILE_SIZE;
                    
                    switch (world[y][x]) {
                        case TILE.WALL:
                            ctx.fillStyle = '#4a4a5a';
                            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#5a5a6a';
                            ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                            break;
                        case TILE.FOOD:
                            ctx.fillStyle = '#2d4a2d';
                            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            ctx.fillStyle = '#ff4444';
                            ctx.beginPath();
                            ctx.arc(px + TILE_SIZE / 2, py + TILE_SIZE / 2, 5, 0, Math.PI * 2);
                            ctx.fill();
                            break;
                        default:
                            ctx.fillStyle = '#2d4a2d';
                            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                    }
                }
            }
            
            // Рисуем ИИ-человечков
            population.forEach(person => {
                if (!person.alive) return;
                
                const px = person.x * TILE_SIZE;
                const py = person.y * TILE_SIZE;
                
                // Тело
                const fitnessRatio = person.fitness / (bestScore || 1);
                const green = Math.floor(255 * Math.min(fitnessRatio, 1));
                const red = Math.floor(255 * (1 - Math.min(fitnessRatio, 1)));
                
                ctx.fillStyle = `rgb(${red}, ${green}, 150)`;
                ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);
                
                // Глаза (показывают направление)
                ctx.fillStyle = '#000';
                const eyeOffset = 3;
                switch (person.direction) {
                    case 0: // вверх
                        ctx.fillRect(px + 6, py + 6, 3, 3);
                        ctx.fillRect(px + 11, py + 6, 3, 3);
                        break;
                    case 1: // вправо
                        ctx.fillRect(px + 11, py + 6, 3, 3);
                        ctx.fillRect(px + 11, py + 11, 3, 3);
                        break;
                    case 2: // вниз
                        ctx.fillRect(px + 6, py + 11, 3, 3);
                        ctx.fillRect(px + 11, py + 11, 3, 3);
                        break;
                    case 3: // влево
                        ctx.fillRect(px + 6, py + 6, 3, 3);
                        ctx.fillRect(px + 6, py + 11, 3, 3);
                        break;
                }
                
                // Индикатор энергии
                if (person.energy < 30) {
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(px + 2, py - 2, 16, 3);
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(px + 2, py - 2, 16 * (person.energy / 100), 3);
                }
            });
        }
        
        // === ИГРОВОЙ ЦИКЛ ===
        function gameLoop() {
            const stepsPerFrame = speedMultiplier;
            
            for (let step = 0; step < stepsPerFrame; step++) {
                let allDead = true;
                
                population.forEach(person => {
                    if (person.alive) {
                        person.step();
                        allDead = false;
                    }
                });
                
                if (allDead) {
                    evolvePopulation();
                }
            }
            
            // Обновляем статистику
            const aliveCount = population.filter(p => p.alive).length;
            const bestPerson = population.reduce((a, b) => 
                (a.fitness > b.fitness) ? a : b
            );
            
            document.getElementById('foodCounter').innerText = bestPerson.foodEaten;
            document.getElementById('stepCounter').innerText = bestPerson.steps;
            document.getElementById('generationCounter').innerText = generation;
            document.getElementById('aiStatus').innerText = 
                `Живы: ${aliveCount}/${POPULATION_SIZE}`;
            
            draw();
            
            requestAnimationFrame(gameLoop);
        }
        
        // === ОБРАБОТЧИКИ КНОПОК ===
        const speedButtons = {
            'speed1x': 1,
            'speed10x': 10,
            'speed100x': 100,
            'speed1000x': 1000
        };
        
        Object.keys(speedButtons).forEach(id => {
            document.getElementById(id).addEventListener('click', function() {
                speedMultiplier = speedButtons[id];
                setActiveButton(this);
            });
        });
        
        function setActiveButton(activeBtn) {
            document.querySelectorAll('.time-buttons button').forEach(btn => 
                btn.classList.remove('active')
            );
            activeBtn.classList.add('active');
        }
        
        // === ЗАПУСК ===
        createWorld();
        createInitialPopulation();
        gameLoop();
    })();
</script>
</body>
    </html>

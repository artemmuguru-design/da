<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VR Park - Строитель с телепортом</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@1.4.0/dist/aframe-physics-system.min.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
    
    /* ----- ЭТО НАША КРАСНАЯ ТОЧКА - ОНА НАВСЕГДА В ЦЕНТРЕ ЭКРАНА ----- */
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      background: radial-gradient(circle, #ff0000 30%, rgba(255,0,0,0) 70%);
      border-radius: 50%;
      z-index: 1000;
      pointer-events: none; /* Чтобы не мешать кликам по кнопке */
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
      border: 2px solid rgba(255, 50, 50, 0.9);
    }

    /* КРУЖОК ОТСЧЕТА - появляется над точкой, когда наводимся на объект */
    #fuse-circle {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -70%); /* Смещаем чуть выше красной точки */
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: conic-gradient(#00ff44 0% 0%, rgba(0, 255, 68, 0.2) 0% 100%);
      border: 3px solid #00ff44;
      z-index: 1000;
      pointer-events: none;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.4);
    }

    #fuse-text {
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 10px black;
      background: rgba(0,0,0,0.5);
      padding: 2px 8px;
      border-radius: 10px;
      font-family: monospace;
    }

    /* КНОПКА "БРОСИТЬ" */
    #drop-btn {
      position: fixed;
      bottom: 40px;
      right: 40px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #ff2222;
      color: white;
      font-size: 20px;
      font-weight: bold;
      border: 4px solid white;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.7);
      z-index: 999;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.3;
      padding: 10px;
      user-select: none;
      cursor: pointer;
    }
    #drop-btn:active { transform: scale(0.85); background: #cc0000; }

    #info {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 18px;
      background: rgba(0,0,0,0.8);
      padding: 10px 24px;
      border-radius: 40px;
      z-index: 999;
      border: 2px solid rgba(255,255,255,0.3);
      pointer-events: none;
      white-space: nowrap;
      text-align: center;
      font-family: Arial;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <!-- КРАСНАЯ ТОЧКА - ВСЕГДА В ЦЕНТРЕ -->
  <div id="crosshair"></div>
  
  <!-- КРУЖОК ОТСЧЕТА -->
  <div id="fuse-circle">
    <span id="fuse-text">5</span>
  </div>

  <button id="drop-btn">БРОСИТЬ<br>БЛОК</button>
  <div id="info">🎯 Наведись на блок на 5 сек, чтобы взять его</div>

  <!-- СЦЕНА A-FRAME -->
  <a-scene id="scene" physics="driver: local; gravity: -9.8">
    
    <!-- СТЕНЫ С СЕТКОЙ (как на твоем фото) -->
    <a-box id="wall-back" position="0 2 -6" width="12" height="4" depth="0.3" color="#d0d0d0"></a-box>
    <a-box id="wall-left" position="-6 2 0" width="0.3" height="4" depth="12" color="#d0d0d0"></a-box>
    <a-box id="wall-right" position="6 2 0" width="0.3" height="4" depth="12" color="#d0d0d0"></a-box>
    <a-box id="wall-front" position="0 2 6" width="12" height="4" depth="0.3" color="#d0d0d0" opacity="0.15"></a-box>

    <!-- ПОЛ И ПОТОЛОК (ЖЕЛТО-ОРАНЖЕВЫЕ) -->
    <a-plane id="floor" class="floor" position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#ffaa33"></a-plane>
    <a-plane id="ceiling" position="0 4 0" rotation="90 0 0" width="12" height="12" color="#ffaa33"></a-plane>

    <!-- ОСВЕЩЕНИЕ -->
    <a-light type="ambient" intensity="0.7"></a-light>
    <a-light type="directional" position="5 10 5" intensity="0.9"></a-light>
    <a-light type="point" position="0 3 0" intensity="0.3" color="#ffaa55"></a-light>

    <!-- КАМЕРА (ГЛАЗА) -->
    <a-camera id="camera" position="0 0.5 0" look-controls>
      <!-- ЛУЧ ДЛЯ ОПРЕДЕЛЕНИЯ, КУДА СМОТРИТ ИГРОК -->
      <a-entity id="raycaster" 
                raycaster="objects: .block, .floor, .wall; far: 8; interval: 100; direction: 0 0 -1">
      </a-entity>
    </a-camera>

    <!-- БЛОКИ ДЛЯ СБОРА -->
    <a-box class="block" position="-1.5 0.25 -2" width="0.5" height="0.5" depth="0.5" color="#ff5555" dynamic-body="mass: 1; shape: box"></a-box>
    <a-box class="block" position="1.5 0.25 -2.5" width="0.5" height="0.5" depth="0.5" color="#55aaff" dynamic-body="mass: 1; shape: box"></a-box>
    <a-box class="block" position="0 0.25 -4" width="0.5" height="0.5" depth="0.5" color="#55ff88" dynamic-body="mass: 1; shape: box"></a-box>
    <a-box class="block" position="-2.5 0.25 -4.5" width="0.5" height="0.5" depth="0.5" color="#ffaa55" dynamic-body="mass: 1; shape: box"></a-box>
    <a-box class="block" position="2.5 0.25 -5" width="0.5" height="0.5" depth="0.5" color="#cc77ff" dynamic-body="mass: 1; shape: box"></a-box>

  </a-scene>

  <script>
    // ============================================================
    // ВСЯ ЛОГИКА ИГРЫ
    // ============================================================
    (function() {
      // ЭЛЕМЕНТЫ ИНТЕРФЕЙСА
      const fuseCircle = document.getElementById('fuse-circle');
      const fuseText = document.getElementById('fuse-text');
      const info = document.getElementById('info');
      const dropBtn = document.getElementById('drop-btn');

      // ЭЛЕМЕНТЫ СЦЕНЫ
      const scene = document.querySelector('#scene');
      const camera = document.querySelector('#camera');
      const raycaster = document.querySelector('#raycaster');

      // СОСТОЯНИЕ
      let carriedBlock = null;        // Блок, который мы несем
      let isFusing = false;           // Идет ли отсчет
      let fuseTimer = 0;              // Текущее время отсчета
      let fuseTarget = null;          // Объект, на который смотрим
      let fuseType = null;            // 'block' или 'floor'
      let fuseDuration = 5;           // По умолчанию для блока
      const TELEPORT_DURATION = 4;    // Для пола

      // ===== ФУНКЦИЯ ВЗЯТЬ БЛОК =====
      function pickUpBlock(block) {
        if (carriedBlock) return;
        carriedBlock = block;
        // Отключаем физику
        block.removeAttribute('dynamic-body');
        // Делаем блок ребенком камеры (он будет следовать за взглядом)
        camera.appendChild(block);
        block.setAttribute('position', '0 0 -1.5');
        block.setAttribute('rotation', '0 0 0');
        // Скрываем кружок отсчета
        fuseCircle.style.display = 'none';
        isFusing = false;
        info.textContent = '✋ Блок взят! Нажми "БРОСИТЬ"';
        info.style.borderColor = '#44ff44';
      }

      // ===== ФУНКЦИЯ ТЕЛЕПОРТА =====
      function teleportTo(position) {
        const newPos = {
          x: position.x,
          y: 0.5,
          z: position.z
        };
        camera.setAttribute('position', newPos);
        info.textContent = '🌀 Телепорт!';
        info.style.borderColor = '#44aaff';
        setTimeout(() => {
          info.textContent = '🎯 Наведись на блок на 5 сек';
          info.style.borderColor = 'rgba(255,255,255,0.3)';
        }, 1500);
      }

      // ===== ФУНКЦИЯ БРОСИТЬ БЛОК =====
      function dropBlock() {
        if (!carriedBlock) {
          info.textContent = '⚠️ Сначала возьми блок (наведись на 5 сек)';
          info.style.borderColor = '#ffaa00';
          setTimeout(() => {
            info.textContent = '🎯 Наведись на блок на 5 сек';
            info.style.borderColor = 'rgba(255,255,255,0.3)';
          }, 2000);
          return;
        }

        const block = carriedBlock;
        camera.removeChild(block);
        scene.appendChild(block);

        // Позиция и направление камеры
        const camPos = camera.getAttribute('position');
        const direction = new THREE.Vector3(0, 0, -1);
        const quat = camera.object3D.quaternion;
        direction.applyQuaternion(quat);

        // Кидаем вперед
        const throwPos = {
          x: camPos.x + direction.x * 2.5,
          y: camPos.y + direction.y * 1.5 + 0.5,
          z: camPos.z + direction.z * 2.5
        };
        block.setAttribute('position', throwPos);
        block.setAttribute('dynamic-body', 'mass: 1; shape: box');

        // Добавляем импульс для полета
        block.addEventListener('body-loaded', function() {
          const body = block.components['dynamic-body'].body;
          if (body) {
            const impulse = new THREE.Vector3(
              direction.x * 0.5,
              0.4,
              direction.z * 0.5
            );
            body.applyImpulse(impulse, body.position);
          }
        }, { once: true });

        carriedBlock = null;
        info.textContent = '💥 Блок брошен!';
        info.style.borderColor = '#ff4444';
        setTimeout(() => {
          info.textContent = '🎯 Наведись на блок на 5 сек';
          info.style.borderColor = 'rgba(255,255,255,0.3)';
        }, 1500);
      }

      // ===== ОБРАБОТЧИК НАВЕДЕНИЯ =====
      // Используем события raycaster
      raycaster.addEventListener('mouseenter', function(evt) {
        const target = evt.detail.intersectedEl;
        if (!target || carriedBlock) return;

        // Проверяем, что это блок или пол
        if (target.classList && target.classList.contains('block')) {
          fuseTarget = target;
          fuseType = 'block';
          fuseDuration = 5;
          startFuse();
        } else if (target.classList && target.classList.contains('floor')) {
          fuseTarget = target;
          fuseType = 'floor';
          fuseDuration = TELEPORT_DURATION;
          startFuse();
        }
      });

      raycaster.addEventListener('mouseleave', function(evt) {
        // Если ушли с объекта - сбрасываем отсчет
        if (isFusing) {
          cancelFuse();
        }
      });

      // ===== УПРАВЛЕНИЕ ОТСЧЕТОМ =====
      function startFuse() {
        if (isFusing) return;
        isFusing = true;
        fuseTimer = fuseDuration;
        fuseCircle.style.display = 'flex';
        fuseText.textContent = Math.ceil(fuseTimer);
        // Обновляем стиль кружка
        updateFuseCircle(1);
        info.textContent = `⏳ ${Math.ceil(fuseTimer)}...`;
      }

      function cancelFuse() {
        isFusing = false;
        fuseCircle.style.display = 'none';
        fuseTarget = null;
        fuseType = null;
        info.textContent = '🎯 Наведись на блок на 5 сек';
        info.style.borderColor = 'rgba(255,255,255,0.3)';
      }

      function updateFuseCircle(progress) {
        // progress от 0 до 1
        const angle = progress * 360;
        fuseCircle.style.background = `conic-gradient(#00ff44 ${angle}deg, rgba(0, 255, 68, 0.2) ${angle}deg 360deg)`;
      }

      // ===== ОБНОВЛЕНИЕ КАЖДЫЙ КАДР =====
      let lastTime = Date.now();
      function updateLoop() {
        const now = Date.now();
        const delta = (now - lastTime) / 1000;
        lastTime = now;

        if (isFusing && fuseTarget) {
          fuseTimer -= delta;

          if (fuseTimer <= 0) {
            // Время вышло - выполняем действие
            if (fuseType === 'block') {
              pickUpBlock(fuseTarget);
            } else if (fuseType === 'floor') {
              const pos = fuseTarget.getAttribute('position');
              teleportTo(pos);
            }
            // Сбрасываем отсчет
            isFusing = false;
            fuseCircle.style.display = 'none';
            fuseTarget = null;
            fuseType = null;
          } else {
            // Обновляем кружок
            const progress = fuseTimer / fuseDuration;
            updateFuseCircle(1 - progress);
            fuseText.textContent = Math.ceil(fuseTimer);
            info.textContent = `⏳ ${Math.ceil(fuseTimer)}...`;
          }
        }

        requestAnimationFrame(updateLoop);
      }
      updateLoop();

      // ===== КНОПКА БРОСИТЬ =====
      dropBtn.addEventListener('click', function(e) {
        e.preventDefault();
        dropBlock();
      });

      // ===== ДЛЯ ОТЛАДКИ: ВЫВОДИМ СООБЩЕНИЕ В КОНСОЛЬ =====
      console.log('VR Игра запущена! Красная точка всегда в центре.');
      console.log('Наведись на блок на 5 сек → взять. На пол на 4 сек → телепорт.');
    })();
  </script>

</body>
</html>

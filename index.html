<script type="module">
import * as THREE from "three";

const $ = id => document.getElementById(id);
const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const M = (c, r = .65, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });

const N = t => {
    let n = document.createElement("div");
    n.className = "note"; n.textContent = t;
    document.body.appendChild(n);
    setTimeout(() => n.remove(), 2000);
};

const mk = (g, m) => {
    let o = new THREE.Mesh(g, m);
    o.castShadow = o.receiveShadow = true;
    return o;
};

// ============================================================
//  АУДИО СИСТЕМА
// ============================================================
let audioCtx = null;
let masterGain = null;
let droneNodes = [];
let noiseNode = null;
let noiseGain = null;
let windNode = null;
let windGain = null;
let audioStarted = false;

function createPinkNoiseBuffer() {
    if (!audioCtx) return null;
    const bufferSize = audioCtx.sampleRate * 2; 
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    let b0, b1, b2, b3, b4, b5, b6;
    b0 = b1 = b2 = b3 = b4 = b5 = b6 = 0.0;
    for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
        data[i] *= 0.11;
        b6 = white * 0.115926;
    }
    return buffer;
}

function initAudio() {
    if (audioStarted) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
    audioStarted = true;

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.9;
    masterGain.connect(audioCtx.destination);

    for (let i = 0; i < 4; i++) createRealisticMotor(i);

    const pinkBuffer = createPinkNoiseBuffer();
    noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = pinkBuffer;
    noiseNode.loop = true;
    
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'highpass';
    noiseFilter.frequency.value = 1200;
    
    const noiseResonance = audioCtx.createBiquadFilter();
    noiseResonance.type = 'peaking';
    noiseResonance.Q.value = 2;
    noiseResonance.frequency.value = 2500;
    noiseResonance.gain.value = 5;

    noiseGain = audioCtx.createGain();
    noiseGain.gain.value = 0;

    noiseNode.connect(noiseFilter);
    noiseFilter.connect(noiseResonance);
    noiseResonance.connect(noiseGain);
    noiseGain.connect(masterGain);
    noiseNode.start();

    windNode = audioCtx.createBufferSource();
    windNode.buffer = pinkBuffer;
    windNode.loop = true;
    
    const windFilter = audioCtx.createBiquadFilter();
    windFilter.type = 'lowpass';
    windFilter.frequency.value = 400;

    windGain = audioCtx.createGain();
    windGain.gain.value = 0;

    windNode.connect(windFilter);
    windFilter.connect(windGain);
    windGain.connect(masterGain);
    windNode.start();
}

function createRealisticMotor(index) {
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.value = 100; 

    const modOsc = audioCtx.createOscillator();
    modOsc.type = 'square';
    modOsc.frequency.value = 50;

    const modGain = audioCtx.createGain();
    modGain.gain.value = 200;

    modOsc.connect(modGain);
    modGain.connect(osc.frequency);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 800;
    filter.Q.value = 1.5;

    const gain = audioCtx.createGain();
    gain.gain.value = 0;

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);

    osc.start();
    modOsc.start();

    droneNodes.push({ osc, modOsc, filter, gain, modGain, baseFreq: 120 + (index * 3) });
}

function updateDroneAudio(speedRatio, isNearObject) {
    if (!audioCtx) { initAudio(); return; }
    if (!isD) return; 
    
    const now = audioCtx.currentTime;
    const targetFreq = 150 + (speedRatio * 1800); 
    
    droneNodes.forEach((node, i) => {
        const detune = (Math.random() - 0.5) * 5; 
        node.osc.frequency.setTargetAtTime(node.baseFreq + targetFreq + detune, now, 0.03);
        node.modOsc.frequency.setTargetAtTime(40 + (speedRatio * 300), now, 0.03);
        node.filter.frequency.setTargetAtTime(600 + (speedRatio * 2500), now, 0.03);
        
        const idleVol = 0.04;
        const targetVol = idleVol + (speedRatio * 0.12);
        node.gain.gain.setTargetAtTime(targetVol, now, 0.05);
    });

    noiseGain.gain.setTargetAtTime(speedRatio * 0.3, now, 0.1);
    windGain.gain.setTargetAtTime(speedRatio * 0.4, now, 0.1);
    windNode.playbackRate.setTargetAtTime(0.5 + speedRatio, now, 0.1);
}

function playExplosionSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const duration = 4.5;

    const sub = audioCtx.createOscillator();
    const subGain = audioCtx.createGain();
    sub.type = 'sine';
    sub.frequency.setValueAtTime(150, now);
    sub.frequency.exponentialRampToValueAtTime(0.01, now + duration);
    subGain.gain.setValueAtTime(2.5, now);
    subGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    sub.connect(subGain);
    subGain.connect(masterGain);
    sub.start(now);
    sub.stop(now + duration);

    const bufferSize = audioCtx.sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i/bufferSize);
    
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'lowpass';
    noiseFilter.frequency.setValueAtTime(3000, now);
    noiseFilter.frequency.linearRampToValueAtTime(100, now + duration);

    const noiseGainLocal = audioCtx.createGain();
    noiseGainLocal.gain.setValueAtTime(1.8, now);
    noiseGainLocal.gain.exponentialRampToValueAtTime(0.001, now + duration);
    
    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGainLocal);
    noiseGainLocal.connect(masterGain);
    noise.start(now);
}

function stopDroneAudio() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    
    droneNodes.forEach(node => {
        node.gain.gain.cancelScheduledValues(now);
        node.gain.gain.setValueAtTime(0, now);
        node.osc.frequency.cancelScheduledValues(now);
        node.osc.frequency.setValueAtTime(100, now);
        node.modOsc.frequency.cancelScheduledValues(now);
        node.modOsc.frequency.setValueAtTime(50, now);
    });

    noiseGain.gain.cancelScheduledValues(now);
    noiseGain.gain.setValueAtTime(0, now);
    
    windGain.gain.cancelScheduledValues(now);
    windGain.gain.setValueAtTime(0, now);
}

// ============================================================
//  СИСТЕМА ВЗРЫВА
// ============================================================
let explosions = [];
let cameraShake = 0;

function createExplosion(x, y, z) {
    const group = new THREE.Group();
    group.position.set(x, y, z);
    cameraShake = 1.5;

    const light = new THREE.PointLight(0xffaa00, 15, 60);
    light.position.y = 2;
    group.add(light);

    const coreGeo = new THREE.SphereGeometry(1.5, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const core = new THREE.Mesh(coreGeo, coreMat);
    group.add(core);

    const shellGeo = new THREE.SphereGeometry(2.0, 32, 32);
    const shellMat = new THREE.MeshBasicMaterial({ 
        color: 0xff4500, transparent: true, opacity: 0.8, side: THREE.BackSide 
    });
    const shell = new THREE.Mesh(shellGeo, shellMat);
    group.add(shell);

    const particleCount = 100;
    for (let i = 0; i < particleCount; i++) {
        const size = 0.4 + Math.random() * 0.8;
        const geo = new THREE.SphereGeometry(size, 8, 6);
        const mat = new THREE.MeshBasicMaterial({ 
            color: Math.random() > 0.5 ? 0xffaa00 : 0xff3300, 
            transparent: true, opacity: 1 
        });
        const particle = new THREE.Mesh(geo, mat);
        
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const speed = 5 + Math.random() * 15;
        
        particle.position.x = Math.sin(phi) * Math.cos(theta) * 0.5;
        particle.position.y = Math.sin(phi) * Math.sin(theta) * 0.5;
        particle.position.z = Math.cos(phi) * 0.5;
        
        particle.userData.vel = new THREE.Vector3(
            Math.sin(phi) * Math.cos(theta) * speed,
            Math.sin(phi) * Math.sin(theta) * speed,
            Math.cos(phi) * speed
        );
        particle.userData.gravity = new THREE.Vector3(0, -9.8, 0);
        particle.userData.life = 1.0;
        particle.userData.decay = 0.2 + Math.random() * 0.3;
        
        group.add(particle);
    }
    
    scene.add(group);
    explosions.push({ group, age: 0, duration: 4.0, light, core, shell });
}

function updateExplosions(dt) {
    for (let i = explosions.length - 1; i >= 0; i--) {
        const exp = explosions[i];
        exp.age += dt;
        const progress = exp.age / exp.duration;
        
        const scale = 1 + progress * 8;
        exp.core.scale.set(scale, scale, scale);
        exp.shell.scale.set(scale * 1.2, scale * 1.2, scale * 1.2);
        
        exp.light.intensity = 15 * (1 - progress);
        exp.shell.material.opacity = 0.8 * (1 - progress);
        exp.core.material.color.setHSL(0.08 - progress * 0.08, 1, 0.5);

        for (let j = exp.group.children.length - 1; j >= 0; j--) {
            const child = exp.group.children[j];
            if (child.userData.vel) {
                child.userData.vel.add(child.userData.gravity.clone().multiplyScalar(dt));
                child.position.add(child.userData.vel.clone().multiplyScalar(dt));
                child.rotation.x += dt * 2;
                child.rotation.y += dt * 2;
                child.userData.life -= dt * child.userData.decay;
                child.material.opacity = child.userData.life;
                if (child.userData.life <= 0) exp.group.remove(child);
            }
        }
        
        if (exp.age >= exp.duration) { 
            scene.remove(exp.group); 
            explosions.splice(i, 1); 
        }
    }
    
    if (cameraShake > 0) {
        cameraShake -= dt * 2;
        if (cameraShake < 0) cameraShake = 0;
    }
}

// ============================================================
//  КОЛЛИЗИИ
// ============================================================
let colliders = [];

function addColliders(obj) {
    obj.updateMatrixWorld(true);
    obj.traverse(child => {
        if (child.isMesh && child.geometry && child.geometry.attributes.position) {
            if (child.material && child.material.transparent && child.material.opacity < 0.8) return;
            if (child.geometry.type === 'SphereGeometry' && child.geometry.parameters.radius < 0.3) return;
            
            const box = new THREE.Box3().setFromObject(child);
            const b = 0.05;
            colliders.push({ 
                minX: box.min.x - b, maxX: box.max.x + b, 
                minY: box.min.y - b, maxY: box.max.y + b, 
                minZ: box.min.z - b, maxZ: box.max.z + b 
            });
        }
    });
}

function hitPlayer(px, pz, pr) {
    const py0 = player.position.y; const py1 = py0 + 2.5;
    for (const c of colliders) {
        if (px + pr > c.minX && px - pr < c.maxX && pz + pr > c.minZ && pz - pr < c.maxZ && py1 > c.minY && py0 < c.maxY) return true;
    }
    return false;
}

function hitDrone(px, py, pz, pr) {
    for (const c of colliders) {
        if (px + pr > c.minX && px - pr < c.maxX && py + pr > c.minY && py - pr < c.maxY && pz + pr > c.minZ && pz - pr < c.maxZ) return true;
    }
    return false;
}

function checkProximity(px, py, pz) {
    let minDist = Infinity;
    for (const c of colliders) {
        const dx = Math.max(c.minX - px, 0, px - c.maxX);
        const dy = Math.max(c.minY - py, 0, py - c.maxY);
        const dz = Math.max(c.minZ - pz, 0, pz - c.maxZ);
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (dist < minDist) minDist = dist;
    }
    return minDist < 15;
}

function getGeo(shape) {
    switch(shape) {
        case 'cube': return new THREE.BoxGeometry(2, 2, 2);
        case 'sphere': return new THREE.SphereGeometry(1, 16, 16);
        case 'cone': return new THREE.ConeGeometry(1, 2, 16);
        case 'cyl': return new THREE.CylinderGeometry(1, 1, 2, 16);
        case 'glass': return new THREE.BoxGeometry(2, 2, 0.1);
        case 'torus': return new THREE.TorusGeometry(1, 0.3, 16, 32);
        case 'pillow': {
            let g = new THREE.SphereGeometry(1, 32, 32);
            let p = g.attributes.position;
            for (let i = 0; i < p.count; i++) {
                let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
                let len = Math.sqrt(x*x + y*y + z*z), nx = x/len, ny = y/len, nz = z/len;
                let w = 1.3, d = 1.3, h = 0.32, rh = 0.08, cd = 0.04, cr = 0.25;
                let nX = nx*w, nY = ny*h, nZ = nz*d;
                let cf = Math.pow(Math.abs(nx)*Math.abs(nz), 0.4), cs = 1 - cf*cr;
                nX *= cs; nZ *= cs;
                let ef = Math.pow(Math.abs(ny), 0.6), rl = rh*ef*Math.sign(y||1);
                let cdist = Math.sqrt(nx*nx + nz*nz), da = cd*(1-ef)*Math.sign(y||1);
                nY += rl - da;
                let ff = Math.sin(nx*6)*Math.cos(nz*6)*0.015 + Math.sin(nx*3+nz*4)*0.01;
                nY += ff*(1-ef*0.5);
                let ew = Math.sin(nx*12)*0.008 + Math.cos(nz*10)*0.008;
                nY += ew*ef;
                p.setXYZ(i, nX, nY, nZ);
            }
            g.computeVertexNormals();
            return g;
        }
        default: return new THREE.BoxGeometry(2, 2, 2);
    }
}

function getMat(shape, color) {
    if (shape === 'glass') return new THREE.MeshStandardMaterial({ color: color || "#4fd2ff", transparent: true, opacity: 0.3, roughness: 0.1, metalness: 0.1, side: THREE.DoubleSide });
    if (shape === 'pillow') return new THREE.MeshStandardMaterial({ color: color || "#ffffff", roughness: 0.75, metalness: 0.0 });
    return new THREE.MeshStandardMaterial({ color: color || "#ffffff", roughness: 0.4, metalness: 0.2 });
}

function buildModelFromData(data, x, z, rotY = 0) {
    const grp = new THREE.Group();
    data.objects.forEach(o => {
        const geo = getGeo(o.shape);
        const mat = getMat(o.shape, o.color);
        const m = new THREE.Mesh(geo, mat);
        if (o.position) m.position.fromArray(o.position);
        if (o.scale) m.scale.fromArray(o.scale);
        if (o.rotation) { m.quaternion.fromArray(o.rotation); m.quaternion.normalize(); }
        grp.add(m);
    });
    grp.position.set(x, 0, z);
    grp.rotation.y = rotY;
    scene.add(grp);
    addColliders(grp);
}

function house(x, z, c, r = 0, s = 1) {
    let g = new THREE.Group();
    let w = 12*s, h = 6*s, d = 10*s;
    let wall = mk(B(w,h,d), M(c,.7)); wall.position.y = h/2; g.add(wall);
    let rh = 3*s, ov = .8*s, slope = Math.sqrt((w/2)**2+rh**2)+ov, ang = Math.atan2(rh,w/2), rm = M(0x8b2020,.6);
    let p1 = mk(B(slope,.2*s,d+ov*2), rm); p1.position.set(-w/4,h+rh/2,0); p1.rotation.z = ang; g.add(p1);
    let p2 = mk(B(slope,.2*s,d+ov*2), rm); p2.position.set(w/4,h+rh/2,0); p2.rotation.z = -ang; g.add(p2);
    let ridge = mk(B(.3*s,.3*s,d+ov*2), M(0x5a3a1a)); ridge.position.y = h+rh; g.add(ridge);
    let ch = mk(B(s,2.5*s,s), M(0x8a8a8a)); ch.position.set(w*.25,h+rh*.7,-d*.2); g.add(ch);
    let door = mk(B(2*s,3.5*s,.2), M(0x4a2810,.5)); door.position.set(0,1.75*s,d/2+.05); g.add(door);
    let knob = mk(new THREE.SphereGeometry(.12*s,8,8), M(0xffd700,.3,1)); knob.position.set(.7*s,1.7*s,d/2+.2); g.add(knob);
    let step = mk(B(2.6*s,.3*s,1*s), M(0x999999)); step.position.set(0,.15*s,d/2+.6*s); g.add(step);
    for (let wx of [-3.5*s,3.5*s]) {
        let f = mk(B(1.9*s,1.9*s,.15*s), M(0xffffff,.5)); f.position.set(wx,3.5*s,d/2+.05); g.add(f);
        let gl = mk(B(1.5*s,1.5*s,.2*s), M(0x88ccff,.1,.6)); gl.position.set(wx,3.5*s,d/2+.15); g.add(gl);
    }
    for (let i = 0; i < 4; i++) {
        let bu = mk(new THREE.SphereGeometry(.6*s,8,8), M(0x2d6a4f,.9));
        bu.position.set(-w/2+1+i*(w-2)/3,.5*s,d/2+.8*s); g.add(bu);
    }
    g.position.set(x,0,z); g.rotation.y = r; scene.add(g);
    addColliders(g);
}

function buildGranFactory(ox, oz) {
    const grp = new THREE.Group();
    GRAN_DATA.objects.forEach(o => {
        const geo = getGeo(o.shape);
        const mat = getMat(o.shape, o.color);
        const m = new THREE.Mesh(geo, mat);
        if (o.position) m.position.fromArray(o.position);
        if (o.scale) m.scale.fromArray(o.scale);
        if (o.rotation) { m.quaternion.fromArray(o.rotation); m.quaternion.normalize(); }
        grp.add(m);
    });
    grp.scale.set(4, 4, 4);
    grp.position.set(ox, 0, oz);
    scene.add(grp);
    addColliders(grp);
}
buildGranFactory(250, -250);

let worldDrone = null;
let worldDroneAr = [];

function createWorldDrone(x, z, rotY) {
    if (worldDrone) {
        scene.remove(worldDrone);
        worldDrone = null;
    }
    
    const t = DRONE_TYPES[selectedDrone];
    const wd = new THREE.Group();
    const wdb = mk(B(1.4,.45,1.6), M(t.color,.4,.8)); 
    wdb.position.y = .25; 
    wd.add(wdb);
    
    const wAr = [];
    for (let p of [[.8,.8],[-.8,.8],[.8,-.8],[-.8,-.8]]) {
        let a = mk(new THREE.CylinderGeometry(.09,.12,1.1,8), M(0x333333,.5,.7)); 
        a.position.set(p[0],.25,p[1]); 
        a.rotation.z = Math.PI/2; 
        wd.add(a);
        let pr = new THREE.Group(); 
        pr.position.set(p[0]*1.55,.55,p[1]*1.55);
        pr.add(mk(B(.8,.04,.16), M(0xdddddd,.2,.5))); 
        pr.add(mk(B(.16,.04,.8), M(0xdddddd,.2,.5)));
        wd.add(pr); 
        wAr.push(pr);
    }
    
    wd.position.set(x, 0.3, z);
    wd.rotation.y = rotY;
    scene.add(wd);
    
    worldDrone = wd;
    worldDroneAr = wAr;
    
    N("🚁 Дрон вызван!");
}

function removeWorldDrone() {
    if (worldDrone) {
        scene.remove(worldDrone);
        worldDrone = null;
        worldDroneAr = [];
    }
    $("enterDroneBtn").style.display = "none";
}

function renderShopPage() {
    let grid = $("droneGrid"); grid.innerHTML = "";
    $("pageInfo").textContent = (shopPage+1)+"/"+totalPages;
    let s = shopPage*PER_PAGE, e = Math.min(s+PER_PAGE, DRONE_TYPES.length);
    for (let i = s; i < e; i++) {
        let t = DRONE_TYPES[i], card = document.createElement("div"); card.className = "droneCard";
        let owned = ownedDrones.includes(t.id);
        if (owned) { if (t.id===selectedDrone) card.classList.add("selected"); } else card.classList.add("locked");
        card.innerHTML = `<div class="droneImg">${t.emoji}</div><div class="droneName">${t.name}</div><div class="dronePrice">${owned?"✓ Куплено":"🪙 "+t.price}</div>${!owned?'<button class="droneBuyBtn">Купить</button>':(t.id===selectedDrone?'<div style="color:#00ff88;font-weight:900;margin-top:6px">✓ ВЫБРАНО</div>':'')}`;
        if (owned) { card.onclick = () => { selectedDrone=t.id; saveDrones(); updateDroneVisual(); renderShopPage(); N("Выбран: "+t.name); }; }
        else { let btn = card.querySelector(".droneBuyBtn"); if (btn) btn.onclick = ev => { ev.stopPropagation(); if (coins>=t.price) { coins-=t.price; $("coin").textContent=coins; ownedDrones.push(t.id); selectedDrone=t.id; saveDrones(); updateDroneVisual(); renderShopPage(); N("Куплен: "+t.name); } else N("Недостаточно монет!"); }; }
        grid.appendChild(card);
    }
    $("prevPage").style.opacity = shopPage==0?".3":"1";
    $("nextPage").style.opacity = shopPage==totalPages-1?".3":"1";
}
$("prevPage").onclick = () => { if (shopPage>0) { shopPage--; renderShopPage(); } };
$("nextPage").onclick = () => { if (shopPage<totalPages-1) { shopPage++; renderShopPage(); } };

$("go").onclick = async () => { 
    started=1; 
    initAudio();
    $("start").style.display="none"; 
    $("droneBtn").style.display="flex"; 
    $("droneShopBtn").style.display="flex"; 
    $("jumpBtn").style.display="flex";

};
$("droneShopBtn").onclick = e => { e.preventDefault(); e.stopPropagation(); shopPage=0; renderShopPage(); $("droneShopModal").classList.add("show"); };
$("closeShop").onclick = () => $("droneShopModal").classList.remove("show");
$("closeShopX").onclick = () => $("droneShopModal").classList.remove("show");

$("droneBtn").onclick = e => {
    e.preventDefault(); e.stopPropagation();
    let rem = Math.ceil((droneCd-performance.now())/1000);
    if (rem>0) { N("🔋 Дрон заряжается: "+rem+"с"); return; }
    if (worldDrone) { N("🚁 Дрон уже вызван!"); return; }
    
    const spawnDist = 3;
    const spawnX = player.position.x - Math.sin(cy) * spawnDist;
    const spawnZ = player.position.z - Math.cos(cy) * spawnDist;
    const spawnRot = cy;
    
    createWorldDrone(spawnX, spawnZ, spawnRot);
};

$("enterDroneBtn").onclick = e => {
    e.preventDefault(); e.stopPropagation();
    if (!worldDrone || isD) return;
    
    drone.position.copy(worldDrone.position);
    drone.position.y = 1.5;
    drone.rotation.y = worldDrone.rotation.y;
    drone.visible = true;
    
    removeWorldDrone();
    
    isD = 1;
    player.visible = false;
    dh = 1.5;
    camera.fov = 98;
    camera.updateProjectionMatrix();
    showD(1);
    $("status").textContent = "🚁 FPV дрон";
    N("FPV: " + DRONE_TYPES[selectedDrone].name);
};

$("jumpBtn").onpointerdown = e => { e.preventDefault(); doJump(); };
$("exit").onclick = () => { 
    isD=0; 
    player.visible=true; 
    drone.visible=false; 
    camera.fov=65; 
    camera.updateProjectionMatrix(); 
    showD(0); 
    $("status").textContent="🚶 Пешком";
    stopDroneAudio();
    removeWorldDrone();
    droneCd = performance.now() + 5000;
};
$("up").onpointerdown = e => { e.preventDefault(); up=1; }; $("up").onpointerup = () => up=0;
$("down").onpointerdown = e => { e.preventDefault(); down=1; }; $("down").onpointerup = () => down=0;

function jMove(e, dr) {
    let X=dr?djx:jx, Y=dr?djy:jy, dx=e.clientX-X, dy=e.clientY-Y, l=Math.hypot(dx,dy), R=42;
    if (l>R) { dx=dx/l*R; dy=dy/l*R; }
    if (dr) { $("dstick").style.transform=`translate3d(${dx}px,${dy}px,0)`; dmx=dx/R; dmz=dy/R; }
    else { $("stick").style.transform=`translate3d(${dx}px,${dy}px,0)`; mx=dx/R; mz=dy/R; }
}
$("joyA").onpointerdown = e => { if (isD) return; joy=1; jid=e.pointerId; jx=e.clientX; jy=e.clientY; $("joy").style.left=jx+"px"; $("joy").style.top=jy+"px"; $("joy").style.display="block"; jMove(e,0); };
$("djoyA").onpointerdown = e => { if (!isD) return; djoy=1; did=e.pointerId; djx=e.clientX; djy=e.clientY; $("djoy").style.left=djx+"px"; $("djoy").style.top=djy+"px"; $("djoy").style.display="block"; jMove(e,1); };

document.onpointermove = e => {
    if ($("droneShopModal").classList.contains("show")) return;
    if (joy&&e.pointerId==jid) jMove(e,0);
    if (djoy&&e.pointerId==did) jMove(e,1);
    if (cam&&e.pointerId==camid) { ty-=(e.clientX-cx)*.005; tp=THREE.MathUtils.clamp(tp+(e.clientY-cyy)*.005,-.5,1.2); cx=e.clientX; cyy=e.clientY; }
    if (dcam&&e.pointerId==dcamid) { dty-=(e.clientX-dcx)*.005; dtp=THREE.MathUtils.clamp(dtp+(e.clientY-dcy)*.005,-1.4,1.4); dcx=e.clientX; dcy=e.clientY; }
};
document.onpointerup = e => {
    if (e.pointerId==jid) { joy=0; mx=mz=0; $("joy").style.display="none"; $("stick").style.transform="translate3d(0,0,0)"; }
    if (e.pointerId==did) { djoy=0; dmx=dmz=0; $("djoy").style.display="none"; $("dstick").style.transform="translate3d(0,0,0)"; }
    if (e.pointerId==camid) cam=0; if (e.pointerId==dcamid) dcam=0;
};
document.addEventListener("pointerdown", e => {
    if ($("droneShopModal").classList.contains("show")) return;
    if (e.clientX<innerWidth*.5||e.target.tagName=="BUTTON"||e.target.className=="skin") return;
    if (isD) { dcam=1; dcamid=e.pointerId; dcx=e.clientX; dcy=e.clientY; }
    else { cam=1; camid=e.pointerId; cx=e.clientX; cyy=e.clientY; }
});
document.addEventListener("keydown", e => { if (e.code==="Space") doJump(); });

function updPlayer(dt) {
    let x=mx, z=mz, l=Math.hypot(x,z); if (l>1) { x/=l; z/=l; }
    let mv = Math.abs(x)>.05||Math.abs(z)>.05;
    if (mv&&grounded) {
        let f=new THREE.Vector3(-Math.sin(cy),0,-Math.cos(cy)), r=new THREE.Vector3(Math.cos(cy),0,-Math.sin(cy));
        let dir=new THREE.Vector3().addScaledVector(f,-z).addScaledVector(r,x).normalize();
        let nx=player.position.x+dir.x*5.7*dt, nz=player.position.z+dir.z*5.7*dt;
        if (!hitPlayer(nx,nz,.6)) { player.position.x=nx; player.position.z=nz; }
        player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,Math.atan2(dir.x,dir.z),dt*12);
        let t=performance.now()*.01, sw=Math.sin(t)*.5;
        arms[0].rotation.x=sw; arms[1].rotation.x=-sw; legs[0].rotation.x=-sw; legs[1].rotation.x=sw;
    } else if (grounded) { arms.forEach(a=>a.rotation.x*=.85); legs.forEach(l=>l.rotation.x*=.85); }
    vy-=GRAV*dt; player.position.y+=vy*dt;
    if (player.position.y<=0) { player.position.y=0; vy=0; grounded=1; } else grounded=0;
    if (!grounded) {
        arms[0].rotation.x=THREE.MathUtils.lerp(arms[0].rotation.x,-2.2,dt*8);
        arms[1].rotation.x=THREE.MathUtils.lerp(arms[1].rotation.x,-2.2,dt*8);
        legs[0].rotation.x=THREE.MathUtils.lerp(legs[0].rotation.x,.8,dt*8);
        legs[1].rotation.x=THREE.MathUtils.lerp(legs[1].rotation.x,.8,dt*8);
    }
}

function updDrone(dt) {
    if (up) dh+=5*dt; if (down) dh=Math.max(.4,dh-5*dt);
    dy=THREE.MathUtils.lerp(dy,dty,1-Math.pow(.001,dt));
    dp=THREE.MathUtils.lerp(dp,dtp,1-Math.pow(.001,dt));
    let x=dmx, z=dmz, l=Math.hypot(x,z); if (l>1) { x/=l; z/=l; }
    let f=new THREE.Vector3(-Math.sin(dy),0,-Math.cos(dy)), r=new THREE.Vector3(Math.cos(dy),0,-Math.sin(dy));
    let dir=new THREE.Vector3().addScaledVector(f,-z).addScaledVector(r,x);
    if (dir.length()>.1) {
        dir.normalize();
        let nx=drone.position.x+dir.x*currentDroneSpeed*dt, nz=drone.position.z+dir.z*currentDroneSpeed*dt;
        if (!hitDrone(nx,drone.position.y,nz,.8)) { drone.position.x=nx; drone.position.z=nz; }
        else { 
            coins+=5+Math.floor(Math.random()*15); 
            $("coin").textContent=coins; 
            N("💥 Врезался! +монеты"); 
            createExplosion(drone.position.x, drone.position.y, drone.position.z);
            playExplosionSound();
            crashDrone(); 
        }
    } else dSpeed*=.9;
    drone.position.y+=Math.sign(dh-drone.position.y)*Math.min(Math.abs(dh-drone.position.y),5*dt);
    if (hitDrone(drone.position.x,drone.position.y,drone.position.z,.8)) { 
        coins+=5+Math.floor(Math.random()*15); 
        $("coin").textContent=coins; 
        N("💥 Врезался! +монеты"); 
        createExplosion(drone.position.x, drone.position.y, drone.position.z);
        playExplosionSound();
        crashDrone(); 
    }
    drone.rotation.y=dy;
    if (drone.position.y<.35&&dSpeed>6) { 
        coins+=1+Math.floor(Math.random()*10); 
        $("coin").textContent=coins; 
        N("💥 Разбился! +монеты"); 
        createExplosion(drone.position.x, drone.position.y, drone.position.z);
        playExplosionSound();
        crashDrone(); 
    }
}

function crashDrone() {
    drone.position.set(4,.3,4); 
    drone.visible = false;
    dh=.3; 
    isD=0; 
    player.visible=true; 
    camera.fov=65; 
    camera.updateProjectionMatrix(); 
    showD(0); 
    $("status").textContent="🚶 Пешком";
    droneCd=performance.now()+5000;
    stopDroneAudio();
    removeWorldDrone();
}

function camPlayer(dt) {
    cy=THREE.MathUtils.lerp(cy,ty,1-Math.pow(.002,dt)); cp=THREE.MathUtils.lerp(cp,tp,1-Math.pow(.002,dt));
    let t=new THREE.Vector3(player.position.x,player.position.y+2.5,player.position.z), dist=7.5;
    let o=new THREE.Vector3(Math.sin(cy)*dist*Math.cos(cp),3.5+Math.sin(cp)*dist,Math.cos(cy)*dist*Math.cos(cp));
    camera.position.lerp(t.clone().add(o),1-Math.pow(.0005,dt)); camera.lookAt(t);
}
function camDrone(dt) {
    let t=new THREE.Vector3(drone.position.x,drone.position.y+.5,drone.position.z), dist=5;
    let o=new THREE.Vector3(Math.sin(dty)*dist*Math.cos(dtp),Math.sin(dtp)*dist,Math.cos(dty)*dist*Math.cos(dtp));
    
    if (cameraShake > 0) {
        const shakeAmt = cameraShake * 0.5;
        o.x += (Math.random() - 0.5) * shakeAmt;
        o.y += (Math.random() - 0.5) * shakeAmt;
        o.z += (Math.random() - 0.5) * shakeAmt;
    }

    camera.position.lerp(t.clone().add(o),1-Math.pow(.0005,dt)); camera.lookAt(t);
}

addEventListener("resize", () => { camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); $("hint").style.display=innerWidth>innerHeight?"none":"block"; });

function loop() {
    requestAnimationFrame(loop);
    let now=performance.now(), dt=Math.min((now-last)/1000,.05); last=now;
    if (started) {
        // ===== ОБНОВЛЕНИЕ СОЛНЦА И ТЕНЕЙ =====
        // Солнце и его target следуют за игроком/дроном
        const followTarget = isD ? drone : player;
        sun.target.position.set(followTarget.position.x, 0, followTarget.position.z);
        sun.position.set(followTarget.position.x + 120, 150, followTarget.position.z + 80);
        sun.target.updateMatrixWorld();
        
        if (isD) { 
            updDrone(dt); 
            camDrone(dt);
            
            const speed = Math.hypot(dmx, dmz);
            const speedRatio = Math.min(speed, 1);
            const nearObject = checkProximity(drone.position.x, drone.position.y, drone.position.z);
            
            updateDroneAudio(speedRatio, nearObject);
        }
        else {
            updPlayer(dt); 
            camPlayer(dt);
            
            if (worldDrone && !isD) {
                const dx = player.position.x - worldDrone.position.x;
                const dz = player.position.z - worldDrone.position.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                
                if (dist < 3) {
                    $("enterDroneBtn").style.display = "flex";
                } else {
                    $("enterDroneBtn").style.display = "none";
                }
            }
            
            let rem=Math.ceil((droneCd-now)/1000), b=$("droneBtn");
            if (rem>0) { 
                if (b.textContent!=="⏳"+rem) b.textContent="⏳"+rem; 
                b.style.background="#555"; 
                b.style.opacity=".65"; 
            }
            else if (b.textContent!=="🚁") { 
                b.textContent="🚁"; 
                b.style.background="#20c060"; 
                b.style.opacity="1"; 
            }
        }
        updateExplosions(dt);
        
        const a = now * .03;
        if (isD) {
            dAr.forEach((p,i)=>p.rotation.y=a*(i%2?1:-1));
        } else if (worldDrone) {
            worldDroneAr.forEach((p,i)=>p.rotation.y=a*(i%2?1:-1));
        }
    }
    renderer.render(scene,camera);
}
loop();
$("hint").style.display=innerWidth>innerHeight?"none":"block";
</script>
</body>
  </html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Камера</title>
    <style>
        body { margin: 0; padding: 0; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; position: fixed; top: 0; left: 0; }
        #vr-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; font-size: 18px; background: #4CAF50; color: white;
            border: none; border-radius: 25px; cursor: pointer; z-index: 999;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <button id="vr-btn">🥽 Войти в VR</button>

    <script>
        const video = document.getElementById('video');
        
        // Включаем камеру
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'environment' } 
        }).then(stream => {
            video.srcObject = stream;
        });

        // VR кнопка
        document.getElementById('vr-btn').onclick = function() {
            if (video.requestFullscreen) {
                video.requestFullscreen();
            }
            // Поворот экрана для VR очков
            screen.orientation.lock('landscape').catch(() => {});
        };
    </script>
</body>
</html>
